Deck in the middle and bigger, in a blue circle; the Teams tab contains all the teams and all the cards from that team\"). This is a FEATURE, so it lifts the \"style only\" rule (P5-D-6) for this one request and nothing else. Bar: Teams, History, Deck (centre: a 56 dp primary-blue circle, bigger than the 24 dp icons, ring when open, no text label, accessibility label \"Deck\"), Starred, Important. The app still opens on the Deck (unstable_settings.initialRouteName). Teams tab (app/(tabs)/teams.tsx): every joined course with its team dot, \"Ended\" and muted markers; tap opens app/team/[id].tsx (a stack screen in the signed-in guard): that team's cards, newest first, paged on scroll, tap a card for its detail. States: skeleton, empty (with \"Join a team\"), error + retry, offline banner. Backend (additive, read-only): GET /api/v1/teams/{team_id}/cards?limit=&cur","why":"","tags":["security","push","app","data"],"imp":false},{"id":"P5-D-10","phase":"5","src":"log","title":"Teams tab waits for the next build; end-of-phase cleanup (human, 2026-10-27)","date":"","by":"","text":"The human is still judging the preview build, so the Teams tab and its endpoint are folded into the NEXT build (nothing pushed, no new build now). End-of-Phase-5 cleanup (T11), by the human's instruction: delete the throwaway Postgres: stop it with .pgvenv/lib/python3.12/site-packages/pgserver/pginstall/bin/pg_ctl -D .pgd2 stop, then remove .pgvenv/ and .pgd2/ and their two lines in .git/info/exclude. Keep it until then.","why":"","tags":["security","push","app","data"],"imp":false},{"id":"P5-D-11","phase":"5","src":"log","title":"second preview build and the production build (T6/T7, 2026-10-27)","date":"","by":"the human asked for a build with the new tabs (\"once I see the tabs and all, we will move to the production build\"), then for the production build","text":"Preview 2: [id], build number 2 (the preview profile now has autoIncrement so each installs over the last), includes the Teams tab and the five-tab bar. Production: the EAS production environment was EMPTY; the four public EXPO_PUBLIC_* values and the GOOGLE_SERVICES_JSON secret file are shared variables, so production was ADDED to each variable's environments with eas env:update (same values as preview; development and preview unchanged, checked: 5 variables each). Production build [id], version 1.0.0, build number 3, channel production, profile production (APK, autoIncrement, store distribution). Keystore: the same remote credentials (\"Build Credentials [redacted]\", default) as the development and preview builds, so the SHA-1 already on the OAuth client is the production one (the human confirmed it is there). Backend not yet pushed: the Teams card list needs GET /api/v1/teams/{team_id}","why":"","tags":["security","push","app","process"],"imp":false},{"id":"P5-D-12","phase":"5","src":"log","title":"test-reminder button removed; a Reminders list with on/off switches (human request after the production-build checks, 2026-10-27)","date":"","by":"the human, after passing the T7 checks (A2, A6-A9, A12 all pass on the production build): \"you forgot to remove the send a test reminder ","text":".. have a list of reminders which are set ... in starred ... so we can turn it on and off from there\". Another explicit feature request, so it lifts the style-only rule (P5-D-6) for this request only. Removed: Settings \"Send me a test reminder\" row and its state, plus the now-unused scheduleTestReminder in lib/notif-adapter.ts. Reminders list: the Starred tab has a two-way switch, Starred | Reminders. The Reminders view lists every reminder in the next 60 days, soonest first: bell, the event or card title, when, its kind (Automatic / Recommended / Custom) and an on/off switch; a switched-off one stays listed, dimmed, \"Off\", with a crossed bell, so it can be turned back on; tapping the text opens the card. States: skeleton, empty (\"No reminders yet\"), error + retry, offline works through the outbox. Backend (additive): GET /api/v1/reminders/all?days= (1..90, default 60) returns every remi","why":"","tags":["security","ai","push","app"],"imp":false},{"id":"P6A-D-001","phase":"6A","src":"log","title":"T0: the installed build can take the update; the feature flag chain","date":"2026-10-27","by":"Claude","text":"T0 result: PASS, no rebuild needed. The APK installed on the human's phone is the production build (id [id], v1.0.0, build 3): it includes expo-updates (in package.json and app.config.ts at the commit it was built from), channel production, runtimeVersion 1.0.0 (policy appVersion). It already received an OTA update (group [id], 2026-10-27) and the human confirmed it works. The two preview builds (ids b9c9552d…, fc680d78…, channel preview) have the same runtime and the same native fingerprint [hash]; that hash is the baseline T3 compares against. The older DEV build predates expo-haptics and expo-updates and cannot be the T2 test target (see T2). Flag chain: the chat is on only when CHAT_ENABLED=true AND API_ENABLED AND the AI layer is on (keys present) AND the embedder is usable (768 dims). Otherwise POST /api/v1/chat -> 503 and GET /me reports features.chat=false (P6A-DIFF-002).","why":"","tags":["ai","app","process"],"imp":true},{"id":"P6A-D-002","phase":"6A","src":"log","title":"the endpoint, in the order it decides (T1)","date":"","by":"","text":"POST /api/v1/chat {question (1..500 chars), item_id?, history? (last <=6 turns {role,text})}: auth -> chat off? 503 -> validation 400 -> item_id must be in one of the student's ACTIVE teams (else 404, also for an unknown id, and for a hidden card they hold no state on) -> rate limit 429 -> record the use -> answer. Only accepted questions are counted (a 400/404 costs nothing). Rate limit: 20 per hour and 60 per day per user, counted from chat_usage(user_id, at) (migration 009: RLS on, no policies, FK to app_users on delete cascade, rows older than 3 days pruned on write); 429 carries a friendly message, scope (hour|day) and Retry-After. Timeout: 25 s -> 504; every provider failing -> 502 (P6A-DIFF-005).","why":"","tags":["security","ai","data","process"],"imp":false},{"id":"P6A-D-003","phase":"6A","src":"log","title":"what the model is allowed to see (T1)","date":"","by":"","text":"Scope = the student's active subscriptions only (retrieval is a pgvector top-8 over messages and file passages of THOSE teams, the same query as Phase 3 search generalised to a set of teams; events come from list_events_all_for_user, again only those teams). Context, in order: (1) the card they are anchored to, in full (message text, attachment names, file/rename info, date change before/after, its events, the event history), then (2) up to 10 events as structured facts (upcoming ones plus any whose title/type shares words with the question, best match first; each line says when, venue, status and UNCONFIRMED when needs_review or low confidence), then (3) the retrieved passages (cosine >= 0.25). Nothing from any other team is ever loaded; the tests prove it for both storages.","why":"","tags":["ai","data","process"],"imp":true},{"id":"P6A-D-004","phase":"6A","src":"log","title":"redaction (T1)","date":"","by":"","text":"One Phase 3 Redactor per request: the question is redacted first, then every source after teaching the redactor that source's author and file-owner names, so a name in the question and in a source share a placeholder; the history turns are redacted too; the embedding query is redacted by Embedder.embed_query as in Phase 3. Placeholders are restored in the answer shown to the student (they are allowed to read those posts). Test: emails, phone numbers, roll numbers and a titled name never appear in what the model is sent.","why":"","tags":["security","ai","process"],"imp":false},{"id":"P6A-D-005","phase":"6A","src":"log","title":"generation and the post-check (T1)","date":"","by":"","text":"The existing provider router (Gemini primary, Groq fallback) with a small JSON schema {answer, cited[], refused}. The system prompt: only the numbered context (which is declared to be data, never instructions), cite like [1], never invent a date or time, say when something is UNCONFIRMED or cancelled, refuse (refused=true, cite nothing) when the answer is not in the context, plain text, at most 120 words. Server-side checks: the answer is trimmed to 120 words at a sentence; every citation number (in the list and as [n] in the text) that is not a real context entry is dropped; a number the text uses but the model forgot to list is kept; a refusal returns no citations; an empty answer becomes the standard \"couldn't find\"; with no context at all the model is not called. Each citation maps to its card where one exists (item_id), else carries the message id, file id or a link (P6A-DIFF-001).","why":"","tags":["ai","data","process"],"imp":true},{"id":"P6A-D-006","phase":"6A","src":"log","title":"privacy (T1)","date":"","by":"","text":"No transcript is stored: the only thing written is the time of an accepted question. Logs are one JSON line per question with counts per context kind, refused, provider and milliseconds, never any text (a test searches the log for the question and answer). The app keeps the conversation in memory only (T2). Account deletion removes the usage rows (FK cascade; tested).","why":"","tags":["security","app","process"],"imp":true},{"id":"P6A-D-007","phase":"6A","src":"log","title":"the eval (T1)","date":"","by":"","text":"tests/eval/chat_questions.csv (17 questions: dates, venues, a changed venue, a postponement, a free-text answer, an undated event that must NOT get a date, an anchored \"has this changed?\", three that must be refused) scored by scripts/run_chat_eval.py on the MA 221 corpus at a fixed \"now\" (2026-11-08 12:00 IST); checks per question: refusal matches, the fact is in the answer, the expected source is cited, nothing forbidden is said, 120 words or fewer. --dry proves the plumbing offline (hash embeddings plus a stand-in model: NOT a quality result: 9/17 by construction). The real run needs the Gemini and Groq keys and is for the human to run (P6A-DIFF-003); chat_questions_live.csv + --live do the same read-only on the real test team. Tests: backend 1049 pass with a real Postgres (1005 + 44 new across both storages), 815 + 234 skipped without. scripts/smoke_api.py also checks the new endpoin","why":"","tags":["ai","app","data","process"],"imp":false},{"id":"P6A-D-008","phase":"6A","src":"log","title":"first real eval: 16/17; the one miss fixed in the prompt","date":"2026-10-27","by":"","text":"The human ran scripts/run_chat_eval.py with the real keys (gemini-3.5-flash-lite primary, openai/gpt-oss-120b fallback, gemini-embedding-001; 18 model calls, one rate-limited and retried): 16 of 17 fully correct (recorded in PHASE6A_EVAL.md). All 3 questions that must be refused were refused (swallow, cricket, endsem); the undated final presentations got no invented date (#11); the changed venue, the postponed quiz, the moved lab and the extended assignment were all answered from the latest message; the closed-book answer came from free text. The miss, #15 (\"Has this changed?\" anchored to the venue-change card): the model answered \"I couldn't find it in the course messages\" although entry [1] said, in plain words, that the midsem moved to LHC 201/202 (checked offline: the context was complete and correct). Cause: nothing told the model that \"this\" means the anchored card, and the small m","why":"","tags":["ai","push","app","process"],"imp":false},{"id":"P6A-D-009","phase":"6A","src":"log","title":"the app side of \"Ask the course\" (T2, 2026-10-27)","date":"","by":"Claude","text":"JS only, no native change: package.json, package-lock.json, app.config.ts and eas.json are byte-identical to the commit the installed production build was made from (checked with git diff); no new package; the sheet is core Modal + Reanimated (no bottom-sheet or markdown library). Hidden unless the server says it is on: every entry point (header icon, swipe-up, Ask button) needs /me features.chat === true (useChatEnabled); an older server or unknown state means hidden, so with CHAT_ENABLED off the app is exactly the app it was. Swipe up: when onAsk is given, SwipeDeck lets either axis start a drag (activeOffsetX +-10, activeOffsetY up 10, downward still fails so pull-to-refresh keeps working), locks one axis after 10 px for the rest of the drag (lockAxis: dominant axis, a tie goes sideways), an upward drag moves the card up (a third as far) and fades in an \"ASK\" label; on release askOutc","why":"","tags":["ai","app","design","process"],"imp":false},{"id":"P6A-D-010","phase":"6A","src":"log","title":"T3 part 1: the native layer is unchanged","date":"2026-10-27","by":"","text":"npx expo-updates fingerprint:generate --platform android on the T2 code: hash [hash] (57 sources), identical to the fingerprint EAS recorded for the preview builds 1 and 2 and the production build 3. So the chat can ship as an over-the-air update to any of them (runtime 1.0.0). Channel finding (human report: \"the updates are not coming\"): the installed app is the PRODUCTION build 3 (the Phase 5 production update reached it); it listens to channel production. The T2 update (group [id]) was published to preview, which only the preview builds read, and preview build 2 (versionCode 2) cannot be installed over production build 3 (versionCode 3) without uninstalling. Options given to the human: publish T2 to production now (the fingerprint allows it; the chat stays hidden until the server flag is on, and CHAT_ENABLED=false is the kill switch; rollback = republish the previous production group ","why":"","tags":["ai","app","process"],"imp":false},{"id":"P6A-D-011","phase":"6A","src":"log","title":"\"works with a card, not without\": diagnostics, not a guess","date":"2026-10-27","by":"","text":"Human report after the update reached the production app: with a card anchored the chat answers; with no card (\"when is the next quiz\", \"how many quizzes are there next month\") it says \"I couldn't find it in the course messages\". That wording is the model's own refusal (the code's own \"nothing to go on\" sentence differs), so the model got a context and refused. With a card, the card alone carries the answer; without one the answer must come from the other two sources, the events table and the vector search, which worked in the unit tests and in the 17-question eval, so the cause is something in the real data that those did not have (candidates: no embeddings under the model the chat searches; the events list empty or without matches; embeddings present but scoring under the 0.25 floor; the model refusing over a noisy context). I cannot read the production database from this session, so i","why":"","tags":["ai","app","data","process"],"imp":false},{"id":"P6A-D-012","phase":"6A","src":"log","title":"root cause found: the model was never told what day it is","date":"2026-10-27","by":"","text":"The human ran scripts/chat_diagnose.py --email <theirs> \"when is the next quiz\" on the real data. Steps 1-4 were healthy: 1 team, 13 events (10 picked: Quiz 2 on 26 Oct, Quiz 3 on 2 Nov, Quiz 1 on 7 Nov, Quiz 6 on 20 Dec, ...), 106 embeddings under the right model, 27 of them in the team's messages, 8 vector hits scoring 0.73 to 0.79 (all about quizzes, all kept). Step 5: refused. Cause: the prompt carried no current date. \"Next\", \"this week\", \"next month\", \"how many ... next month\" cannot be answered without knowing which events are already past (the real data has quizzes dated 25 Oct, 26 Oct, 2 Nov, 7 Nov and 20 Dec); with a card the question is \"when is this?\", which needs no date arithmetic, which is exactly why it worked. The 17-question eval never asked a question that depends on \"now\", so it could not see it. Fix (server only, no app change): (1) the user prompt now starts with <t","why":"","tags":["ai","app","data","process"],"imp":true},{"id":"P6A-D-013","phase":"6A","src":"log","title":"every answer names the course it came from (human request, 2026-10-27)","date":"","by":"","text":"The human confirmed the date fix works on real data (\"The next quiz is Quiz 3, ... Monday 2 Nov 2026 ... [3]\") and asked that the answer also say which team the fact came from (\"it is very important\"). Reason: once a student is in more than one course an answer without the course is ambiguous. Two layers: (1) the system prompt now says to always name the course of each fact, using the course name that starts every context entry, and to name each course when facts come from more than one; (2) a server-side guarantee that does not depend on the model: after the citation post-check, every course of every CITED source whose name is not already in the answer (case-insensitive) is appended once as \"(from <course>)\", in citation order; a generic placeholder name (\"Course\") is never added; a refusal names no course. The citation payload already carries team. Server only, no app change. Tests: +3","why":"","tags":["ai","app","data","process"],"imp":false},{"id":"P6A-D-014","phase":"6A","src":"log","title":"new cards did not appear until a manual refresh; the app mis-detected \"offline\" (human report, 2026-10-27)","date":"","by":"","text":"Human report: after a Scheduler \"Force run\" and a new post in a newly added team, nothing arrived as a push and the card only appeared after pulling to refresh; also \"the app very easily gets disconnected from the internet and then does not show any updates\". Findings. (1) By design, not a bug: pushes exist only for date-change alerts (on starred, reminded or important events) and for reminders (P4-D-121/137); a new post never pushes. (2) Real gap in the app, found in the code: TanStack Query was never told what \"app comes to the foreground\" or \"connection is back\" mean on a phone (it listens to browser events that React Native never fires), so the deck refreshed only on a cold open, a pull-down, a push or the best-effort background task. (3) A bug I introduced in Phase 5 T5: useOnline (the offline banner, and from T2 the chat input) treated isInternetReachable === false as offline; on a","why":"","tags":["security","ai","push","app"],"imp":false},{"id":"P5-D-13","phase":"5","src":"log","title":"new-card push alerts: a push for a new post or file, even with the app closed (human request, 2026-10-27)","date":"","by":"the human, after waiting 20 minutes for a quiz post: \"I want the notifications to come even when the app is off, and even off the RAM","text":"\" Until now a push existed only for a date change (on a starred, reminded or important event) and for reminders; a new post never pushed (P4-D-121/122). Behaviour: every NEW message card and NEW file card (a file only when it is created, not renamed, moved or modified; change cards keep their own alerts) produces one alert per subscriber, queued in the same push_outbox and sent by the same push-alerts step of run-all, so a post becomes a card and its push in the same run. Rules, per subscriber: not if the team is muted or they left; not if they switched \"New posts and files\" off (new setting new_card_alerts, default ON, validated like the others, a switch in Settings); not for history (a card posted before they joined the team, or more than 48 h ago, i.e. a backfill, is not news); urgent-only mode: only when the card is about an event of an important type; quiet hours hold it until the w","why":"","tags":["security","push","app","data"],"imp":true},{"id":"P5-D-14","phase":"5","src":"log","title":"the website is redesigned from the human's answers: skim-site/DESIGN_NEW.md","date":"2026-10-27","by":"the human (answers to a short interview), with the ui-ux-pro-max skill for options and a computed contrast check","text":"skim-site/DESIGN.md (a monochrome shadcn reference the human supplied) is NOT used as a system, only its taste (quiet, hairline, large radii, tight headlines). Decisions: (1) no public download. Skim works only in the human's Microsoft environment today (single-tenant bot, codes from those teams), so the page's job is to invite professors, organisations and companies to COLLABORATE on the testing phase; the main button is \"Collaborate with us\" (a mailto:); \"plans for organisations are coming\" with no prices or dates; the APK is shared privately. This supersedes P5-D-110 for the site (no GitHub Release APK) and changes T9/T10: collaborators must be added as Google test users until the consent screen moves to production. (2) Structure: a scroll story with one large pinned phone (5 chapters: a post in Teams, it becomes a card, swipe, dates move and alerts, Ask the course), then \"Also\" tiles","why":"","tags":["security","push","app","infra"],"imp":true},{"id":"P5-D-15","phase":"5","src":"log","title":"the website is built from DESIGN_NEW.md","date":"2026-10-27","by":"","text":"The site generator (skim-site/build.py) now implements skim-site/DESIGN_NEW.md: a scroll story (hero + 5 chapters) with one pinned phone whose screen cross-fades (250 ms) to follow the chapter crossing the middle of the viewport, \"And the rest of it\" tiles, a collaboration section (professors / organisations and companies / students, one \"Collaborate with us\" mailto: with a pre-filled subject and body), \"Privacy, plainly\", a footer (\"not affiliated with Microsoft\", \"not official IISc software\"), and /privacy/ (updated for the chat, new-post alerts, and that questions and answers are not stored). No download, no APK, no GitHub Release (P5-D-14). Contact [email] (given by the human; a Microsoft 365 address: it needs an Exchange mailbox to receive outside mail, to be tested before launch). Screenshots are the human's own, processed by tools/process_shots.py (status bar cropped because it sh","why":"","tags":["security","ai","push","app"],"imp":false},{"id":"P5-D-16","phase":"5","src":"log","title":"site fixes after the human's review","date":"2026-10-27","by":"","text":"(1) The pinned phone was cut off by the navbar and not centred: its position was a fixed 50vh - 340px, which put the top under the 64 px sticky header on windows under about 790 px tall. Now the pin is a full-height flex box below the navbar (top: 64px; height: 100vh - 64px) that centres the phone, and the phone's width is capped by the height that is left, so it can never touch the header or the bottom edge; the hero and chapters are 100vh - 64px tall so the text and the phone share one centre line. Verified by measurement, not by eye, at 7 window sizes (1280x900, 1366x650, 1366x768, 1440x800, 1920x1080, 1024x600, 860x700) on the hero and three chapters (28 checks: top clears the header by 8 px or more, bottom inside the window, vertical centre within 3 px of the space below the navbar, horizontal centre within 2 px of its column): all pass. (2) The human replaced reminders-light with t","why":"","tags":["security","push","app","design"],"imp":false},{"id":"P2-D-101","phase":"2","src":"spec","title":"Prerequisite","date":"","by":"the human (spec)","text":"Prerequisite: Phase 1 channel-message capture must work before Phase 2 code starts (task T0). | Phase 2 dedupes backfill against live messages. If live channel capture is broken, nothing can be validated.","why":"","tags":["data","design"],"imp":false},{"id":"P2-D-102","phase":"2","src":"spec","title":"Graph calls use app-only (client-credentials) tokens from the bot's existing Entra app (sa","date":"","by":"the human (spec)","text":"Graph calls use app-only (client-credentials) tokens from the bot's existing Entra app (same CLIENTID/SECRET/TENANTID as the bot). No second app registration. | One identity to manage. RSC consents are granted to this app.","why":"","tags":["security","app"],"imp":false},{"id":"P2-D-103","phase":"2","src":"spec","title":"Token acquisition uses MSAL (already a dependency through the Agents SDK) with an in-memor","date":"","by":"the human (spec)","text":"Token acquisition uses MSAL (already a dependency through the Agents SDK) with an in-memory token cache. HTTP uses the existing aiohttp client. No new HTTP library. | Fewer dependencies.","why":"","tags":["security"],"imp":false},{"id":"P2-D-104","phase":"2","src":"spec","title":"Message backfill uses the RSC grant (ChannelMessage.Read.Group, already consented per team","date":"","by":"the human (spec)","text":"Message backfill uses the RSC grant (ChannelMessage.Read.Group, already consented per team) for Graph reads of that team's channel messages. ChannelMessage.Read.All (tenant-wide, admin-consented) is only a fallback if the spike shows RSC isn't enough. | Least privilege. RSC is scoped to the teams that installed the bot.","why":"","tags":["security","app","process"],"imp":false},{"id":"P2-D-105","phase":"2","src":"spec","title":"Files need a Graph application permission","date":"","by":"the human (spec)","text":"Files need a Graph application permission. As far as we know, RSC has no file permissions. The test tenant uses Files.Read.All (admin-consented). The production plan is Sites.Selected, scoped to each team's SharePoint site. The spike checks whether Sites.Selected works with /filesFolder. | Files tab = SharePoint document library, outside RSC's scope.","why":"","tags":["security","app","design","process"],"imp":true},{"id":"P2-D-106","phase":"2","src":"spec","title":"Metadata only","date":"","by":"the human (spec)","text":"Metadata only. Never download file content. Store name, path, size, type, timestamps, people, web link and Graph ids. | Storage, privacy and permissions. Files stay authoritative in SharePoint (Phase 1 decision).","why":"","tags":["security","data","process"],"imp":false},{"id":"P2-D-107","phase":"2","src":"spec","title":"No background loops","date":"","by":"the human (spec)","text":"No background loops. Sync and backfill run inside HTTP job endpoints called by an external scheduler. The host scales to zero and throttles CPU after a response, so background tasks are unreliable. | Fits the serverless host.","why":"","tags":["infra"],"imp":false},{"id":"P2-D-108","phase":"2","src":"spec","title":"Job endpoints are protected by a separate JOBS_TOKEN (bearer, constant-time compare)","date":"","by":"the human (spec)","text":"Job endpoints are protected by a separate JOBS_TOKEN (bearer, constant-time compare). If it's unset, the job endpoints return 404. | Separate blast radius from DEBUG_TOKEN.","why":"","tags":["security"],"imp":false},{"id":"P2-D-109","phase":"2","src":"spec","title":"Jobs are resumable and time-boxed","date":"","by":"the human (spec)","text":"Jobs are resumable and time-boxed. Each run stops after JOB_TIME_BUDGET_SECONDS, saves its cursor, and returns status: \"partial\". The next run continues. | Host request timeouts. Large teams can't finish in one request.","why":"","tags":[],"imp":true},{"id":"P2-D-110","phase":"2","src":"spec","title":"One job at a time, using a lease row in job_locks (name, holder, expires_at; migration 004","date":"","by":"the human (spec)","text":"One job at a time, using a lease row in job_locks (name, holder, expires_at; migration 004; lease = JOB_TIME_BUDGET_SECONDS + 120 s). Acquire is one atomic insert-or-update that succeeds only if the row is free or expired; release deletes it. It works through the Supabase transaction pooler (:6543), where session advisory locks do not (P2-D-130). The lock is a single global one (P2-D-126). If it is held, a second call returns status: \"busy\" immediately. | Overlapping scheduler calls must not double-process.","why":"","tags":["security","app","data","infra"],"imp":true},{"id":"P2-D-111","phase":"2","src":"spec","title":"Raw-first for Graph too","date":"","by":"the human (spec)","text":"Raw-first for Graph too. Every Graph item fetched (driveItem, chatMessage, channel) is stored unmodified in graph_raw before normalising, deduped by content hash. | Same reasoning as Phase 1's raw-first decision.","why":"","tags":["ai","app","data","process"],"imp":false},{"id":"P2-D-112","phase":"2","src":"spec","title":"Delta strategy (revised by P2-D-120, P2-DIFF-002)","date":"","by":"the human (spec)","text":"Delta strategy (revised by P2-D-120, P2-DIFF-002): use per-channel folder delta (/drives/{d}/items/{folder}/delta) as the primary method. The spike showed it works. Root delta on the drive plus filtering by tracked folder ids is the fallback only if a folder delta call fails. | Smaller change feeds; spike-verified.","why":"","tags":["process"],"imp":false},{"id":"P2-D-113","phase":"2","src":"spec","title":"Files are soft-deleted (deleted_at)","date":"","by":"the human (spec)","text":"Files are soft-deleted (deleted_at). Every change also writes a document_events row (created, modified, renamed, moved, deleted, restored). | Phase 3 needs \"new file posted\" and \"file renamed\" signals.","why":"","tags":["security"],"imp":false},{"id":"P2-D-114","phase":"2","src":"spec","title":"Backfilled messages go into the same messages table, with source = 'graph'","date":"","by":"the human (spec)","text":"Backfilled messages go into the same messages table, with source = 'graph'. Live messages have source = 'live'. If a message already exists from live capture, backfill never overwrites live data. It only fills empty fields and records a backfilled note. | One message model. Live events are the higher-fidelity source.","why":"","tags":["ai","app","data"],"imp":false},{"id":"P2-D-115","phase":"2","src":"spec","title":"Dedupe key for messages is (conversation_id, message_id)","date":"","by":"the human (spec)","text":"Dedupe key for messages is (conversation_id, message_id). Working assumption: Graph chatMessage id equals the Teams activity id, and the Graph channel id equals the bot's channel conversation id (without ;messageid= suffix). The spike verifies this. If it's wrong, add a mapping and log a DIFF. | Avoids duplicates between live and backfill.","why":"","tags":["ai","data","process"],"imp":false},{"id":"P2-D-116","phase":"2","src":"spec","title":"Channels in scope (revised 2026-10-24, P2-D-124)","date":"","by":"the human (spec)","text":"Channels in scope (revised 2026-10-24, P2-D-124): only channels with membershipType = \"standard\" are discovered, synced or backfilled. Private and shared channels are out of scope and skipped entirely: no rows in channels, documents or messages, and no Graph calls to them beyond the channel list. Job stats carry a skipped count only (no names). Phase 1 drops live activities from private/shared channels before raw storage. | Privacy; separate SharePoint sites and permissions.","why":"","tags":["security","data","design"],"imp":false},{"id":"P2-D-117","phase":"2","src":"spec","title":"Install triggers sync lazily","date":"","by":"the human (spec)","text":"Install triggers sync lazily. When the bot is installed, the team is marked needs_initial_sync = true. The next scheduled job does discovery, the full file sync and the backfill. Nothing slow runs inside a Teams request. | Teams needs fast responses (Phase 1 lesson), and the CPU throttles after a response.","why":"","tags":[],"imp":false},{"id":"P2-D-118","phase":"2","src":"spec","title":"Throttling","date":"","by":"the human (spec)","text":"Throttling: honour Retry-After on 429/503, exponential backoff with jitter on 5xx, max GRAPH_MAX_CONCURRENCY (default 4) parallel requests, and always follow @odata.nextLink paging. | Graph throttles aggressively.","why":"","tags":["app"],"imp":false},{"id":"P3-D-001","phase":"3","src":"spec","title":"LLM providers","date":"","by":"the human (spec)","text":"LLM providers: Groq is primary, with the model set by GROQ_MODEL (a production model that supports JSON/structured output, chosen in T1). Gemini free tier is the fallback, with GEMINI_MODEL defaulting to gemini-2.5-flash-lite (the free Flash-Lite model the T1 spike confirms). Model names live only in config. | Free. Fallback because free tiers change and rate-limit.","why":"","tags":["ai","process"],"imp":false},{"id":"P3-D-002","phase":"3","src":"spec","title":"Fallback order","date":"","by":"the human (spec)","text":"Fallback order: try Groq. On a 429, 5xx, timeout or invalid output after one repair retry, try Gemini. If both fail, mark the item failed with the error class and retry it on a later run, with a max attempt count. | Never block the pipeline; never lose an item.","why":"","tags":["ai"],"imp":true},{"id":"P3-D-003","phase":"3","src":"spec","title":"Embeddings","date":"","by":"the human (spec)","text":"Embeddings: gemini-embedding-001 on the Gemini free tier, 768 dimensions (output_dimensionality=768). Cosine similarity, HNSW index in pgvector. Store the model name and dimension with each vector. | Free; 768 fits pgvector's HNSW limit (2000 dims); pinned so vectors stay comparable.","why":"","tags":["ai","data"],"imp":true},{"id":"P3-D-004","phase":"3","src":"spec","title":"Privacy redaction before any LLM or embedding call","date":"","by":"the human (spec)","text":"Privacy redaction before any LLM or embedding call. Replace emails, phone numbers, roll/SR numbers, and person names with placeholders ([PERSON_1], [EMAIL_1]…). Person names come from messages.from_name, mention entities, team members if available, and a \"Prof./Dr./Mr./Ms. + Name\" pattern. The mapping lives only in memory for that call, is never stored or logged, and is reversed on the output if needed. | Free tiers may use prompts for training. Class data must not identify people.","why":"","tags":["security","ai","process"],"imp":true},{"id":"P3-D-005","phase":"3","src":"spec","title":"Structured output only","date":"","by":"the human (spec)","text":"Structured output only. Every LLM call asks for JSON matching a Pydantic schema (§5.3). Invalid JSON or a schema violation gets one \"repair\" retry, then fallback (P3-D-002). | Reliable parsing; prompt-injection resistant.","why":"","tags":["ai","data"],"imp":true},{"id":"P3-D-006","phase":"3","src":"spec","title":"Prompts are files in the repo (src/skim/ai/prompts/*.md) with a PROMPT_VERSION constant","date":"","by":"the human (spec)","text":"Prompts are files in the repo (src/skim/ai/prompts/*.md) with a PROMPT_VERSION constant. Each stored result records the provider, model, prompt version and processed_at. | Reproducible; lets eval runs be compared.","why":"","tags":["ai"],"imp":false},{"id":"P3-D-007","phase":"3","src":"spec","title":"Process each item once","date":"","by":"the human (spec)","text":"Process each item once. The processing key is (conversation_id, message_id, message_version, PROMPT_VERSION); the provider and model that answered are stored on the row. *(Changed 2026-10-26, P3-DIFF-008: no EXTRACT_MODEL_FAMILY in the key. Bump PROMPT_VERSION when you switch the primary model and want old messages re-analysed.)* A message is re-processed only when it's edited (new version) or when the human bumps PROMPT_VERSION and runs a re-process job. | Cost and rate-limit safety; idempotent jobs.","why":"","tags":["ai","data","process"],"imp":false},{"id":"P3-D-008","phase":"3","src":"spec","title":"Two-stage pipeline per message","date":"","by":"the human (spec)","text":"Two-stage pipeline per message: (1) classify and extract (category + candidate events), then (2) resolve each candidate against the course's open events: match an existing event, or create a new one. Resolution uses deterministic matching first (same type + similar title + close date), and asks the LLM only when it's ambiguous, giving it a short candidate list. | Reminders and corrections must update, not duplicate. Cheaper and more predictable than one huge prompt.","why":"","tags":["ai","push","app","data"],"imp":true},{"id":"P3-D-009","phase":"3","src":"spec","title":"Context given to the LLM","date":"","by":"the human (spec)","text":"Context given to the LLM: the message text and subject; its posted time in IST, with weekday; the parent message text if it's a reply; and for resolution, a compact list of the course's open events (id, type, title, date/time, venue, status). Nothing else: no other students' messages, no names (P3-D-004). | Enough to resolve \"same time\", \"the lab\", \"tomorrow\" without leaking data.","why":"","tags":["ai"],"imp":false},{"id":"P3-D-010","phase":"3","src":"spec","title":"Time rules (§3.3) are enforced in code after the LLM","date":"","by":"the human (spec)","text":"Time rules (§3.3) are enforced in code after the LLM: the LLM proposes, and code validates and normalises. The LLM returns either an absolute date/time or a structured relative expression, and code computes the final date from the posted time. | LLMs are bad at calendar arithmetic. Code is exact and testable.","why":"","tags":["ai","app","data","process"],"imp":true},{"id":"P3-D-011","phase":"3","src":"spec","title":"Never invent a time","date":"","by":"the human (spec)","text":"Never invent a time. If no time is stated or resolvable from an existing event, store a date only (time_known = false). Exception: deadlines (assignment, project) with no time default to 23:59 IST, marked time_defaulted = true. | Wrong times are worse than missing times.","why":"","tags":[],"imp":true},{"id":"P3-D-012","phase":"3","src":"spec","title":"Confidence is high, medium or low on every event and change","date":"","by":"the human (spec)","text":"Confidence is high, medium or low on every event and change. low events are saved with needs_review = true and never produce Phase 4 alerts on their own. | Lets the app treat uncertain extractions carefully.","why":"","tags":["ai","push","app","process"],"imp":true},{"id":"P3-D-013","phase":"3","src":"spec","title":"Events are per team (team = course)","date":"","by":"the human (spec)","text":"Events are per team (team = course). A message only affects its own team's events. | Simple isolation.","why":"","tags":[],"imp":false},{"id":"P3-D-014","phase":"3","src":"spec","title":"Documents","date":"","by":"the human (spec)","text":"Documents: extract text from PDF (pypdf), Word (python-docx) and PowerPoint (python-pptx) files in the Files tab when they're new or their content changed (cTag). Download into memory only, extract, discard. Limits are DOC_MAX_BYTES (20 MB) and DOC_MAX_PAGES (50). Others are skipped with a recorded reason. No OCR. | Phase 2 kept file bytes out entirely; this is the minimal, controlled exception.","why":"","tags":["ai","app","infra"],"imp":false},{"id":"P3-D-015","phase":"3","src":"spec","title":"The Phase 2 \"no file content\" rule changes","date":"","by":"the human (spec)","text":"The Phase 2 \"no file content\" rule changes: only src/skim/ai/documents.py may download content, only via /drives/{d}/items/{i}/content, in memory, within the limits. The no-file-content test is updated to enforce exactly this: every other module still fails the test. | Keeps the guarantee as tight as possible.","why":"","tags":["app","process"],"imp":false},{"id":"P3-D-016","phase":"3","src":"spec","title":"Stored document text is chunks only (doc_chunks, about 800 tokens with ~100 overlap, plus ","date":"","by":"the human (spec)","text":"Stored document text is chunks only (doc_chunks, about 800 tokens with ~100 overlap, plus page numbers), stored unredacted in our DB (it's the professor's course material) but redacted before any LLM or embedding call. | Needed for Phase 5 search; privacy for external calls.","why":"","tags":["security","ai"],"imp":false},{"id":"P3-D-017","phase":"3","src":"spec","title":"AI runs inside run-all after the Phase 2 steps, with per-run limits","date":"","by":"the human (spec)","text":"AI runs inside run-all after the Phase 2 steps, with per-run limits: AI_MAX_MESSAGES_PER_RUN (200), AI_MAX_DOCS_PER_RUN (10), AI_MAX_EMBEDS_PER_RUN (500), all within the job time budget. Separate endpoints exist for manual runs. | Uses the existing scheduler and lock.","why":"","tags":["infra"],"imp":false},{"id":"P3-D-018","phase":"3","src":"spec","title":"Kill switch","date":"","by":"the human (spec)","text":"Kill switch: AI_ENABLED=false turns off every Phase 3 step without affecting Phases 1–2. | Safe rollout and cost control.","why":"","tags":[],"imp":false},{"id":"P3-D-019","phase":"3","src":"spec","title":"Students' messages are classified (usually question or chitchat) but can't create or chang","date":"","by":"the human (spec)","text":"Students' messages are classified (usually question or chitchat) but can't create or change events. Only staff can: team owners, or a configured allow-list. If the author's role is unknown, treat them as staff but set confidence to at most medium. | A student saying \"quiz moved?\" must not move the quiz.","why":"","tags":["security","ai"],"imp":true},{"id":"P3-D-020","phase":"3","src":"spec","title":"The eval set is the source of truth for quality","date":"","by":"the human (spec)","text":"The eval set is the source of truth for quality. tests/eval/eval_messages.csv (human-corrected) is replayed in order through the real pipeline, carrying state, so later messages resolve against earlier events. | Measures the real behaviour, including dedupe and changes.","why":"","tags":["ai","app","data","process"],"imp":true},{"id":"P4-D-101","phase":"4","src":"spec","title":"App","date":"","by":"the human (spec)","text":"App: Expo SDK 58, TypeScript, expo-router (the existing starter in App/skim/), Reanimated + Gesture Handler for swipes, expo-dev-client. Android only. Package in.skimforteams.app.","why":"","tags":["app"],"imp":false},{"id":"P4-D-102","phase":"4","src":"spec","title":"Builds","date":"","by":"the human (spec)","text":"Builds: EAS cloud builds (free tier). Profiles development (dev client, APK, internal) and preview (APK, internal); production is defined but unused. No local Android SDK.","why":"","tags":["app","infra","process"],"imp":false},{"id":"P4-D-103","phase":"4","src":"spec","title":"Auth","date":"","by":"the human (spec)","text":"Auth: Supabase Auth with Google, using native sign-in via @react-native-google-signin/google-signin. The app sends the Google ID token to supabase.auth.signInWithIdToken({provider: 'google', token}). No browser redirect, no email or OTP.","why":"","tags":["security","app","data"],"imp":true},{"id":"P4-D-104","phase":"4","src":"spec","title":"Backend","date":"","by":"the human (spec)","text":"Backend: the existing aiohttp Cloud Run service gets /api/v1/*. Every route requires Authorization: Bearer <Supabase access token>. Verification uses Supabase JWKS (asymmetric signing keys; the project has migrated). It falls back to HS256 with the legacy secret only when a token's alg is HS256.","why":"","tags":["security","data","infra"],"imp":false},{"id":"P4-D-105","phase":"4","src":"spec","title":"Supabase is used only for auth by the app","date":"","by":"the human (spec)","text":"Supabase is used only for auth by the app. The app never queries tables through supabase-js or PostgREST. All data goes through /api/v1.","why":"","tags":["security","app","data"],"imp":true},{"id":"P4-D-106","phase":"4","src":"spec","title":"Joining","date":"","by":"the human (spec)","text":"Joining: pairing code only, case-insensitive, spaces ignored. A team whose bot was removed (teams.removed_at) cannot be joined (HTTP 410). Join attempts are limited to 10 per user per hour.","why":"","tags":[],"imp":false},{"id":"P4-D-107","phase":"4","src":"spec","title":"One combined deck across all of a user's teams, newest first (by when the thing happened i","date":"","by":"the human (spec)","text":"One combined deck across all of a user's teams, newest first (by when the thing happened in Teams). Every card shows its team name.","why":"","tags":["app"],"imp":true},{"id":"P4-D-108","phase":"4","src":"spec","title":"What becomes a card (a \"feed item\"), each a separate card","date":"","by":"the human (spec)","text":"What becomes a card (a \"feed item\"), each a separate card: (a) a message (root post or reply) that is staff-authored, or whose AI category is event, change, announcement or resource; (b) a document event on a staff-authored or unknown-author file: created, renamed, moved, deleted, restored, plus modified coalesced to at most one card per file per 6 h; (c) an event change of type rescheduled, cancelled, uncancelled, venue_changed, time_set, date_set or details_changed. Never cards: bot messages, created / restated / needs_review changes, and student chitchat or questions.","why":"","tags":["security","ai","process"],"imp":false},{"id":"P4-D-109","phase":"4","src":"spec","title":"No double cards for file posts","date":"","by":"the human (spec)","text":"No double cards for file posts. If a document's created event is linked to an attachment of a message that is already a card, it does not get its own card. It shows as a file chip on the message card.","why":"","tags":[],"imp":false},{"id":"P4-D-110","phase":"4","src":"spec","title":"Merge rule","date":"","by":"the human (spec)","text":"Merge rule: when a change card for event E is dealt while older unswiped cards linked to E (messages or earlier changes) are still in the user's deck, they are folded into the newest change card. The card shows the update with the original(s) inside. Swiping it applies the same state to all folded items.","why":"","tags":["app"],"imp":false},{"id":"P4-D-111","phase":"4","src":"spec","title":"Swipes","date":"","by":"the human (spec)","text":"Swipes: left means *dismiss* (to history) with a 5 s undo toast. Right means *open*: a full-screen detail with actions, and closing it sends the card to history. Visible ✕ and open buttons do the same, for accessibility.","why":"","tags":["app"],"imp":false},{"id":"P4-D-112","phase":"4","src":"spec","title":"New-team backlog","date":"","by":"the human (spec)","text":"New-team backlog: on joining, the deck gets items from the last 7 days plus every item linked to a still-upcoming event. Older items are never dealt.","why":"","tags":["app","process"],"imp":false},{"id":"P4-D-113","phase":"4","src":"spec","title":"History","date":"","by":"the human (spec)","text":"History: the user's last N swiped items, newest swiped first. N defaults to 50 and ranges 10–500 in settings. Any history item can be \"put back\" in the deck.","why":"","tags":["app"],"imp":false},{"id":"P4-D-114","phase":"4","src":"spec","title":"Stars","date":"","by":"the human (spec)","text":"Stars: a star never expires. A temporary star lasts 1 day, 3 days, 7 days, or \"until it's over\" (only for event-linked cards: the event's end, or its start + 1 h if there is no end). Expired stars disappear from Starred at read time; no job is needed.","why":"","tags":[],"imp":false},{"id":"P4-D-115","phase":"4","src":"spec","title":"Snooze","date":"","by":"the human (spec)","text":"Snooze: 1 hour, tonight 20:00, tomorrow 09:00, or \"before the event\" (the recommended same-day time, below). The card leaves the deck and returns at the top when the snooze ends. No notification.","why":"","tags":["push","app"],"imp":false},{"id":"P4-D-116","phase":"4","src":"spec","title":"Recommended reminders (offered on any card linked to an event with a date)","date":"","by":"the human (spec)","text":"Recommended reminders (offered on any card linked to an event with a date): day before at 20:00, and same day, 5 h before the start but never earlier than 07:00. If a clamped time would land at or after the start, it is dropped. All three numbers (20:00, 5 h, 07:00) are user settings. Example: a quiz on Mon 2 Nov at 10:00 gets reminders on Sun 1 Nov 20:00 and Mon 2 Nov 07:00 (05:00 is clamped up). A deadline with no explicit time (23:59) gets day-before 20:00 and same day 18:59.","why":"","tags":["push"],"imp":false},{"id":"P4-D-117","phase":"4","src":"spec","title":"Automatic reminders","date":"","by":"the human (spec)","text":"Automatic reminders: if the setting \"auto reminders for important types\" is on (default on), every upcoming event whose type is ticked in the Important checklist gets the recommended pair automatically. The exceptions are needs_review or low-confidence events, which show as \"unconfirmed\" and are never auto-reminded. Auto reminders are *virtual* until the user edits or deletes one; then a real row (or tombstone) is stored.","why":"","tags":["security","ai","push","process"],"imp":false},{"id":"P4-D-118","phase":"4","src":"spec","title":"Manual reminders","date":"","by":"the human (spec)","text":"Manual reminders: a reminder on an event-linked card is stored as an offset from the event start. One on a card with no event is stored as an absolute time.","why":"","tags":["push"],"imp":false},{"id":"P4-D-119","phase":"4","src":"spec","title":"Reminders move with events","date":"","by":"the human (spec)","text":"Reminders move with events: offsets are re-applied whenever the event's start changes. Reminders on a cancelled event are suppressed, not deleted, and come back if it's uncancelled. Reminders in the past are never scheduled.","why":"","tags":["security","push"],"imp":true},{"id":"P4-D-120","phase":"4","src":"spec","title":"The server computes all reminder fire times (one Python module, fully unit-tested)","date":"","by":"the human (spec)","text":"The server computes all reminder fire times (one Python module, fully unit-tested). The app just schedules what /api/v1/reminders returns as local notifications, for the next 30 days and at most 60 of them. Reminders made offline get scheduled after the next sync.","why":"","tags":["push","app","process"],"imp":true},{"id":"P4-D-121","phase":"4","src":"spec","title":"Push is only for change alerts, sent through Expo Push Service ([url]","date":"","by":"the human (spec)","text":"Push is only for change alerts, sent through Expo Push Service ([url] batches of ≤100, with the expo-access-token as Bearer). Every push also carries data: {type: \"sync\", item_id}, so the app re-syncs and reschedules. Receipts are checked, and tokens that come back DeviceNotRegistered are disabled.","why":"","tags":["security","push","app","process"],"imp":true},{"id":"P4-D-122","phase":"4","src":"spec","title":"Who gets a change alert","date":"","by":"the human (spec)","text":"Who gets a change alert: subscribers of the team who haven't muted it and haven't left it, where the event is starred, has a reminder (real or auto), or is a ticked important type. In urgent-only mode, only the important-type condition counts. Never for needs_review or low-confidence changes on their own, and never for events already over.","why":"","tags":["ai","push","process"],"imp":true},{"id":"P4-D-123","phase":"4","src":"spec","title":"Quiet hours (default 23:00–07:00, on)","date":"","by":"the human (spec)","text":"Quiet hours (default 23:00–07:00, on): pushes due inside the window are held until it ends. Local reminders the user has (recommended, auto or manual) still fire, since the 07:00 clamp already covers the defaults.","why":"","tags":["push","process"],"imp":false},{"id":"P4-D-124","phase":"4","src":"spec","title":"Mute per team stops pushes for that team only","date":"","by":"the human (spec)","text":"Mute per team stops pushes for that team only. Cards still arrive, and reminders still fire.","why":"","tags":["push","process"],"imp":false},{"id":"P4-D-125","phase":"4","src":"spec","title":"Important checklist","date":"","by":"the human (spec)","text":"Important checklist: event types quiz, exam, assignment, project, lab, class, office_hours, presentation, other. By default quiz, exam and assignment are ticked. Cards linked to a ticked type are highlighted red (per design.md). They are not reordered; the deck stays newest first.","why":"","tags":["app","design"],"imp":false},{"id":"P4-D-126","phase":"4","src":"spec","title":"Bot removed from a team","date":"","by":"the human (spec)","text":"Bot removed from a team: the team becomes read-only for students. It shows as \"ended\", gets no new cards, keeps its history and stars, and future reminders still fire. The student can remove it.","why":"","tags":["push"],"imp":false},{"id":"P4-D-127","phase":"4","src":"spec","title":"Feed items are materialised in a feed_items table by a new feed-build job inside run-all, ","date":"","by":"the human (spec)","text":"Feed items are materialised in a feed_items table by a new feed-build job inside run-all, run after the AI jobs. Card *content* is joined live when read, so edits show up.","why":"","tags":["app","data"],"imp":true},{"id":"P4-D-128","phase":"4","src":"spec","title":"Message edits don't create a new card","date":"","by":"the human (spec)","text":"Message edits don't create a new card. The card shows the latest text with an \"edited\" label, unless the AI produces an event change, which gets its own card per D-108. Deleted messages are hidden from the deck; in history they show as \"deleted in Teams\".","why":"","tags":["security","app","process"],"imp":false},{"id":"P4-D-129","phase":"4","src":"spec","title":"Open in Teams uses the Teams message deep link ([url])","date":"","by":"the human (spec)","text":"Open in Teams uses the Teams message deep link ([url]) through Linking.openURL. If Teams isn't installed, the browser opens it. Open file uses the document's web URL. The full message text is always shown in-app as well.","why":"","tags":["app"],"imp":false},{"id":"P4-D-130","phase":"4","src":"spec","title":"Add to calendar uses expo-calendar's system \"create event\" UI, prefilled with title, start","date":"","by":"the human (spec)","text":"Add to calendar uses expo-calendar's system \"create event\" UI, prefilled with title, start, end (default start + 1 h; deadlines are 15 min ending at the deadline), venue, and the Teams link in the notes. No calendar permissions are kept.","why":"","tags":["security","app"],"imp":false},{"id":"P4-D-131","phase":"4","src":"spec","title":"Offline","date":"","by":"the human (spec)","text":"Offline: TanStack Query with a persisted cache, plus a persisted mutation outbox. Swipes, stars, snoozes and reminder edits work offline and replay in order. The server is the source of truth; on conflict, the last write wins.","why":"","tags":["push","app"],"imp":true},{"id":"P4-D-132","phase":"4","src":"spec","title":"Background sync","date":"","by":"the human (spec)","text":"Background sync: expo-background-task (best effort, about every 15 min or more) calls /api/v1/sync and reschedules local notifications. Opening the app also syncs.","why":"","tags":["push","app"],"imp":false},{"id":"P4-D-133","phase":"4","src":"spec","title":"Timezone","date":"","by":"the human (spec)","text":"Timezone: everything is shown and computed in Asia/Kolkata for Phase 4. It's stored on the user for later.","why":"","tags":[],"imp":false},{"id":"P4-D-134","phase":"4","src":"spec","title":"Account deletion (Settings → Delete account) removes every row for that user, all devices,","date":"","by":"the human (spec)","text":"Account deletion (Settings → Delete account) removes every row for that user, all devices, and their Supabase auth user. The last step is tried through SQL on auth.users; if that's not permitted, see Spike S5.","why":"","tags":["security","data","process"],"imp":true},{"id":"P4-D-135","phase":"4","src":"spec","title":"Staff means STAFF_AAD_IDS, the same as Phase 3.","date":"","by":"the human (spec)","text":"Staff means STAFF_AAD_IDS, the same as Phase 3.","why":"","tags":[],"imp":false},{"id":"P4-D-136","phase":"4","src":"spec","title":"Database exposure","date":"","by":"the human (spec)","text":"Database exposure: the app ships the Supabase publishable key, so PostgREST must not expose any table. RLS is enabled on every public table (no policies; the backend's postgres role bypasses RLS), and the human turns off the Data API. See T0.","why":"","tags":["security","app","data"],"imp":true},{"id":"P4-D-137","phase":"4","src":"spec","title":"Push text contains course and event info only (e.g","date":"","by":"the human (spec)","text":"Push text contains course and event info only (e.g. \"Quiz 1 moved → Mon 2 Nov 10:00, LHC 104\"). It never contains a person's name or raw message text.","why":"","tags":["push","process"],"imp":false},{"id":"P5-D-101","phase":"5","src":"spec","title":"Order","date":"","by":"the human (spec)","text":"Order: logo → palette → app polish → release build → website. The logo comes first because it feeds the app icon, the splash screen and the site.","why":"","tags":["app","design","process"],"imp":false},{"id":"P5-D-102","phase":"5","src":"spec","title":"Logo","date":"","by":"the human (spec)","text":"Logo: Claude Code designs 3 distinct original concepts as SVG. It must not use the Microsoft Teams logo or any Microsoft or Google branding, and nothing that resembles them. The human picks one, iterates, and approves it. No asset work starts before approval.","why":"","tags":["design","process"],"imp":false},{"id":"P5-D-103","phase":"5","src":"spec","title":"The palette is a proposal until the human approves it","date":"","by":"the human (spec)","text":"The palette is a proposal until the human approves it. design.md stays the human's file. Claude Code writes the proposal to Bookkeeping/design-palette.md plus an HTML preview page, and edits design.md only after the human says so.","why":"","tags":["design","process"],"imp":false},{"id":"P5-D-104","phase":"5","src":"spec","title":"Colour coding","date":"","by":"the human (spec)","text":"Colour coding: every event type gets its own vibrant hue (quiz, exam, assignment, project, lab, class, office_hours, presentation, other), used identically in chips, the Important checklist, detail headers and the site. Each team gets an auto-assigned accent from a separate team palette (a dot or stripe on its cards). Red is reserved for \"important\" only; no type or team may use a hue that could be mistaken for it. Change cards get one shared \"update\" colour.","why":"","tags":["app","design"],"imp":false},{"id":"P5-D-105","phase":"5","src":"spec","title":"Colour rules","date":"","by":"the human (spec)","text":"Colour rules: light and dark themes both. Text on any colour meets WCAG AA (4.5:1 for body text, 3:1 for large text and icons). Colour is never the only signal; there's always an icon or label too. Vibrancy comes from accents and chips; backgrounds stay calm.","why":"","tags":["design"],"imp":false},{"id":"P5-D-106","phase":"5","src":"spec","title":"Motion rules","date":"","by":"the human (spec)","text":"Motion rules: every animation runs on the UI thread (Reanimated worklets) at 60 fps on the human's phone. Durations are 150–300 ms. Springs are critically damped or close to it, with ≤5% overshoot. Nothing loops or plays on its own except loading skeletons. Reduced motion (the system setting) swaps movement for short fades.","why":"","tags":["app","design"],"imp":false},{"id":"P5-D-107","phase":"5","src":"spec","title":"The complete animation list (nothing beyond this without a GATE)","date":"","by":"the human (spec)","text":"The complete animation list (nothing beyond this without a GATE): the card follows the finger with a slight tilt (≤8°) and springs back below the threshold; the card flies out past the threshold; the next card settles from 0.96→1 scale; a tinted label fades in during the drag (dismiss / open); the undo toast slides up and back; the detail screen opens with a fade + 24 px rise; the star pops (1→1.15→1, once); checkboxes and toggles tick; chips change colour by cross-fade; list items fade in once on first load; pull-to-refresh uses the stock indicator recoloured.","why":"","tags":["app","design"],"imp":false},{"id":"P5-D-108","phase":"5","src":"spec","title":"Haptics","date":"","by":"the human (spec)","text":"Haptics: expo-haptics, light impact when a swipe commits, selection feedback on star, checkbox and toggle. Nothing else. It respects the system haptics setting.","why":"","tags":["app","process"],"imp":false},{"id":"P5-D-109","phase":"5","src":"spec","title":"States","date":"","by":"the human (spec)","text":"States: every screen gets a designed loading skeleton, empty state, offline banner and error state with a retry, all in the new palette.","why":"","tags":["app","design"],"imp":false},{"id":"P5-D-110","phase":"5","src":"spec","title":"Release distribution","date":"","by":"the human (spec)","text":"Release distribution: EAS production profile with buildType: apk (sideloaded; no Play Store), version 1.0.0, versionCode auto-incremented remotely. The APK is published as a GitHub Release asset on the site repo, because EAS artifact links expire.","why":"","tags":["app","infra","design"],"imp":false},{"id":"P5-D-111","phase":"5","src":"spec","title":"OTA updates","date":"","by":"the human (spec)","text":"OTA updates: add expo-updates with EAS Update channels preview and production, and a runtime version policy of appVersion. After this phase, JS-only changes ship with eas update. Native changes still need a new build.","why":"","tags":["app","process"],"imp":true},{"id":"P5-D-112","phase":"5","src":"spec","title":"Release hygiene","date":"","by":"the human (spec)","text":"Release hygiene: no dev menus or debug screens in release. console.* is stripped or gated behind __DEV__. No API base URL other than production. Release builds point at the same Cloud Run service.","why":"","tags":["app","infra"],"imp":false},{"id":"P5-D-113","phase":"5","src":"spec","title":"Google sign-in for others","date":"","by":"the human (spec)","text":"Google sign-in for others: the OAuth consent screen is still in Testing (only listed test users can sign in). The site's privacy page and home page URL make it possible to switch the app to In production; that's a human GATE. If the release keystore's SHA-1 differs from development's, it must be added to the Android OAuth client.","why":"","tags":["security","app","design","process"],"imp":false},{"id":"P5-D-114","phase":"5","src":"spec","title":"Website stack","date":"","by":"the human (spec)","text":"Website stack: plain static HTML/CSS with minimal vanilla JS and no framework. Self-hosted fonts or the system stack. Total page weight under 1.5 MB, with screenshots in WebP. Lighthouse ≥95 on Performance, Accessibility, Best Practices and SEO (mobile).","why":"","tags":["app","design"],"imp":false},{"id":"P5-D-115","phase":"5","src":"spec","title":"Website hosting","date":"","by":"the human (spec)","text":"Website hosting: a separate public repo o7PY/skim-site (the app repo is private, and Pages on a private repo isn't free), served by GitHub Pages. Locally it lives at ~/skim-site, outside the app repo. Claude Code builds it there; the human creates the GitHub repo, pushes, and enables Pages.","why":"","tags":["security","push","app","infra"],"imp":false},{"id":"P5-D-116","phase":"5","src":"spec","title":"Website motion","date":"","by":"the human (spec)","text":"Website motion: the same calm rules. Sections fade and rise once on scroll (IntersectionObserver), the hero phone has a gentle entrance, and nothing autoplays in a loop. Respects prefers-reduced-motion.","why":"","tags":["design","process"],"imp":false},{"id":"P5-D-117","phase":"5","src":"spec","title":"Honesty on the site","date":"","by":"the human (spec)","text":"Honesty on the site: Skim is presented as an early preview, Android only, currently in testing. The site must not say IISc officially offers it, and must not imply professors can install the bot today. The only call to action for professors is a contact (mailto:) link.","why":"","tags":["app","design","process"],"imp":true},{"id":"P5-D-118","phase":"5","src":"spec","title":"Screenshots are the human's","date":"","by":"the human (spec)","text":"Screenshots are the human's. Claude Code never fakes app screenshots. It asks the human for an exact list (§6.3), uses placeholders until they arrive, and frames them in a generic, original phone frame (CSS or SVG; no real device artwork).","why":"","tags":["app","design"],"imp":false}],"stories":[{"title":"The push-token registration loop","area":"App","problem":"The app registered its push token over and over.","cause":"Asking the OS for a push token fires the \"token changed\" event, and the handler registered again on every event, so each registration caused the next.","fix":"A RegistrationGuard that ignores events caused by its own registration.","lesson":"When an action triggers the event you listen to, you need a re-entrancy guard."},{"title":"The 2 MB cache that would not load","area":"App","problem":"A big offline cache could stop the app from reading its saved data on Android.","cause":"The whole query cache is ONE AsyncStorage value, and Android cannot read a single value above about 2 MB back.","fix":"A pruner (pruneForSize) drops the oldest opened-card details first; lists and settings are never dropped; team card lists are never persisted.","lesson":"Know the platform's hard limits before choosing a storage shape."},{"title":"\"I couldn't find it\" for \"When is the next quiz?\"","area":"AI","problem":"The chat refused every question that was not about the card on screen.","cause":"Retrieval was healthy (10 events, 8 relevant messages) but the prompt never told the model today's date, so it could not tell which quizzes were past.","fix":"Today's date in IST in the prompt, and ALREADY PASSED / today / tomorrow / in N days computed in code on every event line; posted dates on messages.","lesson":"Diagnose each stage with a read-only script, and add eval questions that depend on \"now\". Do the arithmetic in code, not in the model."},{"title":"\"Has this changed?\" refused","area":"AI","problem":"A question anchored to a card that said the venue moved was refused.","cause":"Nothing told the model that \"this\" means the anchored card.","fix":"A rule in the system prompt and a one-line note naming entry [1] when a card is anchored.","lesson":"Pronouns need an antecedent in the prompt."},{"title":"The false \"You're offline\" banner","area":"App","problem":"The app showed offline on a working campus network and disabled the chat.","cause":"The check treated \"internet not reachable\" as offline; some networks block the connectivity test even though our server is reachable.","fix":"Offline now means no connection at all (the rule the outbox already used).","lesson":"Heuristic network checks produce false negatives; let the real request fail instead."},{"title":"New cards only appeared after a manual refresh","area":"App","problem":"A new post showed up only after pull-to-refresh, and the app never caught up after a reconnect.","cause":"TanStack Query listens to browser focus and online events, which React Native never fires.","fix":"Wire focusManager to AppState and onlineManager to the network listener; lists that wait for the outbox hold still.","lesson":"Libraries built for the web need their lifecycle wired on mobile."},{"title":"The Worklets Babel plugin and a spread operator","area":"App","problem":"Tests failed to even load the swipe deck.","cause":"The Worklets plugin cannot compile a spread inside an object-style gesture hook config; it would have broken the real bundle too.","fix":"Write the config properties out explicitly.","lesson":"A test that loads the component caught a bundler-level failure before a build."},{"title":"Updates \"not coming\" to the app","area":"DevOps","problem":"A published update never reached the phone.","cause":"The update went to the preview channel; the installed app was the production build, which only listens to production. A preview APK could not be installed over it either (lower version code).","fix":"Publish to the app's own channel after a fingerprint check.","lesson":"Channel, runtime version and version code are three separate gates."},{"title":"eas update crashed on web export","area":"DevOps","problem":"The update command failed in a static web render.","cause":"By default it exports every platform; the secure-storage module has no web version.","fix":"Publish with --platform android.","lesson":"Read what a default does before accepting it."},{"title":"The phone cut off by the navbar","area":"Web","problem":"On shorter laptop windows the pinned phone slid under the sticky header.","cause":"Its position was a fixed 50vh minus a constant, correct only on tall windows.","fix":"A full-height flex box below the navbar with the phone's size capped by the space left; verified by measuring at seven window sizes.","lesson":"Measure layout instead of eyeballing one size."},{"title":"The row-level-security lockdown","area":"Backend","problem":"A publishable key in the app must not be able to read the database.","cause":"Supabase exposes tables through a Data API unless you lock them.","fix":"Migration 007 enables RLS on every table with no policies, the Data API is off, a lint test and a script keep it so.","lesson":"Make the safe state the default and test for drift."},{"title":"A reminder that \"moved\" an event","area":"AI","problem":"\"Reminder: Quiz 1 is on Monday\" posted on a Monday erased the event's time.","cause":"The model labelled a reminder as a reschedule.","fix":"A move now also needs explicit change language in the text; a bare weekday matching the event's weekday is a restatement; conflicts are flagged for review.","lesson":"Put the rule in code and make the model's label necessary but not sufficient."},{"title":"The run that never finished","area":"Backend","problem":"run-all kept reporting \"more to do\".","cause":"A crashing AI step marked the run partial forever.","fix":"AI failures are isolated: a crashing AI step never makes run-all partial; \"next\" is only true for real remaining work.","lesson":"Failure isolation: one stage must not poison the loop."},{"title":"Keeping the swipe behaviour frozen","area":"Process","problem":"I added a double-dismiss guard during the redesign.","cause":"Scope creep: during a style-only phase the guard was behaviour.","fix":"Removed it when the human said \"change nothing that is not style\"; the rule became: explicit feature requests only, each logged as a deviation.","lesson":"Scope rules need to be followed even for \"obviously good\" changes; disclose and offer instead."},{"title":"Sheets and the keyboard on Android","area":"App","problem":"A bottom sheet's window did not shrink for the keyboard, so the input hid behind it.","cause":"The modal window keeps its size; the keyboard sits on top.","fix":"Measure how far the keyboard actually overlaps the window and lift the sheet by that much.","lesson":"Measure, then adapt; do not assume the platform resizes for you."},{"title":"The screenshot with a music chip","area":"Web","problem":"Your phone screenshots carried song titles, icons and carrier names in the status bar.","cause":"Real devices are messy.","fix":"The processing script crops the status bar and repaints the carrier row on notification captures; nothing else is changed (screenshots stay real).","lesson":"Redact for public use, but never fake the product."},{"title":"Tests that asserted the old behaviour","area":"Backend","problem":"Adding new-post alerts broke six change-alert tests.","cause":"Those scenarios post messages, which now also produce alerts.","fix":"Test users start with new-post alerts off so the tests keep testing one thing; new tests cover the new alerts.","lesson":"When a feature changes the baseline, isolate old tests instead of loosening them."},{"title":"Reading production was blocked","area":"Process","problem":"I could not read the production database to reproduce a chat failure.","cause":"A deliberate permission boundary.","fix":"Wrote a read-only diagnostic script for the human to run, with the same code path as the app.","lesson":"Design for debuggability under constraints: the human runs it, you read the output."},{"title":"Unreachable text: the missing pronoun, the missing date, the missing team","area":"AI","problem":"Three separate chat failures had one shape.","cause":"The model was missing context a human would assume.","fix":"Say it explicitly: what \"this\" is, what day it is, which course a fact is from (also appended by the server).","lesson":"If a human would need it to answer, put it in the prompt."}],"qa":[{"cat":"Overview","q":"Describe the project in 30 seconds.","a":"Skim is a Microsoft Teams bot plus an Android app. A professor adds the bot to a course team once; it silently records posts and files. An AI reads them, finds dates and changes, and the app turns that into a swipe deck of cards with colour-coded events, reminders that move when a date moves, push alerts, and an \"ask the course\" chat that answers only from the course's own messages with sources shown. The professor does nothing, and sees nothing about students.","follow":"What problem does that solve for a student?","lvl":1},{"cat":"Overview","q":"What problem does it solve, and for whom?","a":"Course Teams channels are noisy: a quiz date is buried between \"thanks sir\" and file uploads, and dates get corrected in later posts. Students miss things. Skim keeps the REAL Teams content on every card and adds only structure on top (the event line, the change badge, reminders), so a wrong AI reading can never hide the original message.","follow":"How do you stop the AI from being wrong in a harmful way?","lvl":1},{"cat":"Overview","q":"How was it built? What was your role versus the AI's?","a":"Spec-driven development with Claude Code. I wrote the specs (PHASE*.md) and owned the decisions; the assistant implemented task by task and stopped at human gates (builds I install, accounts I configure, anything outward-facing). Every non-spec decision was logged with an ID, date, who made it and why; every deviation from a spec went into a DIFF log with a status. Rules I enforced: the AI never pushes (a push deploys), never commits docs or secrets, and asks before anything hard to undo.","follow":"What did you reject or overrule?","lvl":2},{"cat":"Overview","q":"What were the phases?","a":"Phase 1: the bot captures every channel message, edit, delete, reaction and file change, raw-first. Phase 2: Microsoft Graph sync of the Files tab and message history, with a Scheduler heartbeat. Phase 3: AI understanding (redact, classify, extract events, change history, embeddings). Phase 4: the student app (sign-in, join by code, swipe deck, reminders, push, offline). Phase 5: release build, redesign, over-the-air updates, a website, plus requested features (Teams tab, reminders list, new-post alerts). Phase 6A: the \"ask the course\" chat.","follow":"Which phase was the riskiest?","lvl":1},{"cat":"Overview","q":"What is the hardest technical problem you solved?","a":"Making an LLM useful without trusting it. The model proposes events as structured JSON, but code owns the rules: dates are computed in code in IST, only explicit change language can move an event, students can never change an event, file-derived events are capped at medium confidence, and anything unsure is shown as \"unconfirmed\". The pipeline runs per message in one transaction, so a failure never half-applies.","follow":"How did you measure whether it worked?","lvl":2},{"cat":"Overview","q":"What would you do next?","a":"Before a real pilot: a professor review queue with manual override, roster verification or revocable codes, Microsoft sign-in (the course accounts are Microsoft), a production signing key and the Play Store, iOS, a paid model tier, and faster alerts. Hardening: Sites.Selected instead of Files.Read.All, and a scale test on a real course team. Features: daily digest, calendar feed, real recurring events.","follow":"Which of those would you do first and why?","lvl":1},{"cat":"Overview","q":"Why does the website have no download button?","a":"Skim only works inside courses in my Microsoft tenant (the bot is single-tenant and codes come from those teams), so a public APK would let strangers install something unusable. The page invites professors, organisations and companies to collaborate on the testing phase by email; plans for organisations are \"coming\", with no prices.","follow":"What has to change before there can be a public download?","lvl":1},{"cat":"Architecture","q":"Walk me through the architecture end to end.","a":"Teams sends channel activity to a single-tenant bot, which calls my Python aiohttp service on Cloud Run. The service stores raw activity in Supabase Postgres, then a Cloud Scheduler heartbeat (every 15 minutes) runs \"run-all\": Graph sync, AI processing through Gemini (Groq as fallback), card building and push alerts. The Android app signs in with Google, exchanges the ID token for a Supabase JWT, and calls my /api/v1 with it; the backend verifies the JWT against Supabase's JWKS. Pushes go Cloud Run to Expo Push to Firebase Cloud Messaging to the phone. JS updates ship through EAS Update; deploys are a push to main via Cloud Build.","follow":"Which component would you replace first at 100x scale?","lvl":1},{"cat":"Architecture","q":"Why Cloud Run, Supabase and Expo?","a":"Cloud Run: serverless containers, scale to zero, near-zero cost at pilot scale, one deploy unit. Supabase: managed Postgres with pgvector in the same place as auth, so I get transactions, JSONB and vector search without running infrastructure. Expo/EAS: fast React Native iteration, cloud APK builds, and over-the-air JS updates. All three have free or cheap tiers that fit a pilot.","follow":"What are the lock-in risks?","lvl":1},{"cat":"Architecture","q":"Why store raw data first?","a":"Capture must never fail because parsing fails. The HTTP handler stores the raw activity before the SDK or any normalisation runs, with an idempotency key, so a parser bug can be fixed and the data reprocessed from raw. A storage failure is a 500 on purpose so Teams retries. It cost a little storage and bought a lot of safety.","follow":"How do you avoid storing duplicates?","lvl":2},{"cat":"Architecture","q":"Why poll with a scheduler instead of an event-driven pipeline?","a":"The work is incremental and idempotent, so a 15-minute heartbeat is simple and cheap, and it naturally rate-limits the AI calls on free tiers. The cost is latency (a post becomes a card and a push at the next run). If latency matters the cadence is just a setting (5 minutes), and the next step up would be a queue triggered by the webhook.","follow":"What would the queue-based design look like?","lvl":2},{"cat":"Architecture","q":"How do you make background jobs safe to run concurrently or repeatedly?","a":"Three things. A global lease row (job_locks) makes a second caller get \"busy\" instead of running twice, and it works through the transaction pooler. Every job has a time budget and reports partial or next so a long job resumes from a cursor. And every write is idempotent: dedupe keys for messages, unique indexes (one alert per user and card), and \"on conflict do nothing\" upserts.","follow":"What happens if a run dies halfway?","lvl":2},{"cat":"Architecture","q":"How would you scale this to 10,000 students across hundreds of courses?","a":"Cursor-based paging is already in place for the deck and team cards. Next: run per-team jobs in parallel behind a queue instead of one run-all, move AI calls to a worker with batching and a paid model tier, add read replicas or caching for the deck, index and partition the big tables (messages, feed items, embeddings), and make the Scheduler per-tenant. Multi-tenant also needs Microsoft sign-in, roster verification and per-organisation data separation.","follow":"What would break first?","lvl":3},{"cat":"Architecture","q":"What are the single points of failure?","a":"Cloud Run (but stateless and redeployable), Postgres (managed, but one instance), the Scheduler heartbeat, and the AI providers (mitigated by the fallback router and by the fact that cards still appear without AI because Teams content is shown as is). The app itself degrades: it caches the last 50 cards in full and queues changes offline.","follow":"How would you detect an outage?","lvl":1},{"cat":"Architecture","q":"Why did you write two storage implementations (memory and Postgres)
