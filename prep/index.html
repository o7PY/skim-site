imp":false},{"id":"D-031","phase":"1","src":"log","title":"Git holds only code, tests, migrations, scripts, config and README.md","date":"2026-10-22","by":"human","text":"The repository contains only source code, tests (with their fixtures), migrations, scripts, Dockerfile/config files and README.md. All specs and notes live in git-ignored Bookkeeping/. Claude commits locally only when asked and only those file kinds; the human pushes. cloudrun.yaml (a gcloud dump with client and tenant ids) is excluded through .git/info/exclude, not .gitignore, so no tracked file changed. Old docs remain in early history (e430ada is on GitHub); the repo is private and history is not rewritten.","why":"Keep the repo minimal and keep working notes private. (tests/ stays tracked because it is code; the human may later ask to untrack it.)","tags":["security","push","data","infra"],"imp":false},{"id":"D-032","phase":"1","src":"log","title":"Bookkeeping/HANDOFF.md is the entry point for a new session; PHASE2.md belongs to the human","date":"2026-10-24","by":"human","text":"Bookkeeping/HANDOFF.md is the first file a fresh session reads (current state, next actions, rules, file index). Bookkeeping/PHASE2.md is the human's own replacement spec: Claude does not create or edit it. The P2-D-001…018 entries below were seeded from Claude's earlier draft of PHASE2.md and are left untouched; the new PHASE2.md says to mark them (superseded by Phase 2 spec v2) and add P2-D-101…118 when Phase 2 starts, so do that then, not before.","why":"A new chat has zero context; the record must be self-contained.","tags":["data","process"],"imp":false},{"id":"D-033","phase":"1","src":"log","title":"Security-review finding on logging message text: acknowledged, default unchanged","date":"2026-10-21","by":"human + claude-code","text":"An automated review flagged LOG_MESSAGE_TEXT=true (message text and sender name in the per-activity log line). Left as is because spec §8/FR-12 require the flag with default true for Phase 1 and from_name is a required log field. The flag exists, is tested, and the text is cut to 120 chars. Before any real class uses the bot, set LOG_MESSAGE_TEXT=false (it is currently unset on Cloud Run, so text is logged).","why":"Spec §8 sets the Phase 1 default; flipping it changes a human decision.","tags":["infra","process"],"imp":false},{"id":"D-034","phase":"1","src":"log","title":"Operational facts recorded: deploy topology and DB ports","date":"2026-10-24","by":"human (facts), claude-code (recorded)","text":"Hosting: Cloud Run skimforteams in asia-south1, deployed by a Cloud Build trigger on pushes to main (docker build, push to Artifact Registry, gcloud run services update --image), config via env vars and Secret Manager (bot-client-secret, database-url, debug-token, pairing-secret). Database: Supabase, session pooler (5432) for migrations from the human's PC, transaction pooler (6543) for Cloud Run; the app sets statement_cache_size=0 when the DSN contains :6543. Deployment config is not versioned in the repo.","why":"A fresh session must know where things run without needing console access.","tags":["security","push","app","data"],"imp":false},{"id":"P2-D-101","phase":"2","src":"log","title":"Prerequisite","date":"2026-10-24","by":"spec (human)","text":"Prerequisite: Phase 1 channel-message capture must work before Phase 2 code starts (task T0).","why":"Phase 2 dedupes backfill against live messages; without live channel capture nothing can be validated.","tags":["design"],"imp":false},{"id":"P2-D-102","phase":"2","src":"log","title":"Graph calls use app-only (client-credentials) tokens from the bot's existing Ent","date":"2026-10-24","by":"spec (human)","text":"Graph calls use app-only (client-credentials) tokens from the bot's existing Entra app; no second app registration.","why":"One identity to manage; RSC consents are granted to this app.","tags":["security","app"],"imp":false},{"id":"P2-D-103","phase":"2","src":"log","title":"Token acquisition via MSAL (already a dependency) with an in-memory cache","date":"2026-10-24","by":"spec (human)","text":"Token acquisition via MSAL (already a dependency) with an in-memory cache; HTTP via the existing aiohttp client; no new HTTP library.","why":"Fewer dependencies.","tags":["security"],"imp":false},{"id":"P2-D-104","phase":"2","src":"log","title":"Message backfill uses the RSC grant (ChannelMessage.Read.Group). ChannelMessage","date":"2026-10-24","by":"spec (human)","text":"Message backfill uses the RSC grant (ChannelMessage.Read.Group). ChannelMessage.Read.All is only a fallback if the spike shows RSC is not enough (then flag as a privilege increase in DIFF).","why":"Least privilege.","tags":["security","app","process"],"imp":false},{"id":"P2-D-105","phase":"2","src":"log","title":"Files need a Graph application permission (RSC has no file permissions). Test te","date":"2026-10-24","by":"spec (human)","text":"Files need a Graph application permission (RSC has no file permissions). Test tenant: Files.Read.All (admin-consented). Production plan: Sites.Selected per team site. The spike checks Sites.Selected with /filesFolder.","why":"Files tab = SharePoint library, outside RSC scope.","tags":["security","design","process"],"imp":false},{"id":"P2-D-106","phase":"2","src":"log","title":"Metadata only","date":"2026-10-24","by":"spec (human)","text":"Metadata only: never download file content; store name, path, size, type, timestamps, people, web link, Graph ids.","why":"Storage, privacy, permissions; SharePoint stays authoritative.","tags":[],"imp":false},{"id":"P2-D-107","phase":"2","src":"log","title":"No background loops","date":"2026-10-24","by":"spec (human)","text":"No background loops: sync and backfill run inside HTTP job endpoints called by an external scheduler.","why":"Host scales to zero and throttles CPU after a response.","tags":["infra"],"imp":false},{"id":"P2-D-108","phase":"2","src":"log","title":"Job endpoints protected by a separate JOBS_TOKEN (bearer, constant-time compare)","date":"2026-10-24","by":"spec (human)","text":"Job endpoints protected by a separate JOBS_TOKEN (bearer, constant-time compare); 404 if unset.","why":"Separate blast radius from DEBUG_TOKEN.","tags":["security"],"imp":false},{"id":"P2-D-109","phase":"2","src":"log","title":"Jobs are resumable and time-boxed","date":"2026-10-24","by":"spec (human)","text":"Jobs are resumable and time-boxed: stop after JOB_TIME_BUDGET_SECONDS, save cursor, return status 'partial'.","why":"Host request timeouts; large teams.","tags":[],"imp":false},{"id":"P2-D-110","phase":"2","src":"log","title":"One job of each kind at a time via a Postgres advisory lock","date":"2026-10-24","by":"spec (human)","text":"One job of each kind at a time via a Postgres advisory lock; a second caller gets status 'busy' immediately.","why":"Overlapping scheduler calls must not double-process.","tags":["data"],"imp":false},{"id":"P2-D-111","phase":"2","src":"log","title":"Raw-first for Graph","date":"2026-10-24","by":"spec (human)","text":"Raw-first for Graph: every fetched item stored unmodified in graph_raw (deduped by content hash) before normalising.","why":"Same reasoning as Phase 1 raw-first.","tags":["data"],"imp":false},{"id":"P2-D-112","phase":"2","src":"log","title":"Delta on the drive root, filtered to tracked channel folders","date":"2026-10-24","by":"spec (human)","text":"Delta on the drive root, filtered to tracked channel folders; folder-scoped delta only if the spike proves it works (then log a DIFF).","why":"Correctness over cleverness.","tags":["process"],"imp":false},{"id":"P2-D-113","phase":"2","src":"log","title":"Files are soft-deleted (deleted_at)","date":"2026-10-24","by":"spec (human)","text":"Files are soft-deleted (deleted_at); every change writes a document_events row (created/modified/renamed/moved/deleted/restored).","why":"Phase 3 needs these signals.","tags":["security"],"imp":false},{"id":"P2-D-114","phase":"2","src":"log","title":"Backfilled messages go in the same messages table with source='graph' (live = 'l","date":"2026-10-24","by":"spec (human)","text":"Backfilled messages go in the same messages table with source='graph' (live = 'live'); backfill never overwrites live data, only fills empty fields and records a 'backfilled' note.","why":"One message model; live is higher fidelity.","tags":["app","data"],"imp":false},{"id":"P2-D-115","phase":"2","src":"log","title":"Message dedupe key is (conversation_id, message_id). Assumes Graph chatMessage i","date":"2026-10-24","by":"spec (human)","text":"Message dedupe key is (conversation_id, message_id). Assumes Graph chatMessage id == activity id and Graph channel id == channel conversation id without ';messageid=' suffix. Spike verifies; if wrong add a mapping and log a DIFF.","why":"Avoid live/backfill duplicates.","tags":["ai","data","process"],"imp":false},{"id":"P2-D-116","phase":"2","src":"log","title":"Standard channels required","date":"2026-10-24","by":"spec (human)","text":"Standard channels required; private/shared best-effort, failures recorded in channels.sync_error without failing the job.","why":"Separate SharePoint sites and permissions.","tags":["security"],"imp":false},{"id":"P2-D-117","phase":"2","src":"log","title":"Install marks the team needs_initial_sync=true","date":"2026-10-24","by":"spec (human)","text":"Install marks the team needs_initial_sync=true; the next scheduled job does discovery, full file sync and backfill. Nothing slow runs inside a Teams request.","why":"Teams needs fast responses; CPU throttles after a response.","tags":[],"imp":false},{"id":"P2-D-118","phase":"2","src":"log","title":"Throttling","date":"2026-10-24","by":"spec (human)","text":"Throttling: honour Retry-After on 429/503, exponential backoff with jitter on 5xx, max GRAPH_MAX_CONCURRENCY (default 4) parallel requests, always follow @odata.nextLink.","why":"Graph throttles aggressively.","tags":["app"],"imp":false},{"id":"P2-D-119","phase":"2","src":"log","title":"Spike script reads the bot's Graph token roles and uses token=latest for delta probes","date":"2026-10-24","by":"claude-code","text":"scripts/spike_phase2.py is strictly read-only (GET on Graph, SELECT on DB). It decodes the access token's roles claim to show which application permissions are actually granted, probes delta with ?token=latest (cheap, no enumeration), caps listings with --max-items, and writes only sanitised evidence (8-char id hashes, counts, status/error codes; no names, text or file names) to Bookkeeping/PHASE2_SPIKE.raw.json.","why":"Evidence must be safe to keep and to turn into fixtures; the roles claim answers §3.3 item 1/3 without guessing.","tags":["security","process"],"imp":false},{"id":"P2-D-120","phase":"2","src":"log","title":"Per-channel folder delta is primary (revises P2-D-112)","date":"2026-10-24","by":"human (approved), claude-code (drafted)","text":"Use GET /drives/{d}/items/{channelFolder}/delta per channel as the primary sync. Root delta + filtering stays only as a fallback if a folder delta call fails. P2-D-112 is superseded by this entry (its text is left as written).","why":"Spike showed folder delta works (P2-DIFF-002). It avoids scanning the whole library's changes.","tags":[],"imp":false},{"id":"P2-D-121","phase":"2","src":"log","title":"Folder membership and paths by item ids, not parentReference.path","date":"2026-10-24","by":"human (approved), claude-code (drafted)","text":"Add documents.parent_item_id; compute documents.path (relative to the channel folder) by walking the stored parent chain up to channels.files_folder_item_id. channels.files_folder_path is optional/informational and not fetched in Phase 2. A folder rename/move recomputes descendants' paths locally. In folder delta an item leaving the folder arrives as deleted; to tell moved-out from deleted, do one GET /drives/{d}/items/{id} for each such item (200 and outside the tracked folder ⇒ moved, channel_id null; 404 ⇒ deleted).","why":"P2-DIFF-001. parentReference.path is absent.","tags":["security"],"imp":false},{"id":"P2-D-122","phase":"2","src":"log","title":"Attachment linking by normalised contentUrl","date":"2026-10-24","by":"human (approved), claude-code (drafted)","text":"Link attachments (reference type) to documents by normalised contentUrl ↔ documents.web_url (percent-decode, lowercase scheme+host, strip query and fragment, trim trailing slash); fallback name + path under the channel folder. match_method ∈ {web_url, name_path}. Add documents.web_url_norm (indexed) to make the match a lookup.","why":"P2-DIFF-003.","tags":["data"],"imp":false},{"id":"P2-D-123","phase":"2","src":"log","title":"Spike fixtures are derived from observed shapes","date":"2026-10-24","by":"claude-code","text":"tests/fixtures/graph/*.json are synthetic, built from the key sets and facets the spike observed (the spike intentionally stored no payloads). They carry fake ids/names/text.","why":"Privacy; the raw JSON holds only hashed ids and counts.","tags":["process"],"imp":false},{"id":"P2-D-124","phase":"2","src":"log","title":"Private and shared channels are out of scope (revises P2-D-116)","date":"2026-10-24","by":"human","text":"Only channels with membershipType = \"standard\" are discovered, synced or backfilled. Private/shared channels are skipped entirely: no rows in channels, documents, messages; no Graph calls to them beyond the channel list; job stats carry a skipped count only (skipped_non_standard, no names). Phase 1 guard: a live activity whose channelData.channel.type or .membershipType is private/shared is dropped in the /api/messages handler BEFORE raw storage (and before the SDK), logging only the fixed line skipped non-standard channel. Privacy wins over raw-first for this case. Replaces the best-effort rule of P2-D-116 (its text is left as written).","why":"Private/shared channels have different membership and separate SharePoint sites; storing them could expose content to people not in them.","tags":["security","data","process"],"imp":true},{"id":"P2-D-125","phase":"2","src":"log","title":"Document events are timestamped at observation; descendants of a renamed/moved folder get no events","date":"2026-10-24","by":"claude-code","text":"document_events.at is when the sync observed the change (the real Graph timestamps live on the documents row). When a folder is renamed or moved, descendants' path is rewritten silently (their own name/parent did not change). Folders never get modified events (their eTag changes whenever a child changes). A file whose eTag changed without rename/move gets modified. Moving out of the channel folder is event moved with channel_id null and path null (not deleted); moving back in is moved again; coming back after deletion is restored.","why":"Graph does not give per-change times in delta; noisy events would drown the Phase 3 signals.","tags":["security"],"imp":false},{"id":"P2-D-126","phase":"2","src":"log","title":"One global job lock","date":"2026-10-24","by":"claude-code","text":"Every job kind (discover, sync-files, run-all, later backfill) takes the single advisory lock jobs; a caller that does not get it receives status: \"busy\" (and a job_runs row with status busy). The lock is a transaction-scoped pg_try_advisory_xact_lock held on a dedicated pooled connection for the whole job, not a session lock.","why":"P2-D-110 says one job of each kind; but sync-files and run-all share sync_state, so independent locks would let them race. Session-level advisory locks are unreliable behind Supabase's transaction pooler (:6543).","tags":[],"imp":false},{"id":"P2-D-127","phase":"2","src":"log","title":"Delta start link is taken before the initial listing","date":"2026-10-24","by":"claude-code","text":"A full sync first requests …/delta?token=latest (cheap, returns a deltaLink for \"now\"), then lists the folder, then stores that link as the channel's delta state only when the listing completed. Changes made during the listing are replayed by the first delta; applying is idempotent. Full syncs are resumable per folder via sync_state key fullsync:<channelId>; delta syncs resume via the saved @odata.nextLink (cursor.next) and keep the old deltaLink until the feed is fully applied. State keys: folder:<channelId> (primary) or root:<channelId> (fallback mode, entered when folder delta answers 400/405/501).","why":"No gap between listing and delta; correctness under partial runs.","tags":["security","data","process"],"imp":false},{"id":"P2-D-128","phase":"2","src":"log","title":"needs_initial_sync is cleared only when backfill exists and has finished","date":"2026-10-24","by":"claude-code","text":"Through T7 the flag is only ever SET (install/reinstall, default true). It is cleared by the backfill step (T8) once both the file sync and the backfill of that team completed. Until then sync-files merely processes flagged teams first.","why":"Clearing it after files alone would leave a team deployed before T8 without its history backfill.","tags":[],"imp":false},{"id":"P2-D-129","phase":"2","src":"log","title":"Client retry policy details","date":"2026-10-24","by":"claude-code","text":"Retry only on 429, 500, 502, 503, 504 and network errors; 501 is NOT retried (it is how an unsupported delta would answer, and triggers the root-delta fallback). Retry-After is honoured up to max_wait (60 s); a longer value raises GraphThrottled(retry_after=…) immediately so the job can stop instead of sleeping. Absolute URLs (nextLinks) are only followed on the configured Graph host; paths ending in /content and URLs containing downloadUrl are refused (no file bytes, spec §8).","why":"Do not leak the bearer token to other hosts; stay within the request budget.","tags":["security","process"],"imp":false},{"id":"P2-D-130","phase":"2","src":"log","title":"Job lock is a lease row (job_locks), not a Postgres advisory lock","date":"2026-10-24","by":"human (instruction) / claude-code (implementation)","text":"Supersedes the mechanism in P2-D-110/126 (single global lock stays). job_locks(name pk, holder, expires_at) from migration 004. Acquire = one atomic insert ... on conflict (name) do update ... where job_locks.expires_at <= now() returning holder; we hold the lock iff the returned holder is ours. Release = delete ... where name and holder (a stale holder cannot delete a successor's lease). Lease = JOB_TIME_BUDGET_SECONDS + 120 s. Expiry uses the database clock (now()). A crashed holder blocks jobs for at most one lease. No connection or transaction is held while the job runs.","why":"Supabase's transaction pooler (:6543) can hand a different server connection to each statement, and the previous design pinned one connection with an open transaction for the whole run; a lease row needs no session state.","tags":["security","app","data"],"imp":false},{"id":"P2-D-131","phase":"2","src":"log","title":"Restoring a folder (delta) restores the descendants deleted with it","date":"2026-10-24","by":"claude-code (human asked to check and test it)","text":"Deleting a folder already soft-deletes its descendants with the same timestamp. When a delta reports a soft-deleted folder alive again, descendants whose deleted_at equals the folder's old deleted_at are restored (event restored, old/new path) and their paths rewritten; a child deleted separately earlier keeps its own deleted_at and stays deleted. Only on the delta path: a full sync lists every child anyway. Delta reports net state, so deletes undone between two syncs surface as modified or nothing (PHASE2.md §10.1); no code change.","why":"Graph may report only the folder itself when it is restored from the recycle bin.","tags":["security"],"imp":false},{"id":"P2-D-132","phase":"2","src":"log","title":"Schema-behind check at startup and in /health","date":"2026-10-24","by":"human (instruction) / claude-code","text":"skim/schema.py compares the migrations/*.sql file names with schema_migrations. At startup a missing migration is logged at ERROR level (\"DATABASE SCHEMA IS BEHIND THE CODE - missing migrations: …\"). /health returns db_schema: ok | behind | unknown | n/a (memory) and is re-evaluated on every call (flips to ok after migrating, no restart). ok stays true while behind so Cloud Run does not kill the revision. Migration dir: $MIGRATIONS_DIR, else ./migrations (the image's /app/migrations), else the repo copy.","why":"The first live run-all failed with a bare 500 because migration 004 had not been applied.","tags":["ai","app","data","infra"],"imp":true},{"id":"P2-D-133","phase":"2","src":"log","title":"Job failures are JSON, never a bare 500","date":"2026-10-24","by":"human (instruction) / claude-code","text":"JobRunner.run never raises. Any failure (step error or infrastructure such as a missing table) returns {status:\"error\", job_run_id, stats, next:false, error, error_class} with HTTP 500 and a JSON body (so a scheduler still sees a failure). A failed job_runs row is written when the database allows it; otherwise job_run_id is null. Only the exception class name (plus Graph status/code) is exposed, never its message.","why":"A bare 500 hid the cause; the message may contain URLs or SQL.","tags":["app","data","infra"],"imp":false},{"id":"P2-D-134","phase":"2","src":"log","title":"Backfill design (T8)","date":"2026-10-24","by":"claude-code","text":"(1) Per channel: newest-first /messages pages ($top 50), then each message's /replies; cursor sync_state backfill:<cid> = {cutoff, count, next, pending, capped}; resume continues from the saved nextLink / pending reply ids. (2) Paging stops at the first page whose newest lastModified/created is older than the cut-off (BACKFILL_SINCE_DAYS, or ?since_days=); older messages are skipped individually. BACKFILL_MAX_MESSAGES_PER_CHANNEL caps stored messages (replies included). (3) messageType != message (system events) are stored raw only. (4) New rows: source='graph', backfilled_at, one message_versions row (event created, no raw_activity_id). Existing rows: only NULL columns are filled (fill_empty), backfilled_at is set only when something was filled, source stays live, no version row. Attachments/reactions are added only if the message has none (Graph payloads differ from live ones, so a pay","why":"Resumable, idempotent, never degrades live data (P2-D-114).","tags":["security","app","data","infra"],"imp":false},{"id":"P2-D-135","phase":"2","src":"log","title":"Attachment linking details (T9)","date":"2026-10-24","by":"claude-code","text":"Step link-attachments (also last step of run-all, and POST /jobs/link-attachments?team_id=) is database-only. Candidates = attachments with a content_url whose conversation is a tracked channel and that have no link row. (1) web_url: normalize_url(content_url) equals documents.web_url_norm anywhere in the same team (a file may be posted in one channel but live in another folder). (2) name_path: the URL path after the first segment equal to the channel's display name (the Files folder is named after the channel) equals documents.path in that channel, case-insensitive. No third fallback on bare file name (risk of wrong links). A live document is preferred to a deleted one; a deleted one still links. Unmatched attachments are retried every run (cheap, no Graph). Links are never duplicated (PK attachment+document).","why":"P2-D-122/P2-DIFF-003.","tags":["security","app","data"],"imp":false},{"id":"P2-D-136","phase":"2","src":"log","title":"name_path linking also requires the same SharePoint host (security review of T9)","date":"2026-10-24","by":"claude-code (automated security review finding, valid)","text":"Amends P2-D-135. An attachment's contentUrl is author-controlled data, so a name_path match is accepted only if the URL's host equals the host of the matched document's web_url_norm; otherwise it counts as links_rejected_host and stays unlinked. web_url matching already compares scheme+host+path.","why":"Otherwise a post pointing at [url]> could claim to share a real course document.","tags":["security","process"],"imp":false},{"id":"P2-D-137","phase":"2","src":"log","title":"Phase 2 debug endpoints and smoke script (T10)","date":"2026-10-24","by":"claude-code","text":"/debug/channels|documents|documents/{id}|sync-status live in debug_api.py under the existing DEBUG_TOKEN middleware (403 on a wrong/missing token). /debug/sync-status redacts sync_state: delta/next links carry tokens, so only has_delta_link and a cursor summary (urls → <url>, lists → length) are shown. Structured logs (FR-211) were already one JSON line per job run (event: job_run) and per Graph error (graph_error: endpoint, status, code; no query string, no body); tests now pin both. scripts/smoke_remote.py is new (see P2-DIFF-011): BASE_URL, DEBUG_TOKEN, optional --jobs with JOBS_TOKEN; it also checks /health.db_schema.","why":"FR-210..212.","tags":["security","data","process"],"imp":false},{"id":"P2-D-138","phase":"2","src":"log","title":"Backfill reports Graph message types; force=true restarts (T8b)","date":"2026-10-25","by":"claude-code","text":"every message the backfill sees increments type_<messageType> in the job stats, so a low count can be explained (system events are skipped by design). POST /jobs/backfill?force=true deletes the saved backfill:* cursors for the selected teams first (a changed since_days only applies to a fresh cursor). Do not pass force on resume calls. Re-running never duplicates rows (fill-only, P2-D-114).","why":"live result graph=2 vs ~10 expected; the cause cannot be proven from outside the tenant.","tags":["security","design"],"imp":false},{"id":"P2-D-139","phase":"2","src":"log","title":"Attachments are added per missing attachment, not only to attachment-less messages (T8c)","date":"2026-10-25","by":"claude-code","text":"backfill_message adds every Graph attachment whose (content_type, normalised URL or name) the stored message lacks. Existing rows are never changed or removed. A live message therefore gains a reference attachment next to its live file.download.info one.","why":"a live post with an upload had one empty text/html attachment, so the old \"only when none exist\" rule blocked the file reference.","tags":[],"imp":false},{"id":"P2-D-140","phase":"2","src":"log","title":"Empty live messages are refilled from Graph on every run-all (T8c)","date":"2026-10-25","by":"claude-code","text":"step refill-empty (also /jobs/refill-empty) selects live, non-deleted messages of tracked channels with no text and no html (max 100, newest first), GETs each (/messages/{id} or /messages/{parent}/replies/{id}), stores the raw payload and applies fill-only. 404 and errors are counted, not fatal. No migration: messages that stay empty in Graph too cost one request each per run.","why":"live events for posts with file uploads can arrive empty.","tags":["security","data"],"imp":false},{"id":"P2-D-141","phase":"2","src":"log","title":"Link resolution order url, history, name_path, item_id (T9c)","date":"2026-10-25","by":"claude-code","text":"normalize_url now also drops the default port, collapses slashes and removes the /:x:/r sharing prefix (raw spaces == %20 already held). History rebuilds a document's old URLs from document_events.old_path/old_name plus the current channel-folder prefix, so the host is the document's own. item_id: GET /shares/u!{b64url}/driveItem for *.sharepoint.com URLs only, max 50 per run, stop after the first 401/403 (logged, counted shares_forbidden), accept only a document of the attachment's team. match_method value web_url is renamed url (old rows keep web_url).","why":"the live unmatched attachment had been renamed afterwards.","tags":["security","process"],"imp":false},{"id":"P2-D-142","phase":"2","src":"log","title":"unknownFutureValue is a message only with a user author (T12b)","date":"2026-10-25","by":"human request, claude-code implemented","text":"is_user_message: messageType message (or missing) is a message; unknownFutureValue is a message only when from.user.id exists; systemEventMessage and any other type are never messages (raw only). Live evidence: the 8 unknownFutureValue items of the test channel were system notes.","why":"v1.0 returns unknownFutureValue for unnamed types; skipping all of them could lose real posts.","tags":["security","ai","process"],"imp":false},{"id":"P2-D-143","phase":"2","src":"log","title":"Live messages are enriched from the channel message delta feed (T12)","date":"2026-10-25","by":"human request, claude-code implemented","text":"step enrich-messages (run-all and /jobs/enrich-messages) reads /teams/{gid}/channels/{cid}/messages/delta per standard channel. First run filters lastModifiedDateTime gt now-BACKFILL_SINCE_DAYS; the deltaLink is stored in sync_state msgdelta:<cid>, a saved nextLink resumes; max 10 pages per channel per run; 410 resets the cursor. Items go through backfill_message (fill-only: subject, importance, html, missing attachments; never overwrites live text, versions or source). Unknown messages are stored as source='graph' like backfill. @removed and system notes are skipped. A failing channel is counted (enrich_errors) and logged, not fatal. Cost in steady state: one request per channel per run.","why":"live events never carry the subject (P2-DIFF-016).","tags":["infra","process"],"imp":false},{"id":"P2-D-144","phase":"2","src":"log","title":"Plain text is derived from HTML wherever text comes from HTML (T13)","date":"2026-10-25","by":"human request, claude-code implemented","text":"normalize.to_plain_text: <br> and closing block tags (p div li tr h1-6 blockquote ul ol table) become newlines; other tags removed; entities unescaped; &nbsp; to a space; trailing spaces trimmed; 3+ newlines collapse to one blank line. Text with no tag and no entity is returned unchanged (so plain text Teams sent as text is never altered). Applied to live text (after mention-tag removal), Graph HTML bodies (mention elements dropped), edits, enrichment, refill. A Graph body of contentType text is not touched. messages.html is stored as sent. Step fix-text (run-all, /jobs/fix-text) converts existing messages.text and message_versions.text that still contain markup (max 1000 per run; idempotent). raw_activities/graph_raw keep the originals, so nothing is lost.","why":"live bug: Test 1: LNO<br>Test 2: AIDS<br>… in messages.text.","tags":["app","data"],"imp":false},{"id":"P3-D-001","phase":"3","src":"log","title":"LLM providers","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"LLM providers: Groq primary (GROQ_MODEL chosen in T1); Gemini free tier fallback (GEMINI_MODEL default gemini-2.5-flash-lite). Model names only in config.","why":"Free; free tiers change and rate-limit.","tags":["ai"],"imp":false},{"id":"P3-D-002","phase":"3","src":"log","title":"Fallback order","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Fallback order: Groq; on 429/5xx/timeout/invalid output after one repair retry, Gemini; if both fail mark item failed with error class, retry on later run up to max attempts.","why":"Never block the pipeline or lose an item.","tags":["ai"],"imp":false},{"id":"P3-D-003","phase":"3","src":"log","title":"Embeddings","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Embeddings: gemini-embedding-001, 768 dims, cosine, HNSW; model name and dims stored per vector.","why":"Free; 768 fits HNSW limit; pinned for comparability.","tags":["ai"],"imp":false},{"id":"P3-D-004","phase":"3","src":"log","title":"Privacy redaction","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Redact emails, phones, roll/SR numbers and person names before any LLM/embedding call; mapping in memory per call only, never stored or logged.","why":"Free tiers may train on prompts; class data must not identify people.","tags":["security","ai","process"],"imp":false},{"id":"P3-D-005","phase":"3","src":"log","title":"Structured output only","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Structured output only (Pydantic schema); one repair retry then fallback.","why":"Reliable parsing; injection resistant.","tags":["data"],"imp":false},{"id":"P3-D-006","phase":"3","src":"log","title":"Prompts are repo files","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Prompts are repo files (src/skim/ai/prompts/*.md) with PROMPT_VERSION; results record provider, model, prompt version, processed_at.","why":"Reproducible, comparable eval runs.","tags":["ai"],"imp":false},{"id":"P3-D-007","phase":"3","src":"log","title":"Process each item once","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Process each item once: key (conversation_id, message_id, message_version, PROMPT_VERSION, EXTRACT_MODEL_FAMILY); re-process only on edit or bumped PROMPT_VERSION via reprocess job.","why":"Cost, rate limits, idempotency.","tags":["ai"],"imp":false},{"id":"P3-D-008","phase":"3","src":"log","title":"Two-stage pipeline","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Two-stage pipeline: classify+extract, then resolve candidates vs open events (deterministic first, LLM tie-break only when ambiguous).","why":"Reminders/corrections update rather than duplicate.","tags":["ai"],"imp":false},{"id":"P3-D-009","phase":"3","src":"log","title":"LLM context","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"LLM context: message text+subject, posted time in IST with weekday, parent text for replies, compact open-event list for resolution. No other messages, no names.","why":"Enough to resolve relative refs without leaking data.","tags":["ai"],"imp":false},{"id":"P3-D-010","phase":"3","src":"log","title":"Time rules in code","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Time rules enforced in code after the LLM; LLM returns absolute or structured relative expressions.","why":"LLMs are bad at calendar arithmetic.","tags":["ai"],"imp":false},{"id":"P3-D-011","phase":"3","src":"log","title":"Never invent a time","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Never invent a time; date-only when unknown (time_known=false). Deadlines (assignment/project) default to 23:59 IST with time_defaulted=true.","why":"Wrong times are worse than missing times.","tags":[],"imp":false},{"id":"P3-D-012","phase":"3","src":"log","title":"Confidence levels","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Confidence high|medium|low on every event/change; low => needs_review=true and no Phase 4 alerts alone.","why":"Lets the app treat uncertainty carefully.","tags":["ai","push","process"],"imp":false},{"id":"P3-D-013","phase":"3","src":"log","title":"Events are per team","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Events are per team; a message only affects its own team's events.","why":"Isolation.","tags":[],"imp":false},{"id":"P3-D-014","phase":"3","src":"log","title":"Document text extraction","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Documents: extract PDF (pypdf), DOCX (python-docx), PPTX (python-pptx) when new or cTag changed; download to memory only; DOC_MAX_BYTES 20 MB, DOC_MAX_PAGES 50; others skipped with reason; no OCR.","why":"Minimal controlled exception to Phase 2's no-content rule.","tags":["ai","app","infra"],"imp":false},{"id":"P3-D-015","phase":"3","src":"log","title":"File-content rule narrowed","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Phase 2 'no file content' rule changes: only src/skim/ai/documents.py may download content, only via /drives/{d}/items/{i}/content, in memory, within limits; the test enforces exactly this.","why":"Keeps the guarantee as tight as possible.","tags":["process"],"imp":false},{"id":"P3-D-016","phase":"3","src":"log","title":"Stored document text","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"doc_chunks stored unredacted (~800 tokens, ~100 overlap, page numbers); redacted before any LLM/embedding call.","why":"Needed for Phase 5 search; privacy for external calls.","tags":["security","ai"],"imp":false},{"id":"P3-D-017","phase":"3","src":"log","title":"AI inside run-all","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"AI runs inside run-all after Phase 2 steps with per-run caps AI_MAX_MESSAGES_PER_RUN 200, AI_MAX_DOCS_PER_RUN 10, AI_MAX_EMBEDS_PER_RUN 500, inside the time budget; separate manual endpoints.","why":"Reuses scheduler and lock.","tags":[],"imp":false},{"id":"P3-D-018","phase":"3","src":"log","title":"Kill switch","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Kill switch AI_ENABLED=false disables all Phase 3 steps without affecting Phases 1-2.","why":"Safe rollout, cost control.","tags":[],"imp":false},{"id":"P3-D-019","phase":"3","src":"log","title":"Students cannot change events","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"Students' messages are classified but cannot create/change events; staff = team owners or STAFF_AAD_IDS; unknown role treated as staff with confidence capped at medium.","why":"A student asking 'quiz moved?' must not move the quiz.","tags":["ai"],"imp":false},{"id":"P3-D-020","phase":"3","src":"log","title":"Eval set is the source of truth","date":"2026-10-25","by":"human (PHASE3.md §2)","text":"tests/eval/eval_messages.csv (human-corrected) is the source of truth for quality, replayed in order through the real pipeline carrying state.","why":"Measures real behaviour incl. dedupe and changes.","tags":["ai","process"],"imp":false},{"id":"P3-D-021","phase":"3","src":"log","title":"Eval key corrections and scoring rules (T2)","date":"2026-10-25","by":"human (T2 review), claude-code applied","text":"(1) A cancel/reschedule with a clear date and no matching event creates a new event with that status (PHASE3.md §5.2 step 4 updated). (2) time_set/date_set rows have status scheduled; a reminder after a reschedule stays rescheduled. (3) Venue only where stated or inherited from the linked event. (4) 23:59 deadlines are correct whether stated or defaulted; end times are not scored in Phase 3; weekly office hours stay one event (recurrence is future work, PHASE3.md §11); msg 50 day 2 has no links_to.","why":"resolve P3-DIFF-001…004.","tags":["ai","push","app"],"imp":false},{"id":"P3-D-022","phase":"3","src":"log","title":"Provisional model choices from the T1 spike","date":"2026-10-25","by":"claude-code (recommendation; human sets the env values)","text":"GROQ_MODEL=openai/gpt-oss-120b (strict json_schema 3/3 valid, 3/3 correct, ~0.7 s); openai/gpt-oss-20b is the A/B alternative. Gemini fallback = gemini-3.5-flash-lite (provisional, JSON mode unverified). Embedding model unchanged, unverified.","why":"see PHASE3_SPIKE.md.","tags":["ai","data","process"],"imp":false},{"id":"P3-D-023","phase":"3","src":"log","title":"Author role resolution","date":"2026-10-25","by":"claude-code","text":"staff = STAFF_AAD_IDS or the team's installer (teams.installed_by_aad); when an allow-list is configured everyone else is a student; with no allow-list other authors are unknown (treated as staff, confidence capped at medium, P3-D-019). The role used is stored on message_analysis.author_role.","why":"the database holds no team member roster (only the installer), so \"student\" cannot be known otherwise.","tags":["security","ai"],"imp":false},{"id":"P3-D-024","phase":"3","src":"log","title":"Event time columns","date":"2026-10-25","by":"claude-code","text":"event_date (IST date) is set whenever a date is known (not only date-only events); starts_at only when a time is stated or a deadline default applies. Deadline defaults: starts_at 23:59 IST, time_known=false, time_defaulted=true. A stated time (even 23:59) is time_known=true.","why":"simple date queries for Phase 4; keeps \"stated\" and \"defaulted\" distinguishable (P3-D-011).","tags":[],"imp":false},{"id":"P3-D-025","phase":"3","src":"log","title":"Resolution details beyond §5.2","date":"2026-10-25","by":"claude-code","text":"titles are compared as word sets + number sets (stop words dropped, plurals stemmed). Levels: exact; subset (one title's words contain the other's, numbers compatible; a single hit is taken, several go to the LLM tie-break if the message refers to an existing event); generic (title only repeats the type word, e.g. \"the lab\"). Numbers that differ never match (Quiz 2 / Quiz 3). class and office_hours events only match the same date (they recur). An event touched by an earlier item of the same message cannot be matched again by a later item (\"day 1 / day 2\"). The change type is derived from the diff of old vs new values, not from the LLM's action label. Details changes are only recorded when action is not create/restate. A date without a time never inherits the old time unless the message says \"same time\".","why":"eval msgs 6, 15, 28, 39, 49, 50; the \"never invent a time\" rule.","tags":["ai","process"],"imp":false},{"id":"P3-D-026","phase":"3","src":"log","title":"ai-reprocess records analyses only","date":"2026-10-25","by":"claude-code","text":"/jobs/ai-reprocess?prompt_version=X re-analyses messages under X but does NOT touch events (replaying old messages would undo later changes). It rejects the live prompt version (400), because analysing the live version without applying events would mark messages done with no events.","why":"FR-308 says old analyses are kept; event safety; security review.","tags":["ai"],"imp":false},{"id":"P3-D-027","phase":"3","src":"log","title":"Time-only messages","date":"2026-10-25","by":"claude-code","text":"when.kind none or same_as_existing with a time attaches that time to the matched event's date; with no matched event it stays undated (needs_review). The prompt tells the model to use same_as_existing + time for \"the quiz will be 10:15-10:45\".","why":"eval msg 9 had no way to express a time without a date.","tags":["ai","process"],"imp":false},{"id":"P3-D-028","phase":"3","src":"log","title":"T8 gate passed on the Gemini fallback; Groq not yet validated post-fix","date":"2026-10-25","by":"Claude, from the human's run \"title fix\" (prompt p3-v1, git 4215e7e)","text":"All §10.1 targets met (category 0.94, event F1 0.96, type 0.973, datetime 1.0, links 1.0, 0 invented/duplicate/student events). BUT 49 of 51 Groq calls got 429 (free-tier cap, Retry-After ~450-540 s), so ~49 of 50 messages were answered by the Gemini fallback (gemini-3.5-flash-lite, now free tier). Only the fallback chain is proven. Groq output quality after the schema fix is unmeasured. Remaining misses: msg 2 (extra Office hours event), msg 41 category, msg 50 category, msg 42 type exam vs other; venue \"in class\" should be empty (info rows). No prompt change made (targets met). Revisit: re-run when Groq has quota (or on Developer tier) before choosing the production primary.","why":"","tags":["ai","app","data"],"imp":false},{"id":"P3-D-029","phase":"3","src":"log","title":"NVIDIA NIM added as an optional third (last-resort) provider","date":"2026-10-25","by":"Claude, on the human's request","text":"providers/nim.py (OpenAI-compatible, [url] structured output via nvext.guided_json + schema in the prompt, dropped if NIM rejects it). Enabled only when BOTH NIM_API_KEY and NIM_MODEL are set; order groq -> gemini -> nim. Router._parse now tolerates json fences / chatter around the object (NIM models without guided decoding add them). scripts/eval_nim.py = smoke test + full eval with NIM as the only provider; run_eval.py --providers groq,gemini,nim` picks/orders providers. Model choice is the human's (suggested meta/llama-3.3-70b-instruct); the NIM request shape is unverified against the live API until the human runs eval_nim.py.","why":"","tags":["ai","data","process"],"imp":false},{"id":"P3-D-030","phase":"3","src":"log","title":"Provider order: Gemini primary, Groq secondary","date":"2026-10-25","by":"the human (Groq free tier rate-limits too hard; Gemini free tier works and passed the eval)","text":"AIServices.build and run_eval.py --providers default are now gemini,groq (NIM, when configured, stays last). Supersedes the \"Groq, then Gemini\" order of P3-D-001/002. GROQ_MODEL is still required by config (kill-switch rule unchanged).","why":"","tags":["ai"],"imp":false},{"id":"P3-D-031","phase":"3","src":"log","title":"T9 documents design","date":"2026-10-25","by":"Claude","text":"(1) ai/documents.py is the only module that names /content; it GETs /drives/{d}/items/{i}/content with the app token (ids validated against a strict charset), does NOT follow redirects automatically, and fetches Graph's 302 target WITHOUT the Authorization header (target must be https). Size is capped by Content-Length and while streaming; the URL is never logged/stored. (2) PDF via pypdf (new dependency, pinned); DOCX/PPTX parsed with stdlib zipfile + ElementTree (no lxml/python-docx), with a 100 MB expanded-size zip-bomb guard. (3) Chunks: 1500 chars, 200 overlap, page range kept; each PPTX slide / PDF page is its own unit; DOCX has no page numbers. (4) Permanent problems are recorded in document_texts (skipped: too_large, too_many_pages, encrypted, unsupported_type, no_text; failed: not_found, no_access, unreadable_*) so a ctag is never retried forever; transient fetch errors (network","why":"","tags":["security","ai","app","data"],"imp":false},{"id":"P3-D-032","phase":"3","src":"log","title":"T9 security-review fixes","date":"2026-10-25","by":"Claude","text":"(1) Document events obey the author rule (P3-D-019): role = author_role of the file's last modifier (else creator) via STAFF_AAD_IDS / team installer; a student's file is read and stored (text stays searchable later) but never sent to the model and never creates or changes events. With no STAFF_AAD_IDS configured, other authors are \"unknown\" (allowed, confidence capped at medium), exactly like chat messages; so STAFF_AAD_IDS should be set before students can upload. Not done: forbidding documents from cancelling/rescheduling (a revised syllabus legitimately does). (2) DOC_MAX_CHARS (default 150000) caps extracted text per file; above it the file is skipped with reason too_much_text (no chunks, no LLM calls). Chunk inserts are batched with executemany.","why":"","tags":["security","ai","app","process"],"imp":false},{"id":"P3-D-033","phase":"3","src":"log","title":"document role: last modifier only; documents capped at medium","date":"2026-10-25","by":"Claude (security review of P3-D-032)","text":"The creator's role is used only when the file has no recorded modifier at all. A modifier known only by name (no AAD id) yields no id: student when STAFF_AAD_IDS is set, else unknown. Even staff-authored documents are capped at medium confidence (files can be co-edited by students before a staff edit).","why":"","tags":["security","ai"],"imp":false},{"id":"P3-D-034","phase":"3","src":"log","title":"T10 embeddings design","date":"2026-10-25","by":"Claude","text":"(1) Gemini only (P3-D-003): GeminiProvider.embed() uses batchEmbedContents with outputDimensionality=768, task type RETRIEVAL_DOCUMENT for stored text and RETRIEVAL_QUERY for searches; wrong-sized answers are rejected. Embeddings are enabled only when EMBED_DIMS=768 (the column is vector(768)). (2) What is embedded: the CURRENT version of live standard-channel messages (subject + text) and chunks of current document text; every text is redacted with that item's author/mentioned names before it leaves the process (FR-302). The ref_key includes the message version / chunk id and the model, so an edit gets a new vector and a changed file's old chunk vectors are deleted with the old chunks. (3) Search (GET /debug/search?q=&team_id=&k=, DEBUG_TOKEN): the query is redacted and embedded, then ranked by cosine in SQL; only current versions of live messages/chunks of active teams are returned, so","why":"","tags":["security","ai","app","data"],"imp":true},{"id":"P3-D-035","phase":"3","src":"log","title":"T11 hardening results","date":"2026-10-25","by":"Claude","text":"(1) Redaction-leak test found a real gap: the replied-to message's author name was not redacted when quoted in a reply; parent_from_name is now part of the pending-message rows and the redactor's name list. Known limit (rule-based redaction, P3-D-004): a person's name that appears only in free text, is not an author/mentioned/parent author and has no Prof./Dr. title, is NOT redacted; the human accepted rule-based redaction in P3-D-004, and an NER pass is future work. (2) Prompt wrapper tags (message, parent, subject, document, author_role, posted_ist, item, candidates) are now neutralised both as opening and closing tags inside untrusted text. (3) Log-scrub test runs the real Groq client against a server that echoes the prompt in its error body and asserts no text, name, key or prompt reaches the logs. (4) Default GEMINI_MODEL is now gemini-3.5-flash-lite (the 2.5 name was 404 for the hu","why":"","tags":["security","ai","app","data"],"imp":false},{"id":"P3-D-036","phase":"3","src":"log","title":"only explicit change language moves an event","date":"2026-10-26","by":"Claude, from the live reminder bug (P3-DIFF-020)","text":"Encoded in the resolver/pipeline, not only in the prompt: MOVING_ACTIONS = {reschedule}. Any other action (restate, create, venue, details...) may only fill a missing date or time and never overwrite; a bare weekday that matches the event's own weekday is the same day; a disagreement is flagged (needs_review + a needs_review change row with the stated values) and not applied. The edit of the very message that created an event still supersedes it. Safe failure: a real reschedule the model mislabels is flagged for a human instead of silently ignored or applied.","why":"","tags":["ai","process"],"imp":true},{"id":"P3-D-037","phase":"3","src":"log","title":"spec edits at close-out","date":"2026-10-26","by":"the human asked (\"apply it unless it changes the schema\"); Claude applied","text":"(1) P3-D-007: processing key without model family (P3-DIFF-008). (2) PHASE3.md §5.1: event_date is set whenever a date is known (P3-DIFF-010 / P3-D-024). (3) PHASE3.md §10.2/§10.3: live and automated evidence. (4) Status line: Phase 3 complete.","why":"","tags":["ai","process"],"imp":false},{"id":"P3-D-038","phase":"3","src":"log","title":"a move needs the model's label AND change language in the text","date":"2026-10-26","by":"Claude, after the live re-test (P3-DIFF-021)","text":"resolver.may_move(action, text): only reschedule items whose message contains change language (moved, postponed, rescheduled, shifted, changed, correction, extended, instead, \"now on/at ...\", brought forward ...) may change an existing event's date/time; everything else fills in what is missing or is flagged on conflict (P3-D-036). Reason: the model can mislabel a reminder as a reschedule, and a calendar that silently moves a quiz is worse than one that flags a doubtful change.","why":"","tags":["ai","push","app"],"imp":false},{"id":"P3-D-039","phase":"3","src":"log","title":"Phase 3 declared complete","date":"2026-10-26","by":"the human (\"everything is fine ","text":".. we are done with Phase 3\"), recorded by Claude. Remaining items are monitoring/hygiene (see PHASE3.md §10.3 open boxes and HANDOFF.md), not blockers. Event \"Quiz 2\" seen live was created from the human's own earlier test posts (messages survive a reset); no defect.","why":"","tags":["process"],"imp":false},{"id":"P4-D-150","phase":"4","src":"log","title":"T0: RLS lockdown is dynamic; app keys git-ignored","date":"2026-10-26","by":"Claude","text":"Migration 007 loops over every public table without RLS and enables it (covers schema_migrations and later tables, no policies = deny for anon/authenticated; the backend's postgres role bypasses RLS). Guards: scripts/check_rls.py (exit 1 if any table is unprotected) and tests/test_rls_migrations.py (a later migration that creates a table without ENABLE ROW LEVEL SECURITY fails the suite). Also: .gitignore now covers firebase-service-account.json, google-services.json, keystores and the app's node_modules/.expo/dist (the files existed untracked in App/skim/). Verified live by the human: Data API off, publishable-key curl gives 503 PGRST002 (no rows), check_rls.py = 0, backend still reads (/debug/teams).","why":"","tags":["security","app","data","process"],"imp":true},{"id":"P4-D-151","phase":"4","src":"log","title":"T1: deep link built in code, no new columns; account deletion via SQL","date":"2026-10-26","by":"Claude, from PHASE4_SPIKE","text":"md. (S1) Link = …/l/message/{channelId}/{messageId}?tenantId&groupId&parentMessageId&createdTime plus optional teamName/channelName, all from stored fields; root and reply forms opened the exact message on the human's phone. (S5) The backend role can DELETE on auth.users, so D-134 uses SQL (retest at A15). S2/S3/S4 need a device and are retested at the T8 gate.","why":"","tags":["security","data","process"],"imp":false},{"id":"P4-D-152","phase":"4","src":"log","title":"T2: storage shape","date":"2026-10-26","by":"Claude","text":"(1) User tables hang off app_users.id with ON DELETE CASCADE, so account deletion is delete from app_users (the auth row is removed after). (2) leave_subscription sets left_at and deletes the user's state, stars and reminders on that team's items (the spec: \"state for that team's items is deleted\"). Re-joining starts fresh (joined_at = now, unmuted). (3) add_subscription returns False only for an active member. (4) Join attempts count every attempt (ok or not) in the window; the 10/hour rule in T5 uses count_join_attempts. (5) upsert_reminder only ever updates the owner's row (returns None for someone else's id); a tombstone for a never-stored (virtual auto) reminder inserts a deleted row. (6) upsert_feed_item is idempotent per source, never moves occurred_at, never un-hides, only adds event links. (7) Settings are stored sparse (overrides only); defaults are merged in code (T3). (8) job","why":"","tags":["security","push","app","data"],"imp":false},{"id":"P4-D-153","phase":"4","src":"log","title":"T3: auth middleware, settings and account deletion details","date":"2026-10-26","by":"Claude","text":"(1) PyJWT[crypto]==2.15.1 is now an explicit dependency (it was only transitive). Env names: API_ENABLED, SUPABASE_URL (must be https), SUPABASE_JWT_SECRET. (2) Algorithms: JWKS keys only for ES256/RS256/EdDSA, and the key's own algorithm must equal the token's; HS256 only when the token says HS256 AND a secret is set; none and anything else is rejected, so the public-key-as-HMAC-secret attack fails (tested with a hand-forged token). A token needs kid, exp, sub (a UUID), aud=authenticated, iss=SUPABASE_URL/auth/v1; 10 s leeway. (3) JWKS: cached 10 min, one refetch on an unknown kid with a 30 s cooldown (a flood of junk kids cannot cause a refetch storm); if a refresh fails the cached keys keep working; with no cache at all the answer is 503, not 401. (4) Per instance, a user is re-checked at most every 5 min: still present in auth.users (a deleted account's still-valid token gets 401 and","why":"","tags":["security","app","data","process"],"imp":false},{"id":"P4-D-154","phase":"4","src":"log","title":"T4: feed-build design","date":"2026-10-26","by":"Claude","text":"(1) No high-water mark. Each pass asks storage for sources that have no card yet (an anti-join on feed_items) inside a look-back window (FEED_LOOKBACK_DAYS, default 30; scripts/feed_build.py --backfill has no window) and applies the pure rules in skim/feed.py. Reason: a message's AI category arrives after the message, so a mark on message time would skip late-qualifying messages (P4-DIFF-004). Known limit: sources that never qualify (student chitchat) are re-checked each pass inside the window, and a pass reads at most 5000 candidates per kind; fine for a class team. (2) Staff = the Phase 3 rule (STAFF_AAD_IDS + the installer); STAFF_AAD_IDS is now also read into Settings so feed-build works with AI off. (3) Messages: staff-authored always; otherwise only AI category event/change/announcement/resource (latest ok analysis of the current version). A message with no author id is a bot/syste","why":"","tags":["security","ai","app","data"],"imp":false},{"id":"P4-D-155","phase":"4","src":"log","title":"T5: deck, state and star behaviour","date":"2026-10-26","by":"Claude","text":"(1) Eligibility (P4-D-112): a card is dealt if it was put back or its snooze ended, or happened since 7 days before the user joined, or is linked to an upcoming event (dated, not over, not cancelled/done; skim/eventtime.py). A date-only event is over when that IST day ends; a start without an end is over 1 h later. (2) Fold (P4-D-110) at read time, in skim/api/deck.py: cards linked to an event fold into the newest change card for it when they are not newer (age key = time in Teams, then change > message at equal time, then id). Chains resolve to the final card. A card newer than the change, an already-swiped card, and unrelated cards stay. Swiping a card writes the same state to its folded originals (user_item_state.folded_into = the card). (3) undo clears the card and its folded originals (back in their natural place); restore (put back from history) sets a snooze that ends now, so the ","why":"","tags":["security","ai","push","app"],"imp":false},{"id":"P4-D-160","phase":"4","src":"log","title":"T6: reminder engine and API","date":"2026-10-26","by":"Claude","text":"(1) Rows hold intent, never a time. A reminder row is (event + kind), (event + offset) or an absolute time; skim/reminders.py computes every fire time at read time from the event's CURRENT start, so a reschedule moves them, a cancelled/done event silences them (rows stay) and uncancelling brings them back. Past times and anything beyond days (default 30, 1–90) are not returned; at most 60, soonest first. (2) Recommended pair (D-116): day before at day_before_time; same day = start − same_day_hours, never before earliest that day, dropped if that lands at or after the start (a 07:00 or earlier start has no same-day reminder). (3) Untimed date-only events (the Phase 3 all-day rule: a non-deadline with a date has no starts_at; deadlines default to 23:59): day-before at 20:00 and a same-day reminder at earliest (07:00); an offset counts from midnight at the start of that IST day. (4) Automat","why":"","tags":["security","ai","push","app"],"imp":false},{"id":"P4-D-161","phase":"4","src":"log","title":"T7: devices, change alerts, receipts, sync","date":"2026-10-26","by":"Claude","text":"(1) Devices: POST /devices {expo_push_token, platform} accepts only (Exponent|Expo)PushToken[...] and android/ios; at most 10 ACTIVE tokens per user (an 11th new one is 429; this is the registration flood limit); a token moves to whoever registers it last (one phone, several accounts), but a token that changes owner keeps its disabled_at: only the same user re-registering clears it (automated security review of the T2 commit; proof of possession is not possible because Expo gives the server no challenge channel). DELETE /devices/{token} removes only your own (404 otherwise). (2) push-alerts (inside run-all, after feed-build; no-op unless PUSH_ENABLED): enqueue then send. Enqueue reads event changes after a cursor kept in sync_state key push-alerts; the first run only stores the current maximum, so switching push on never alerts about history. Only the 7 card change types; several changes","why":"","tags":["security","ai","push","app"],"imp":false},{"id":"P4-D-170","phase":"4","src":"log","title":"T8: app foundation","date":"2026-10-26","by":"Claude","text":"(1) Config: app.json replaced by App/skim/app.config.ts (contents carried over; dark-only, Midnight Glass colours for splash/adaptive icon; android.googleServicesFile = process.env.GOOGLE_SERVICES_JSON ?? './google-services.json'; plugins: expo-router, expo-splash-screen, @react-native-google-signin/google-signin with NO options (Firebase flow per the library docs), expo-secure-store, expo-background-task, expo-notifications with default channel changes). expo-calendar and expo-dev-client have no plugin entry yet: calendar permissions are decided at T11 (spike S4); the dev client is added by expo install. eas.json: development (dev client, internal, apk, environment development), preview (internal, apk), production defined, unused (P4-D-102). (2) Dependencies (SDK 58, via expo install): google-signin 16.1, supabase-js 2.118, TanStack Query 5 + async-storage persister, expo-secure-store, ","why":"","tags":["security","push","app","data"],"imp":false},{"id":"P4-D-171","phase":"4","src":"log","title":"T9: join, cache, outbox, device registration","date":"2026-10-26","by":"Claude","text":"(1) Join (src/app/join.tsx, lib/join.ts): the code field uppercases and keeps only letters/digits (max 12; the button needs 4+); the server's answers become plain sentences (404 no such code, 410 bot removed, 429 too many tries, no connection); a 409 \"already joined\" is treated as success and reads the team from the body; the sentence never echoes the typed code or the server's text. A student with no team is redirected from Home to Join; Join is also reachable from Home (\"Join another team\"; the Settings entry comes at T13). (2) Cache: TanStack Query with an AsyncStorage persister, one cache per account (key skim-query-cache:<user id>), 7-day max age, networkMode: offlineFirst, a buster string for payload-shape changes, only successful queries persisted; 4xx are never retried (429 and 5xx twice). The cache is plain AsyncStorage (not encrypted): it holds card text, in line with the spec'","why":"","tags":["security","ai","push","app"],"imp":false},{"id":"P4-D-172","phase":"4","src":"log","title":"T10: the swipe deck","date":"2026-10-26","by":"Claude","text":"(1) Gesture: Gesture Handler 3's usePanGesture + Reanimated 4 shared values; the drag, tilt, READ/OPTIONS stamps and the cards stepping forward behind it all run on the UI thread, nothing in a drag touches React state. A swipe lands (JS) via scheduleOnRN after a 200 ms fly-out. Decision (lib/swipe.ts, tested): dismiss/open when dragged ≥30 % of the width, or flicked ≥800 px/s with ≥24 px of travel the same way; a flick against the drag, or a twitch, does nothing. The pan only activates after 12 px sideways and fails after 20 px vertically, so pull-to-refresh and scrolling still work. A short vibration (core Vibration) confirms a landed swipe. (2) Same actions without a swipe: a \"Mark as read\" button, an \"Open\" button, and TalkBack custom actions on the card. (3) Optimistic + outbox: a swipe removes the card from the cached deck at once and enqueues state:<id> (dismiss/open); undo re-inse","why":"","tags":["security","app","infra","design"],"imp":false},{"id":"P4-D-173","phase":"4","src":"log","title":"nothing the student reads or taps is translucent","date":"2026-10-26","by":"Claude, at the human's instruction (\"stop making backgrounds transparent\")","text":"The T10 deck used Design.md's translucent glass fill, so the stacked cards behind the top card showed through it and the text could not be read (I had also faded the back cards). Now every card, pill, file chip, button, input, list card and bottom sheet uses a SOLID colour (solid in constants/skim-theme.ts: card #272E3F, hot card #2B1D2E, border #3A4254, block #1F4E66, plus #323A4B rows and solid pills); the cards behind the top card are plain solid shapes with no content and no fading. The only translucent layer left is the scrim that dims the screen behind a bottom sheet. A test fails if a card or any coloured mark on it is not a 6-digit hex.","why":"","tags":["app","design","process"],"imp":false},{"id":"P4-D-174","phase":"4","src":"log","title":"T11: card detail and actions","date":"2026-10-26","by":"Claude","text":"(1) Layout: the detail screen shows the full card, then ACTION ROWS (not a cramped icon bar), then \"Your reminders\" (each removable), \"What changed\" (the events' change history, newest first, without created/restated/needs_review) and \"Earlier posts this replaces\" (the folded originals in full). The deck's right swipe and the Open button both lead here. (2) Actions: *Recommended reminders* (only for a card with an upcoming dated event and not already set; the button and a caption show both times first: e.g. \"Sun 1 Nov, 20:00 and Mon 2 Nov, 07:00\"); *Remind me…* sheet: \"before the event\" (15 min / 30 min / 1 h / 2 h / 1 day / 2 days, only those still in the future, and only for an event with a real start time), \"at a time\" (in 1 hour, tonight 20:00, tomorrow 09:00) and \"Pick a date and time…\" (a plain-JS day strip + hour/minute steppers in 5-minute steps: a native date picker would need a","why":"","tags":["security","push","app","data"],"imp":false},{"id":"P4-D-175","phase":"4","src":"log","title":"T12: notifications on the phone","date":"2026-10-26","by":"Claude","text":"(1) Reminders are scheduled by the phone, decided by the server. GET /reminders?days=30 is the only source; planSchedule keeps what is between 5 s and 30 days ahead, soonest first, at most 60, de-duplicated by id, with title/body tidied and cut to notification size, and item_id only if it is a positive whole number. Each is scheduled as a one-off DATE trigger on the Android reminders channel using the REMINDER'S ID as the notification identifier, so a moved time replaces the old alarm instead of adding a second one; reminders the server dropped are cancelled one by one. This replaces the spec's \"cancel all, then schedule all\" (P4-DIFF-012): there is never a moment with no reminders scheduled. A failed fetch or malformed response changes nothing (an outage must not wipe reminders); no notification permission means nothing is scheduled and nothing is recorded as done. (2) When it runs: the","why":"","tags":["security","push","app","data"],"imp":false},{"id":"P4-D-176","phase":"4","src":"log","title":"T13: History, Starred, Important, full Settings","date":"2026-10-27","by":"Claude","text":"(1) Navigation: a (tabs) group with a floating, SOLID bar (P4-D-173): Deck, History, Starred, Important; the settings gear, the join screen and the card detail stay outside the tabs. Every tab uses one frame (TabScreen: title, gear, room under the content for the bar). (2) History: the server's /history (limit from settings), newest swipe first, \"Opened\" or \"Marked as read\" under each, Put back (optimistic: leaves the list, state:<id> restore queued, the card returns to the top of the deck; a restore still in the outbox keeps the row hidden even if a refetch races ahead), tapping a row opens the card. Subtitle \"Your last N cards\". (3) Starred: /starred, newest star first, Remove star (optimistic + queued DELETE), expiry label for temporary stars: under an hour \"less than an hour left\", under a day \"N h left\", up to 6 days \"N days left\", otherwise \"until Sun 1 Nov\" (India dates); a perman","why":"","tags":["security","push","app","process"],"imp":false},{"id":"P4-D-177","phase":"4","src":"log","title":"offline: the phone keeps the last 50 cards in full, loaded before any tab is opened","date":"2026-10-27","by":"Claude, at the human's request (\"store at least the last 50 cards on the phone, load all the data even before we have seen the deck, keep it until the 51st\")","text":"(1) Background loader (lib/offline-runtime.tsx, mounted in the root layout): the moment the app is open and signed in (and again whenever the app returns to the front, at most every 3 minutes, when the connection returns, and right after the outbox empties) it loads the deck (first page now 50 cards), History, Starred, reminders, teams and settings, then the FULL detail (/items/{id}, with text, event history and the folded originals) of every card in the window, 3 at a time. No tab has to have been visited. Offline it does nothing and never discards what is already saved. (2) The window (lib/offline-window.ts): the 50 newest cards across unread (deck) and read (History) together, plus every starred card (up to 100 extra). When a newer card pushes one out, that card's saved detail is removed (the \"51st\" rule). (3) The saved cache now remembers for 30 days (was 7) and is trimmed if it grow","why":"","tags":["security","push","app","data"],"imp":true},{"id":"P4-D-178","phase":"4","src":"log","title":"Phase 4 declared complete","date":"2026-10-27","by":"the human (\"it is time for HANDOFF, ELI5 and PHASE4_REPORT","text":"md\" after finishing the live run on their phone), recorded by Claude. Remaining items are decisions and hygiene, not blockers: P4-DIFF-014 (open), where App/ lives in git, one unpushed script commit (f79abc4), and the recommendations in PHASE4_REPORT.md §9. During the run the human also asked for, and got, solid (non-transparent) surfaces, a working \"turn on notifications\" path, an offline copy of the last 50 cards loaded before any tab is opened, correct Starred/History behaviour offline, and a delete-account box that the keyboard no longer covers (P4-D-173/175/177).","why":"","tags":["security","push","app","process"],"imp":false},{"id":"P4-D-179","phase":"4","src":"log","title":"an explicit staff change clears \"needs review\" (fixes P4-DIFF-014)","date":"2026-10-27","by":"Claude, at the human's request (\"fix P4-DIFF-014\"); this changes a Phase 3 rule, so it is logged here","text":"Rule (ai/pipeline.py, end of _update_event): when a message's change is APPLIED (relation changed, i.e. a reschedule, cancel, un-cancel, venue, time or date change), its confidence is high, no doubt was raised on it (review false, no conflict flag set by the same message) and the event is currently flagged, the flag is cleared (needs_review = false, the event's confidence becomes high like any applied change) and one needs_review entry is added to the event's history: {needs_review: true} -> {needs_review: false, reason: \"confirmed by an explicit change\"}. Only staff can reach \"high\": students change nothing, and files are capped at \"medium\" (a file that moves a date still leaves the flag). What does NOT clear it: a plain restatement (even one that agrees with the date), a change the model is only medium/low confident about, a change that itself conflicts, a student message, any file. Ef","why":"","tags":["ai","push","app","data"],"imp":false},{"id":"P4-D-180","phase":"4","src":"log","title":"the app lives in the backend repo under App/skim; pushed","date":"2026-10-27","by":"Claude, at the human's request (\"commit and push the app too to the github\")","text":"App/skim was committed to o7PY/SkimForTeams (136 files). Before staging, every file that would be added was scanned for the secret values on this machine (.env files, google-services.json, firebase-service-account.json, including each line of the service-account private key) and for key/JWT patterns: none found (the only matches were the public project number, project name and package name). Git-ignored and therefore NOT in the repo: google-services.json, firebase-service-account.json, .env, .env.local, .claude/, .expo/, node_modules/, keystores. The container image copies only pyproject.toml, src, migrations and scripts, so the app is not in it. Commits pushed (b605abc..3427724): the acceptance-evidence script, the P4-DIFF-014 fix (P4-D-179), the app, and the removal of the unused Expo starter code (src/components, src/hooks, src/constants/theme.ts, src/global.css, scripts/reset-project","why":"","tags":["security","push","app","data"],"imp":false},{"id":"P5-D-1","phase":"5","src":"log","title":"logo A \"Deck\" approved; brand assets exported (T0/T1, 2026-10-27)","date":"","by":"the human picked A from Bookkeeping/logo-concepts","text":"html (fan of three cards: indigo #6366F1, sky #38BDF8, snow #F8FAFC front card with an amber #FACC15 chip, on navy #0F172A); Claude exported the assets. App (App/skim/assets/images): icon.png 1024 full-bleed; adaptive android-icon-foreground.png (glyph inside the 66% safe zone), android-icon-background.png (solid navy), android-icon-monochrome.png and the new notification-icon.png 96 px (white silhouette; a transparent gap around the front card keeps the fan readable); splash-icon.png (logo on transparent, the navy splash background comes from config); favicon.png. app.config.ts: expo-notifications now uses the new small icon and the splash imageWidth went 76 -> 220 (the new glyph has padding). Both are native changes: they appear with the next build (T6). Site (skim-site/assets (inside the SkimForTeams folder but git-excluded locally via .git/info/exclude; it becomes its own repo o7PY/s","why":"","tags":["push","app","design","process"],"imp":false},{"id":"P5-D-2","phase":"5","src":"log","title":"the site lives in SkimForTeams/skim-site, not ~/skim-site","date":"2026-10-27","by":"the human (\"do not create the assets outside the SkimForTeams folder\")","text":"Supersedes the local path in P5-D-115 (the separate public repo o7PY/skim-site and GitHub Pages are unchanged). Nothing is written outside /home/py/SkimForTeams; the folder is excluded from the backend repo through .git/info/exclude (local only, no tracked change), and gets its own git init when T8 builds the site. Throwaway render files go under this folder too (never /tmp or ~).","why":"","tags":["infra","design"],"imp":false},{"id":"P5-D-3","phase":"5","src":"log","title":"palette PROPOSAL written, awaiting approval (T2, 2026-10-27)","date":"","by":"Claude (proposal only, per P5-D-103; Design","text":"md untouched). Bookkeeping/design-palette.md + Bookkeeping/palette-preview.html, both generated by skim-site/brand/palette.py + preview.py, which compute WCAG ratios for 114 text/icon pairs (dark and light): 114 pass. 6 first-draft pairs missed 4.5:1 and were fixed by lightening or darkening those shades, not by loosening the rule. Choices: 9 event-type hues all >= 48 degrees from red (no pink/rose/orange), update = soft indigo, 8 pastel team accents, a new light theme (the app is dark-only today). Trade-offs listed in the doc (hue overlap resolved by chip/stripe/dot shapes and labels; presentation~success and quiz~warning share families). Next after approval: T3 (single theme module, userInterfaceStyle to automatic).","why":"","tags":["app","design","process"],"imp":false},{"id":"P5-D-4","phase":"5","src":"log","title":"palette approved; theme module and colour coding in the app (T3, 2026-10-27)","date":"","by":"the human approved the palette (\"looks good\"); Claude implemented it","text":"Design.md is NOT edited yet (P5-D-103: only when the human says so). Module: src/constants/theme.ts replaces skim-theme.ts: dark and light token sets, useTheme() (follows the phone; userInterfaceStyle is now automatic), makeStyles(), typeTone/toneOf/tint for chips, teamAccent, NOTIFICATION_COLOR. Test __tests__/theme.test.ts: fails on any colour literal outside the module (B2), checks AA for text on every surface, every type chip and semantic chip, team dots (3:1), and that no type/team/semantic colour is red-ish while the important colours are (B3). App: event-type chips (ui/type-chip.tsx: icon + label + colour) on cards, the Important checklist and Settings-free detail via the same card; a team dot on cards and in Settings; change cards get a shared update stripe, icon and change block; the important card is the red one; the Unconfirmed pill is warning. Deviations from the proposal, al","why":"","tags":["security","push","app","data"],"imp":false},{"id":"P5-D-5","phase":"5","src":"log","title":"animations and haptics (T4, 2026-10-27)","date":"","by":"Claude, implementing P5-D-106/107/108","text":"The D-107 list, each item and where it lives: card follows the finger with a tilt capped at 8 degrees (lib/swipe.ts MAX_TILT) and springs back with a critically damped spring (damping 30 / stiffness 260, ratio ~0.93, so no visible overshoot); flies out over 200 ms; the next card scales 0.96 -> 1 as the top one leaves (ui/swipe-deck.tsx); a tinted DISMISS / OPEN label fades in with the drag (renamed from READ / OPTIONS, the copy pass in T5 covers the rest); the undo toast slides up and back (ui/motion.tsx useToastMotion, deck screen); the detail screen opens with a fade + 24 px rise (RiseIn; its stack animation is none so the screen does not also animate natively); the star pops 1 -> 1.15 -> 1 once (Pop kind=\"pop\" on the star row); checkboxes tick 0.8 -> 1 (Pop kind=\"tick\"); chips cross-fade colour over 200 ms (Reanimated CSS transitions in ChipBody, used by type chips and pills); list ro","why":"","tags":["app","data","design","process"],"imp":false},{"id":"P5-D-6","phase":"5","src":"log","title":"T5 states, copy, accessibility; and a standing rule: style and design only","date":"2026-10-27","by":"the human, who said (twice): the whole app worked before Phase 5, \"this is just a redesign\", \"change nothing about this app which isn't a style or design thing\"","text":"Standing rule for the rest of Phase 5: only looks, motion, copy and states change; no auth, data, sync, outbox, reminders, push or API code; the Google SHA-1 is already on the OAuth client (do not ask again). Supersedes part of P5-D-5: the swipe flying lock, the createSwipeGate and the \"card must still be on top\" check were behaviour, so they are REMOVED (with their tests); the swipe commit/dismiss/open flow is exactly Phase 4's again. Consequence: acceptance B5 (\"fast repeated swipes never double-apply\") is no longer something Phase 5 adds; it is whatever Phase 4 did (the double-landing I found in T4 was a theoretical race, never seen by the human). Kept, because they are feel and the spec chose them: the 35% slow-drag distance (DISTANCE_FRACTION, was 30%; one number to revert) and the 8 degree tilt cap. What T5 added (all presentation): ui/states.tsx (pulsing skeletons for the deck, Hi","why":"","tags":["security","push","app","design"],"imp":true},{"id":"P5-D-7","phase":"5","src":"log","title":"release config (T6, 2026-10-27)","date":"","by":"Claude","text":"expo-updates added (~58.0.18); runtimeVersion: { policy: 'appVersion' } and updates.url (the EAS project) in app.config.ts; eas.json: preview has channel preview; production has channel production, autoIncrement (versionCode, remote source) and buildType: apk. Version stays 1.0.0 (the first build on the project reported appVersion 1.0.0, build 1). Release hygiene audit, no change needed: every console.* in src is already behind __DEV__; the config loader rejects a non-https API base outside dev; the API base is the same Cloud Run service in every environment; expo-dev-client only provides its launcher/menu in a developmentClient build, and preview/production are not. EAS environment variables: development and preview hold the four public EXPO_PUBLIC_* values and the GOOGLE_SERVICES_JSON file secret; production is EMPTY and must be filled (same four values + the file) before the T7 produc","why":"","tags":["security","app","infra","process"],"imp":false},{"id":"P5-D-8","phase":"5","src":"log","title":"the site scaffold (T8, 2026-10-27)","date":"","by":"Claude","text":"skim-site/ (own git repo, local commit ed0e5aa, not pushed; excluded from the backend repo) is a Python generator (build.py, content in one place) writing plain static index.html, privacy/index.html, assets/style.css, assets/site.js, robots.txt, sitemap.xml, .nojekyll: 160 KB in total, no third-party requests, system fonts, light and dark, the event-type colours from the app, scroll reveal only with JS and not under reduced motion. Sections per section 5.2 (hero with APK button and \"Preview · Android only\" badge, 3 steps, 12 features checked against PHASE4.md 7.2 and the app, a screenshot strip of 8 placeholders, plain privacy, FAQ, professors with a mailto, footer \"Not affiliated with Microsoft\"). Nothing from Phase 6 appears. Open items for the human: (1) site.json contact_email is a placeholder (CONTACT_EMAIL_TO_BE_CONFIRMED): an address published on a public site is the human's call;","why":"","tags":["security","ai","push","app"],"imp":false},{"id":"P5-D-9","phase":"5","src":"log","title":"the Teams tab and a five-tab bar (human request, 2026-10-27)","date":"","by":"the human (\"add a 5th icon ","text":".. Teams first, History second, the
