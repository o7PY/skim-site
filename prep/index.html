<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Interview Prep</title>
<meta name="description" content="A private study guide for the Skim project.">
<link rel="icon" href="../assets/favicon.svg">
<style>@font-face{font-family:Outfit;src:url(../assets/fonts/outfit-latin.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Work Sans";src:url(../assets/fonts/work-sans-latin.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#070d14;--bg2:#0c1622;--panel:#101e2d;--panel2:#152638;--line:#22384e;--ink:#e8f1f8;--mut:#8fa6ba;--acc:#2dd4bf;--acc2:#fbbf24;--pink:#f472b6;--blue:#60a5fa;--vio:#a78bfa;--red:#fb7185;--grn:#4ade80;
--head:Outfit,system-ui,sans-serif;--body:"Work Sans",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:root[data-theme=light]{--bg:#f3f7fa;--bg2:#e9f0f5;--panel:#fff;--panel2:#eef4f8;--line:#cddae5;--ink:#0d2030;--mut:#51687b;--acc:#0f766e;--acc2:#b45309;--pink:#be185d;--blue:#1d4ed8;--vio:#6d28d9;--red:#be123c;--grn:#15803d}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 500px at 85% -10%,rgba(45,212,191,.10),transparent),radial-gradient(700px 500px at -5% 40%,rgba(167,139,250,.08),transparent);z-index:-1}
h1,h2,h3,h4{font-family:var(--head);line-height:1.15;letter-spacing:-.015em;margin:0 0 .5em}
h1{font-size:clamp(34px,6vw,64px)}h2{font-size:clamp(26px,3.6vw,38px)}h3{font-size:20px}
a{color:var(--acc)}button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:.88em}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--acc2);color:#000;padding:8px;z-index:99}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1320px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 20px}
.brand{font:700 20px var(--head);display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:12px;height:12px;border-radius:4px;background:var(--acc);box-shadow:0 0 14px var(--acc)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:10px;color:var(--mut);white-space:nowrap;font-weight:500}
nav.tabs button:hover{color:var(--ink);background:var(--panel)}
nav.tabs button[aria-selected=true]{color:var(--bg);background:var(--acc)}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;color:var(--mut)}
.ibtn:hover{color:var(--ink);border-color:var(--acc)}
main{max-width:1320px;margin:auto;padding:28px 20px 80px}
section.view{display:none;animation:rise .35s ease both}section.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.lead{color:var(--mut);max-width:70ch;font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--mut);margin:2px}
button.chip:hover,button.chip.on{border-color:var(--acc);color:var(--ink)}button.chip.on{background:color-mix(in srgb,var(--acc) 22%,var(--panel2))}
.tag{font:600 11px var(--mono);padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],input[type=text],input[type=number],input[type=datetime-local],input[type=time],textarea,select{background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;width:100%}
textarea{min-height:90px;font-family:var(--mono);font-size:14px}
label{font-size:13px;color:var(--mut);display:block;margin:8px 0 3px}
.btn{background:var(--acc);color:#04201c;border:0;border-radius:10px;padding:9px 16px;font-weight:600}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.btn:hover{filter:brightness(1.1)}
/* hero */
.hero{padding:30px 0 10px}.hero h1 span{color:var(--acc)}
.stat{padding:16px}.stat b{display:block;font:700 34px var(--head);color:var(--acc)}.stat span{color:var(--mut);font-size:14px}
.how{counter-reset:s}.how li{list-style:none;position:relative;padding:12px 14px 12px 52px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:8px 0}
.how li:before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:10px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#04201c;font:700 14px var(--head)}
.tl{position:relative;border-left:2px solid var(--line);margin-left:10px;padding-left:22px}
.tl .it{position:relative;margin-bottom:18px}.tl .it:before{content:"";position:absolute;left:-30px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--bg)}
/* map */
.maplayout{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}
@media(max-width:1020px){.maplayout{grid-template-columns:1fr}}
.svgwrap{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
svg.map{display:block;width:100%;height:auto}
.node rect{fill:var(--panel);stroke:var(--line);stroke-width:1.5;transition:all .25s}
.node text{fill:var(--ink);font:600 14.5px var(--head);pointer-events:none}.node .ic{font-size:20px}
.node{cursor:pointer;transition:opacity .25s}.node:hover rect,.node:focus rect{stroke:var(--acc);stroke-width:2.5}
.node.sel rect{stroke:var(--acc2);stroke-width:3;fill:var(--panel2)}
.node.lit rect{stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 10px var(--acc))}
.node.dim,.edge.dim{opacity:.3}
.edge path{fill:none;stroke-width:2;transition:all .25s}.edge text{font:12px var(--body);fill:var(--mut)}
.edge.lit path{stroke-width:3.4;filter:drop-shadow(0 0 5px currentColor)}
.edge.hid{display:none}
.zone{fill:none;stroke:var(--line);stroke-dasharray:5 6;opacity:.7}.zlabel{font:600 12px var(--head);fill:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.pkt{fill:var(--acc2);filter:drop-shadow(0 0 6px var(--acc2))}
.legend{display:flex;flex-wrap:wrap;gap:4px;padding:10px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.panel{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.panel h3{display:flex;gap:8px;align-items:center}.panel h4{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);margin:16px 0 4px}
.panel ul{margin:4px 0;padding-left:18px}.panel li{margin:4px 0}
.scen{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin:12px 0}
.scen button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.scen button:hover,.scen button.on{border-color:var(--acc2)}.scen button.on{background:var(--panel2)}.scen small{display:block;color:var(--mut)}
.stepbox{border:1px solid var(--acc2);border-radius:14px;padding:12px 14px;background:var(--panel);margin:10px 0}
.stepbox p{margin:6px 0 10px;min-height:3.4em}
.prog{height:5px;background:var(--line);border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc2);transition:width .3s}
/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.m{font:700 11px var(--mono);padding:2px 7px;border-radius:5px}.m.GET{background:#0f3a2a;color:#4ade80}.m.POST{background:#3a2e0f;color:#fbbf24}.m.PATCH{background:#2a1f45;color:#c4b5fd}.m.PUT{background:#1c2f4d;color:#93c5fd}.m.DELETE{background:#451a24;color:#fda4af}
.tbls{display:grid;grid-template-columns:260px 1fr;gap:14px}@media(max-width:860px){.tbls{grid-template-columns:1fr}}
.tlist{max-height:70vh;overflow:auto;display:flex;flex-direction:column;gap:3px}
.tlist button{background:none;border:1px solid transparent;border-radius:8px;text-align:left;padding:6px 10px;font-family:var(--mono);font-size:13px;color:var(--mut)}
.tlist button:hover{background:var(--panel)}.tlist button.on{border-color:var(--acc);color:var(--ink);background:var(--panel)}
.pk{color:var(--acc2)}.fk{color:var(--blue)}
.jobs li{list-style:none;display:flex;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:var(--panel);transition:all .25s}
.jobs li.run{border-color:var(--acc);background:var(--panel2);transform:translateX(6px)}.jobs li b{font-family:var(--mono);color:var(--acc);min-width:190px}
/* playgrounds */
.pg .out{background:var(--bg2);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;word-break:break-word;min-height:42px}
.pad{position:relative;height:260px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;touch-action:none;overflow:hidden;user-select:none}
.pad .c{position:absolute;width:90px;height:120px;border-radius:12px;background:var(--panel2);border:2px solid var(--acc);left:calc(50% - 45px);top:70px;display:grid;place-items:center;font-size:12px;color:var(--mut)}
.pad .zl{position:absolute;top:0;bottom:0;width:35%;background:rgba(244,114,182,.07)}
.pad .zr{right:0;background:rgba(74,222,128,.07)}.pad .zu{left:0;right:0;width:auto;height:25%;top:0;background:rgba(251,191,36,.08)}
/* tour */
.tour{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}@media(max-width:760px){.tour{grid-template-columns:1fr}}
.phone{border:6px solid #1c2c3c;border-radius:34px;overflow:hidden;background:#000;max-width:290px;margin:auto;box-shadow:0 20px 50px rgba(0,0,0,.45)}.phone img{display:block;width:100%;height:auto}
/* decisions & study */
.dec{padding:12px 14px}.dec h4{margin:0 0 4px;font-size:16px;font-family:var(--body);font-weight:600}.dec .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.dec p{margin:6px 0;color:var(--mut);font-size:14.5px}.dec .why{border-left:3px solid var(--acc);padding-left:10px;color:var(--ink)}
.star{background:none;border:0;font-size:18px;color:var(--mut)}.star.on{color:var(--acc2)}
.fc{perspective:1000px;max-width:760px;margin:16px auto}
.fc .face{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;min-height:240px}
.fc .q{font:600 22px var(--head)}.fc .a{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:none}.fc.show .a{display:block;animation:rise .3s both}
.boxes{display:flex;gap:6px}.boxes span{flex:1;text-align:center;padding:6px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--mut)}
details.qa{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}details.qa summary{cursor:pointer;font-weight:600}
.story h3{margin-bottom:6px}.story dl{margin:8px 0;display:grid;grid-template-columns:90px 1fr;gap:6px 12px}.story dt{color:var(--acc);font:600 12px var(--head);text-transform:uppercase;letter-spacing:.08em;padding-top:3px}.story dd{margin:0}
/* search overlay */
#sov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;padding:10vh 16px}#sov.on{display:block}
#sov .box{max-width:680px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
#sres{max-height:55vh;overflow:auto;margin-top:8px}#sres button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px}#sres button:hover,#sres button.sel{background:var(--panel2)}
#sres small{color:var(--mut)}.kb{font:600 11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--mut)}
.small{font-size:14px;color:var(--mut)}.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

<script>window.DATA={"pitch":"Skim is a Microsoft Teams bot plus an Android app. A professor adds the bot to a course team once; it silently records posts and files. An AI reads them, finds dates and changes, and the app turns that into a swipe deck of cards with colour-coded events, reminders that move when a date moves, push alerts, and an \"ask the course\" chat that answers only from the course's own messages with sources shown. The professor does nothing, and sees nothing about students.","numbers":[["34","database tables, all with row level security"],["24","student API routes"],["1,089","backend tests (with a real Postgres)"],["483","app tests"],["277","decisions logged with reasons"],["54","labelled messages in the AI eval"],["0","invented times in the eval (the target)"],["15 min","heartbeat: Teams post to card to push"],["768","embedding dimensions (pgvector)"],["99-100","website Lighthouse scores"],["~200 KB","website weight on a phone"],["120","words max in a chat answer"]],"flow":["<b>A professor posts<\/b> in a standard channel of the course team. The Skim bot, added once, receives it.","<b>Raw first:<\/b> the backend stores the untouched activity in Postgres before parsing anything.","<b>Every 15 minutes<\/b> Cloud Scheduler runs the job chain: Graph sync, then AI (redact, classify, extract; code computes dates), then cards.","<b>The student app<\/b> signs in with Google, swaps it for a Supabase token, and calls the API; the backend verifies the token.","<b>Cards, reminders, alerts:<\/b> the deck, reminders computed from the event's current date, pushes through Expo and FCM.","<b>Ask the course:<\/b> retrieval over the student's courses, redaction, a model, and a post-check that only allows cited facts."],"timeline":[{"phase":"1","date":"2026-10-21","title":"Capture","body":"The bot records every channel message, edit, delete, reaction and file change, raw-first. Pairing codes. RLS later. Single-tenant, RSC.","outcome":"Foundation: Python 3.12, aiohttp, Postgres, Cloud Run."},{"phase":"2","date":"2026-10-25","title":"Files and history","body":"Graph delta sync of the Files tab, message backfill, enrich and refill, attachment linking, the job runner with leases, and the 15-minute heartbeat.","outcome":"Standard channels only; private/shared never read."},{"phase":"3","date":"2026-10-26","title":"AI understanding","body":"Redact, classify, extract; dates in code; events and change history; documents; embeddings. Providers with fallback.","outcome":"Real-model eval: category 0.94, F1 0.96, type 0.97, date/time 1.00, links 1.00; zero invented times."},{"phase":"4","date":"2026-10-27","title":"The student app","body":"Google sign-in, join by code, swipe deck, card detail and actions, reminders, push, offline, History/Starred/Important/Settings. 13 commits, 10 tables, A1-A16 acceptance passed.","outcome":"971 backend tests with Postgres; 378 app tests; 5 security reviews."},{"phase":"5","date":"2026-10-27","title":"Release, polish, website","body":"Logo and brand assets, theme module with light and dark, animations and haptics, designed states, accessibility, expo-updates, production build, a Teams tab, a reminders list with switches, new-post alerts, refresh on open, the website.","outcome":"Lighthouse 99-100; OTA updates working on the production channel."},{"phase":"6A","date":"2026-10-27","title":"Ask the course","body":"A minimal chat: scoped retrieval, redaction, citations, a rate limit, swipe-up to ask. Shipped as an over-the-air update after a native-fingerprint check.","outcome":"Chat eval 16/17 first run; a real-data bug (no date in the prompt) found by a diagnostic and fixed."}],"groups":{"ingest":"Capture and sync","ai":"AI","api":"Student API","push":"Push","auth":"Sign-in","deploy":"Build and deploy","data":"Data","web":"Website"},"nodes":[{"id":"prof","label":"Professor","icon":"🎓","x":110,"y":70,"kind":"actor","zone":"Microsoft","what":"The person who posts in the course team. They never open Skim: the professor does nothing, ever, after adding the bot once.","why":"A core product rule: adoption must cost the professor nothing. Everything is derived from what they already post in Teams.","links":"Posts in a standard channel of the course team; adds the Skim bot to the team once (it posts a pairing code).","gotchas":["Professors see nothing about students: there is no professor view of reads, stars or questions.","Staff vs student matters: only staff-authored posts can change an event."],"talk":["\"Zero-effort for the professor\" is the adoption story.","The privacy promise (no professor view) is a design constraint, not an afterthought."],"dec":["D-008","P4-D-108"]},{"id":"teams","label":"Microsoft Teams","icon":"💬","x":110,"y":190,"kind":"service","zone":"Microsoft","what":"The course team and its standard channels: messages, replies, edits, deletes, reactions and the Files tab.","why":"It is where the content already lives. Skim reads it instead of asking anyone to move or re-enter anything.","links":"Sends channel activity to the bot; Microsoft Graph reads files and message history from it.","gotchas":["Only STANDARD channels are ever read; private and shared channels are dropped before anything is stored.","Deep links to a message needed a spike (the new Teams host and the raw channel id form)."],"talk":["Privacy by scope: private channels are never read.","Reading channel messages without admin consent is what Resource-Specific Consent (RSC) is for."],"dec":["D-003","D-007","P2-D-116"]},{"id":"botsvc","label":"Teams bot registration","icon":"🤖","x":110,"y":310,"kind":"service","zone":"Microsoft","what":"The bot as registered in the Teams Developer Portal: a single-tenant app in the human's own Microsoft 365 tenant, with an endpoint pointing at the backend.","why":"Single-tenant keeps it inside one organisation (no public marketplace review) and was the simplest route to a working bot. It is also why the app cannot be used by anyone else yet.","links":"Receives activities from Teams and forwards them to the backend webhook as signed HTTPS requests.","gotchas":["This is the reason there is no public download: only courses in that tenant can add the bot.","The bot is almost silent: one welcome per install (with the pairing code) and a short DM acknowledgement."],"talk":["Single-tenant was a scoping decision: ship a working pilot first, multi-tenant later (needs IISc approval, Microsoft sign-in, roster check)."],"dec":["D-002","D-007","D-008"]},{"id":"graph","label":"Microsoft Graph","icon":"📎","x":110,"y":430,"kind":"service","zone":"Microsoft","what":"The Microsoft API Skim calls (app-only) to read the Files tab and old message history that the bot did not see live.","why":"The bot only sees messages from the moment it is installed. Graph fills in the Files tab (delta sync) and the history (backfill).","links":"Called by the backend jobs inside run-all; reads from Teams.","gotchas":["Phase 2 permissions are broad (Files.Read.All): a known hardening item is Sites.Selected.","Everything is incremental: folder delta cursors and resumable backfills, with a time budget per run."],"talk":["Incremental sync with cursors and a time budget keeps each run short and resumable."],"dec":["P2-D-101","P2-D-116"]},{"id":"sched","label":"Cloud Scheduler","icon":"⏱️","x":400,"y":70,"kind":"service","zone":"Google Cloud","what":"A cron job that calls the backend's run-all endpoint every 15 minutes with a bearer token.","why":"One heartbeat drives sync, AI, card building and push. Simple, cheap, and the work is incremental, so it is safe to run often.","links":"POSTs to Cloud Run.","gotchas":["This cadence is the reason a new post can take up to ~15 minutes plus processing to become a card and a push. A 5-minute cadence is only a setting.","run-all may report next=true when there is more to do; a Force run is one run."],"talk":["Latency vs cost trade-off: poll interval is the knob."],"dec":["P2-D-126"]},{"id":"build","label":"Cloud Build","icon":"🏗️","x":640,"y":70,"kind":"service","zone":"Google Cloud","what":"A trigger that builds the container and deploys a new Cloud Run revision on every push to main.","why":"Continuous deployment with no pipeline to maintain.","links":"Triggered by GitHub; creates the Cloud Run revision.","gotchas":["A push IS a deploy. So migrations must run BEFORE pushing code that needs them.","The service reports its commit; the GitHub check shows the build result."],"talk":["\"Push = deploy\" is a process rule: the human pushes, never the AI."],"dec":["D-004"]},{"id":"github","label":"GitHub","icon":"🐙","x":900,"y":70,"kind":"service","zone":"Dev","what":"A private repo holds the backend and the app; a separate public repo holds the website (served by GitHub Pages).","why":"Private for source (secrets never in git, key files ignored); public for the static site because Pages on a private repo is not free.","links":"Push to main triggers Cloud Build; the site repo is served as GitHub Pages.","gotchas":["Docs (Bookkeeping/) never go in git. Commits are code, tests, migrations, scripts and README only.","The site repo is public: anything in it is public, even if unlinked."],"talk":["Secrets hygiene: scanned the diff for secret VALUES before every push."],"dec":["D-012","P4-D-180"]},{"id":"site","label":"Website","icon":"🌐","x":1100,"y":70,"kind":"service","zone":"Web","what":"A static site (home + privacy) built by a small Python generator from a design doc, hosted on GitHub Pages.","why":"No framework, no tracker, no third-party requests: fast (Lighthouse 99-100), private, easy to reason about.","links":"Served from the public site repo by GitHub Pages.","gotchas":["No public download: the call to action is an email to collaborate (the app only works in the human's tenant).","A pinned-phone scroll story driven by IntersectionObserver; the layout was verified by measurement at several window sizes."],"talk":["A design system with contrast-checked tokens (AA), both themes, reduced-motion support."],"dec":["P5-D-14","P5-D-15","P5-D-16"]},{"id":"secrets","label":"Secret Manager","icon":"🔐","x":640,"y":190,"kind":"store","zone":"Google Cloud","what":"Holds the bot client secret, database URL, token secrets and AI keys; injected into Cloud Run as environment variables.","why":"Nothing sensitive in the image, the repo or the app. Rotation is a console action.","links":"Cloud Run reads them at start.","gotchas":["The pairing secret must not be rotated casually: reminder ids derive from it (deleted automatic reminders would come back).","Only PUBLIC values are compiled into the app (API base URL, the Supabase publishable key, the Google web client id)."],"talk":["Public vs secret config: EXPO_PUBLIC_* values are visible in the APK by design."],"dec":["P4-D-180"]},{"id":"run","label":"Cloud Run: Skim backend","icon":"⚙️","x":400,"y":310,"kind":"service","zone":"Google Cloud","big":true,"what":"One Python 3.12 aiohttp service: the bot webhook, the student API under /api/v1, token-guarded job endpoints, and the chat. Region: Mumbai.","why":"Serverless containers scale to zero and cost almost nothing at pilot scale; one service keeps deploys and logs simple.","links":"Talks to Postgres, the AI providers, Graph, Expo Push and Supabase Auth (JWKS); called by Teams, Scheduler and the app.","gotchas":["The Postgres pool goes through the transaction pooler: prepared-statement caching must be off.","Feature flags: API_ENABLED, PUSH_ENABLED, AI_ENABLED, CHAT_ENABLED (each off = a plain 404/503, the app hides the feature)."],"talk":["Stateless service; all state in Postgres; jobs are idempotent and lease-locked.","Memory and Postgres storage twins: every contract test runs on both."],"dec":["D-001","D-004","P2-D-126","P4-D-104"]},{"id":"pg","label":"Supabase Postgres","icon":"🗄️","x":400,"y":520,"kind":"store","zone":"Supabase","what":"The database: 34 tables across 10 migrations, plus pgvector for embeddings. Row level security is on for every public table with NO policies, and the Supabase Data API is off.","why":"Postgres gives transactions, JSONB and vector search in one place. Locking it down means the publishable key in the app can read nothing: everything goes through the API.","links":"Used by the backend through asyncpg; shares a project with Supabase Auth.","gotchas":["Session pooler (5432) for migrations; transaction pooler (6543) for Cloud Run.","A test and scripts/check_rls.py fail if any table lacks RLS.","Never create a table without enabling row level security."],"talk":["Defence in depth: the API verifies the user AND the database refuses direct access.","Raw-first storage: raw activities are kept before any parsing."],"dec":["D-005","D-006","P4-D-136"]},{"id":"sauth","label":"Supabase Auth","icon":"🔑","x":690,"y":520,"kind":"service","zone":"Supabase","what":"Issues the user session after Google sign-in: a short-lived JWT access token (and a refresh token).","why":"Did not want to build auth. The backend only has to verify a standard token.","links":"The app signs in with Google, hands the ID token to Supabase, and gets a JWT; the backend verifies that JWT against Supabase's public keys (JWKS).","gotchas":["Account deletion also deletes the auth user (by SQL), so \"delete my account\" really removes the sign-in.","The legacy HS256 secret is only a fallback for tokens that say HS256."],"talk":["Asymmetric verification (JWKS) means the backend never holds a signing secret."],"dec":["P4-D-102","P4-D-134"]},{"id":"gsign","label":"Google Sign-In","icon":"🅖","x":400,"y":690,"kind":"service","zone":"Google","what":"Native Android sign-in (no browser redirect). The app gets a Google ID token.","why":"One tap for students; no passwords to store. The ID token is exchanged with Supabase (signInWithIdToken).","links":"Used by the app; configured by an OAuth client that includes the app's signing certificate fingerprint (SHA-1).","gotchas":["The release keystore's SHA-1 must be on the Android OAuth client, or sign-in fails in that build.","The consent screen is in Testing: only listed test users can sign in until it goes to production."],"talk":["Why native sign-in: better UX and no redirect-URI fragility."],"dec":["P4-D-102"]},{"id":"app","label":"Android app","icon":"📱","x":640,"y":690,"kind":"device","zone":"Device","big":true,"what":"An Expo (React Native, TypeScript) app: a swipe deck of cards, history, starred and reminders, a Teams tab, the Important checklist, settings and the chat sheet.","why":"Expo gives fast iteration, EAS builds and over-the-air JS updates. Android only for the pilot.","links":"Calls the backend API, signs in via Google and Supabase, receives pushes via FCM, and gets OTA updates from EAS.","gotchas":["Offline-first: an outbox queues changes; the last 50 cards are kept in full.","Only JS can ship over the air; anything native needs a new build."],"talk":["Optimistic UI + outbox + idempotent server endpoints = works offline and syncs later."],"dec":["P4-D-101","P4-D-111","P5-D-106"]},{"id":"gemini","label":"Gemini API","icon":"✨","x":900,"y":250,"kind":"service","zone":"Google","what":"The primary language model (a flash-lite model) for classifying posts and answering questions, plus the embedding model (768 dimensions).","why":"Cheap, fast and good enough; the free tier fits a pilot. Embeddings and the LLM come from one provider.","links":"Called by the backend with REDACTED text only.","gotchas":["Dates are never computed by the model: code does it, in IST.","The model does not know what day it is unless you tell it (a real bug we hit)."],"talk":["LLM as a parser, not an oracle: structured JSON, validated, with code owning dates and rules."],"dec":["P3-D-002","P3-D-003","P3-D-004"]},{"id":"groq","label":"Groq (fallback)","icon":"⚡","x":900,"y":350,"kind":"service","zone":"AI","what":"The secondary model provider, used when the primary fails or is rate limited.","why":"Resilience on free tiers: a router tries the primary, then the fallback, with Retry-After respected and one repair retry on invalid JSON.","links":"Same prompts and schema as the primary, called through a router.","gotchas":["Provider failures never break the earlier steps of a run: an AI failure is isolated."],"talk":["Provider-agnostic router with a shared schema made fallback cheap to add."],"dec":["P3-D-002","P3-D-005"]},{"id":"expopush","label":"Expo Push Service","icon":"📨","x":900,"y":470,"kind":"service","zone":"Expo","what":"Takes batches of up to 100 messages from the backend and forwards them to Google's FCM; later returns receipts.","why":"One simple API for push instead of handling FCM tokens and credentials ourselves.","links":"Called by the backend; delivers to FCM.","gotchas":["Tickets then receipts: the push-receipts job asks Expo what happened and disables tokens that came back DeviceNotRegistered.","Notification text carries course and event info only, never names or message text."],"talk":["Outbox pattern: alerts are rows first, then sent in batches, with a receipts follow-up."],"dec":["P4-D-121","P4-D-137"]},{"id":"fcm","label":"Firebase Cloud Messaging","icon":"🔥","x":900,"y":580,"kind":"service","zone":"Google","what":"Google's push transport to Android. Firebase here is used only for FCM (V1) and the app's Google configuration file.","why":"Required for push on Android; wakes the device even when the app is closed.","links":"Expo uploads/uses an FCM service-account key; FCM delivers to the phone.","gotchas":["The key files are git-ignored and given to EAS as secrets/file variables.","Android force-stop or aggressive battery savers can still hold pushes back."],"talk":["Firebase is a delivery pipe here, not the database or auth."],"dec":["P4-D-121"]},{"id":"eas","label":"EAS Build + Update","icon":"🚀","x":900,"y":690,"kind":"service","zone":"Expo","what":"Builds the APK in the cloud and publishes over-the-air JS updates to channels (preview, production).","why":"No local Android toolchain, and fixes can ship without reinstalling.","links":"Builds produce the installed app; an installed app only receives updates from ITS channel and a matching runtime version.","gotchas":["A preview APK cannot be installed over a production one with a higher version code; updates go to the channel the app was built for.","eas update exports web by default: pass --platform android (the app is Android only)."],"talk":["Native fingerprint compare proves an OTA update is safe: same hash = no native change."],"dec":["P5-D-7","P5-D-110","P5-D-111","P6A-D-001"]}],"edges":[{"id":"e_post","a":"prof","b":"teams","g":"ingest","label":"posts in a channel"},{"id":"e_act","a":"teams","b":"botsvc","g":"ingest","label":"activity (message, edit, delete, file)"},{"id":"e_hook","a":"botsvc","b":"run","g":"ingest","label":"signed HTTPS webhook"},{"id":"e_graph","a":"run","b":"graph","g":"ingest","label":"app-only Graph calls"},{"id":"e_graphteams","a":"graph","b":"teams","g":"ingest","label":"reads files + history","dash":true},{"id":"e_sched","a":"sched","b":"run","g":"ingest","label":"run-all every 15 min"},{"id":"e_db","a":"run","b":"pg","g":"data","label":"asyncpg (transaction pooler)","both":true},{"id":"e_secret","a":"secrets","b":"run","g":"deploy","label":"env at start"},{"id":"e_gh","a":"github","b":"build","g":"deploy","label":"push to main"},{"id":"e_build","a":"build","b":"run","g":"deploy","label":"new revision"},{"id":"e_pages","a":"github","b":"site","g":"web","label":"GitHub Pages"},{"id":"e_llm","a":"run","b":"gemini","g":"ai","label":"redacted text, embeddings"},{"id":"e_llm2","a":"run","b":"groq","g":"ai","label":"fallback LLM"},{"id":"e_push","a":"run","b":"expopush","g":"push","label":"batches of 100"},{"id":"e_fcm","a":"expopush","b":"fcm","g":"push","label":"FCM v1"},{"id":"e_fcmapp","a":"fcm","b":"app","g":"push","label":"notification"},{"id":"e_api","a":"app","b":"run","g":"api","label":"HTTPS /api/v1 + Bearer","both":true},{"id":"e_gsign","a":"app","b":"gsign","g":"auth","label":"native sign-in, ID token"},{"id":"e_sauth","a":"app","b":"sauth","g":"auth","label":"signInWithIdToken, JWT"},{"id":"e_jwks","a":"run","b":"sauth","g":"auth","label":"verify JWT via JWKS"},{"id":"e_sauthpg","a":"sauth","b":"pg","g":"auth","label":"same project","dash":true},{"id":"e_eas","a":"eas","b":"app","g":"deploy","label":"OTA updates (JS only)"},{"id":"e_easfcm","a":"eas","b":"fcm","g":"deploy","label":"FCM credentials","dash":true}],"scenarios":[{"id":"post","title":"A professor posts a quiz","icon":"📝","blurb":"From a Teams message to a phone notification.","steps":[{"t":"The professor posts in a STANDARD channel of the course team.","nodes":["prof","teams"],"edges":["e_post"]},{"t":"Teams sends the activity to the bot. With Resource-Specific Consent the bot sees every channel message, not only @mentions.","nodes":["teams","botsvc"],"edges":["e_act"]},{"t":"The webhook reaches the backend. It stores the RAW activity first, in the HTTP handler before the SDK touches it (raw-first), with an idempotency key. Private and shared channels are dropped before anything is stored.","nodes":["botsvc","run","pg"],"edges":["e_hook","e_db"]},{"t":"Within 15 minutes Cloud Scheduler fires run-all: discover, sync files, backfill, enrich, link attachments, then the AI steps.","nodes":["sched","run"],"edges":["e_sched"]},{"t":"AI step: redact names, emails and phones, classify and extract with the LLM (Gemini, Groq as fallback). Code, not the model, computes the dates in IST. Events and a change history are written in one transaction.","nodes":["run","gemini","groq","pg"],"edges":["e_llm","e_llm2","e_db"]},{"t":"feed-build turns the message into a card (idempotent). push-alerts decides who gets an alert: not muted, wants new-post alerts, quiet hours deferred, never twice.","nodes":["run","pg"],"edges":["e_db"]},{"t":"The alert is sent in a batch to Expo Push, which forwards to Firebase Cloud Messaging.","nodes":["run","expopush","fcm"],"edges":["e_push","e_fcm"]},{"t":"The phone shows the notification even if the app is closed. Tapping it opens that card and refreshes the deck.","nodes":["fcm","app"],"edges":["e_fcmapp"]}]},{"id":"signin","title":"A student signs in and joins a course","icon":"🔑","blurb":"Google, Supabase, a JWT, and a pairing code.","steps":[{"t":"The app starts the native Google sign-in and receives a Google ID token.","nodes":["app","gsign"],"edges":["e_gsign"]},{"t":"The app hands that token to Supabase Auth (signInWithIdToken). Supabase returns a session with a short-lived JWT access token.","nodes":["app","sauth"],"edges":["e_sauth"]},{"t":"Every API call carries the JWT as a Bearer token.","nodes":["app","run"],"edges":["e_api"]},{"t":"The backend verifies the signature against Supabase's public keys (JWKS): strict issuer, audience, expiry and subject. It never holds a signing secret for modern tokens.","nodes":["run","sauth"],"edges":["e_jwks"]},{"t":"The first call creates the app user row. Then the student types the pairing code the bot posted in the team.","nodes":["app","run","pg"],"edges":["e_api","e_db"]},{"t":"The join is rate limited (10 tries an hour), then the deck loads: the last 7 days plus anything linked to an upcoming event.","nodes":["run","app"],"edges":["e_api"]}]},{"id":"ask","title":"Ask the course","icon":"🧠","blurb":"Retrieval, redaction, a model, and a post-check.","steps":[{"t":"The student swipes up on a card (or taps the header icon). The app sends the question, the card id and up to 6 earlier turns.","nodes":["app","run"],"edges":["e_api"]},{"t":"Scope and limits: only the student's active teams; a card from another team is a 404; 20 questions an hour and 60 a day (a table that stores only the time).","nodes":["run","pg"],"edges":["e_db"]},{"t":"Retrieval: embed the REDACTED question, pgvector top-8 over messages and file passages of those teams, plus events as structured facts, plus the anchored card.","nodes":["run","gemini","pg"],"edges":["e_llm","e_db"]},{"t":"Everything is redacted with one redactor per request. The prompt starts with today's date, and every event line says ALREADY PASSED or \"in N days\".","nodes":["run"],"edges":[]},{"t":"The model returns JSON: answer, cited numbers, refused. Gemini first, Groq if needed.","nodes":["run","gemini","groq"],"edges":["e_llm","e_llm2"]},{"t":"Post-check: unknown citation numbers are dropped, the answer is trimmed to 120 words, and every cited course is named. Nothing is stored; logs hold counts only.","nodes":["run"],"edges":[]},{"t":"The app shows the answer with source chips; tapping one opens the card or the original Teams message.","nodes":["run","app"],"edges":["e_api"]}]},{"id":"move","title":"A date moves: reminders and alerts follow","icon":"📅","blurb":"Why reminders are stored as intent, not times.","steps":[{"t":"The professor posts \"Correction: Quiz 1 is moved to Saturday, same time and place\". It is captured and processed like any post.","nodes":["prof","teams","botsvc","run"],"edges":["e_post","e_act","e_hook"]},{"t":"Only explicit change language moves an event (\"moved\", \"postponed\", \"correction\"). The old and new values go into event_changes; \"same time and place\" is copied from the matched event.","nodes":["run","gemini","pg"],"edges":["e_llm","e_db"]},{"t":"Reminders are stored as INTENT (event + kind, or an offset). Fire times are computed at read time from the event's CURRENT start, so they move by themselves; a cancelled event silences them.","nodes":["run","pg"],"edges":["e_db"]},{"t":"push-alerts picks the audience: starred, reminded or an important kind; not muted; not unconfirmed; coalesced; quiet hours respected.","nodes":["run","pg"],"edges":["e_db"]},{"t":"Expo and FCM deliver the alert. The app refreshes and re-schedules its local notifications from the server's new times.","nodes":["run","expopush","fcm","app"],"edges":["e_push","e_fcm","e_fcmapp"]}]},{"id":"offline","title":"Swipe offline, sync later","icon":"✈️","blurb":"Optimistic UI, an outbox, idempotent endpoints.","steps":[{"t":"Airplane mode. The student swipes a card away: the screen changes at once and History shows it (optimistic update).","nodes":["app"],"edges":[]},{"t":"The change is written to a persisted OUTBOX (a queue in local storage) with a key, so a later change to the same thing replaces the earlier one.","nodes":["app"],"edges":[]},{"t":"The connection returns (a network listener) or the app is opened: the outbox flushes IN ORDER.","nodes":["app","run"],"edges":["e_api"]},{"t":"The server endpoints are idempotent, so a retry cannot double-apply. After delivery the app refetches and the screen settles on the server's truth.","nodes":["run","pg","app"],"edges":["e_db","e_api"]}]},{"id":"ota","title":"Ship an over-the-air update","icon":"🚀","blurb":"JS only, and the proof that it is safe.","steps":[{"t":"A JS-only change is made. First compute the native FINGERPRINT and compare with the installed build's: same hash means no native change.","nodes":["eas"],"edges":[]},{"t":"eas update publishes to a channel (preview or production) for runtime version 1.0.0 (the app version policy).","nodes":["eas"],"edges":[]},{"t":"An installed app only accepts updates from its OWN channel and matching runtime version.","nodes":["eas","app"],"edges":["e_eas"]},{"t":"The app checks at launch, downloads in the background, and runs the new code on the NEXT launch (hence \"close and open it twice\").","nodes":["app"],"edges":[]}]},{"id":"deploy","title":"Deploy the backend","icon":"🏗️","blurb":"Push means deploy, so order matters.","steps":[{"t":"Migrations are applied FIRST (they are additive), because the next step goes live immediately.","nodes":["pg"],"edges":[]},{"t":"The human pushes to main. Claude never pushes.","nodes":["github"],"edges":[]},{"t":"The Cloud Build trigger builds the container and creates a new Cloud Run revision.","nodes":["github","build","run"],"edges":["e_gh","e_build"]},{"t":"Secrets arrive as environment variables; feature flags decide what is on.","nodes":["secrets","run"],"edges":["e_secret"]},{"t":"/health reports the database schema state; a loud error is logged if migrations are behind.","nodes":["run","pg"],"edges":["e_db"]}]},{"id":"pushpath","title":"How a push reaches a closed app","icon":"🔔","blurb":"Token, outbox, Expo, FCM, receipts.","steps":[{"t":"After the first join the app asks for notification permission, gets an Expo push token and registers it with the backend (a guard prevents a re-registration loop).","nodes":["app","run"],"edges":["e_api"]},{"t":"An alert is first a ROW in push_outbox (one per user and thing, with a not-before time for quiet hours).","nodes":["run","pg"],"edges":["e_db"]},{"t":"A job sends due rows in batches of 100 to Expo, which hands them to FCM using the Firebase service account.","nodes":["run","expopush","fcm"],"edges":["e_push","e_fcm"]},{"t":"FCM wakes Android's notification service; the app does not need to be running. The channel is high importance so the banner shows.","nodes":["fcm","app"],"edges":["e_fcmapp"]},{"t":"15 minutes later the receipts job asks Expo what happened and disables tokens that came back DeviceNotRegistered.","nodes":["run","expopush","pg"],"edges":["e_push","e_db"]}]}],"jobs":[["discover","Find the team's channels. Keep only standard channels; count and skip the rest."],["sync-files","Files tab via Graph folder delta. Soft deletes, renames, moves."],["backfill","Message history, newest first, resumable cursor, a cut-off and a cap per channel."],["fix-text / enrich / refill","Repair and fill messages that arrived empty or without subject, html or file references."],["link-attachments","Match a message's file chip to its Files-tab document (url, history, name path, item id)."],["ai-process","Redact, classify and extract, compute dates in code, write events and changes."],["ai-documents","Download pdf/docx/pptx, extract text, chunk, extract events (capped at medium confidence)."],["ai-embed","Embed messages and file chunks (768-d) into pgve :"devices","mig":"008_student_app.sql","cols":[{"n":"id","type":"bigserial","pk":true,"nn":false,"fk":""},{"n":"user_id","type":"uuid","pk":false,"nn":true,"fk":"app_users"},{"n":"expo_push_token","type":"text","pk":false,"nn":true,"fk":""},{"n":"platform","type":"text","pk":false,"nn":true,"fk":""},{"n":"created_at","type":"timestamptz","pk":false,"nn":true,"fk":""},{"n":"last_seen_at","type":"timestamptz","pk":false,"nn":true,"fk":""},{"n":"disabled_at","type":"timestamptz","pk":false,"nn":false,"fk":""}],"fks":[{"col":"user_id","to":"app_users"}]},{"name":"push_outbox","mig":"008_student_app.sql","cols":[{"n":"id","type":"bigserial","pk":true,"nn":false,"fk":""},{"n":"user_id","type":"uuid","pk":false,"nn":true,"fk":"app_users"},{"n":"event_change_id","type":"bigint","pk":false,"nn":true,"fk":"event_changes"},{"n":"title","type":"text","pk":false,"nn":true,"fk":""},{"n":"body","type":"text","pk":false,"nn":true,"fk":""},{"n":"data","type":"jsonb","pk":false,"nn":true,"fk":""},{"n":"not_before","type":"timestamptz","pk":false,"nn":true,"fk":""},{"n":"status","type":"text","pk":false,"nn":true,"fk":""},{"n":"ticket_id","type":"text","pk":false,"nn":false,"fk":""},{"n":"receipt_status","type":"text","pk":false,"nn":false,"fk":""},{"n":"error","type":"text","pk":false,"nn":false,"fk":""},{"n":"created_at","type":"timestamptz","pk":false,"nn":true,"fk":""},{"n":"sent_at","type":"timestamptz","pk":false,"nn":false,"fk":""}],"fks":[{"col":"user_id","to":"app_users"},{"col":"event_change_id","to":"event_changes"}]},{"name":"chat_usage","mig":"009_chat_usage.sql","cols":[{"n":"id","type":"bigserial","pk":true,"nn":false,"fk":""},{"n":"user_id","type":"uuid","pk":false,"nn":true,"fk":"app_users"},{"n":"at","type":"timestamptz","pk":false,"nn":true,"fk":""}],"fks":[{"col":"user_id","to":"app_users"}]}],"tablenotes":{"raw_activities":"Every Teams activity stored untouched before any parsing (raw-first), with a dedupe key.","teams":"A course team the bot was added to, with its pairing code.","messages":"Normalised channel messages (current version, soft delete).","message_versions":"One row per edit, so history is never overwritten.","events":"Quizzes, exams, deadlines etc. found by the AI, with status, venue and confidence.","event_changes":"Old and new values whenever an event moves, is cancelled or changes venue.","feed_items":"The cards. One per message, file event or event change. Idempotent.","user_item_state":"Per student: dismissed, opened, snoozed, put back.","reminders":"Stored as intent (event + kind, or offset); fire times are computed.","push_outbox":"Alerts as rows first, sent later; one per user and thing (unique key).","chat_usage":"Only user id and a timestamp per accepted question, for the rate limit. No text.","embeddings":"vector(768) per message version or file chunk (pgvector).","job_locks":"The lease row that stops two run-all calls overlapping.","join_attempts":"Rate limiting for pairing-code guesses.","devices":"Expo push tokens per user.","app_users":"The student account row; every per-user table cascades from it."},"routes":[{"m":"GET","p":"/api/v1/me","file":"routes.py","d":"Who am I: profile, settings, created on first call."},{"m":"PATCH","p":"/api/v1/me/settings","file":"routes.py","d":"Change alert settings (new-post alerts, urgent only, quiet hours, reminder times)."},{"m":"DELETE","p":"/api/v1/me","file":"routes.py","d":"Delete the account: one delete cascades through every per-user table, then the sign-in user is removed."},{"m":"POST","p":"/api/v1/subscriptions","file":"routes_items.py","d":"Join a course with its pairing code (rate limited: 10 tries an hour; 404/409/410/429)."},{"m":"GET","p":"/api/v1/subscriptions","file":"routes_items.py","d":"My courses, with colours and mute state."},{"m":"PATCH","p":"/api/v1/subscriptions/{team_id}","file":"routes_items.py","d":"Mute or unmute a course; rename it for myself."},{"m":"DELETE","p":"/api/v1/subscriptions/{team_id}","file":"routes_items.py","d":"Leave a course (its cards stop appearing)."},{"m":"GET","p":"/api/v1/deck","file":"routes_items.py","d":"The swipe deck: dealt cards, newest first, keyset cursor."},{"m":"GET","p":"/api/v1/items/{id}","file":"routes_items.py","d":"One card in full, with its events, files and history. 404 if it is not in my courses."},{"m":"POST","p":"/api/v1/items/{id}/state","file":"routes_items.py","d":"Dismiss, open, snooze or put back. Idempotent, so the offline outbox can retry."},{"m":"PUT","p":"/api/v1/items/{id}/star","file":"routes_items.py","d":"Star a card (optionally temporary)."},{"m":"DELETE","p":"/api/v1/items/{id}/star","file":"routes_items.py","d":"Remove the star."},{"m":"GET","p":"/api/v1/teams/{team_id}/cards","file":"routes_items.py","d":"Every card of one course, paged (the Teams tab)."},{"m":"GET","p":"/api/v1/history","file":"routes_items.py","d":"Dismissed and opened cards, newest first."},{"m":"GET","p":"/api/v1/starred","file":"routes_items.py","d":"My starred cards."},{"m":"GET","p":"/api/v1/reminders","file":"routes_reminders.py","d":"Fire times for the next 30 days (max 60): the device schedules local notifications from this."},{"m":"GET","p":"/api/v1/reminders/all","file":"routes_reminders.py","d":"Every reminder with its time and on/off state, for the list in Starred."},{"m":"PUT","p":"/api/v1/reminders/{id}","file":"routes_reminders.py","d":"Create a reminder (event + kind, an offset, or an absolute time)."},{"m":"PATCH","p":"/api/v1/reminders/{id}","file":"routes_reminders.py","d":"Switch a reminder off or on (the row is kept as a tombstone)."},{"m":"DELETE","p":"/api/v1/reminders/{id}","file":"routes_reminders.py","d":"Delete a reminder; automatic ones get a tombstone so they do not return."},{"m":"POST","p":"/api/v1/devices","file":"routes_devices.py","d":"Register an Expo push token (409 if another account holds an active one)."},{"m":"DELETE","p":"/api/v1/devices/{token}","file":"routes_devices.py","d":"Unregister a push token (on sign-out)."},{"m":"GET","p":"/api/v1/sync","file":"routes_devices.py","d":"Small catch-up call: what changed since last time."},{"m":"POST","p":"/api/v1/chat","file":"routes_chat.py","d":"Ask the course: scoped retrieval, redaction, a model, a post-check. 20/hour, 60/day. No transcripts stored."}],"tour":[{"img":"teams","title":"Teams tab","text":"Every course you joined, each with its colour dot; tap one to see all of its cards, paged.","code":["app/(tabs)/teams.tsx","app/team/[id].tsx","GET /teams/{id}/cards"],"q":"Notice the colour dot per course. Which table and column does that come from? (subscriptions)"},{"img":"deck-change","title":"The deck","text":"A card with its real Teams content, an IMPORTANT tag, a colour-coded event tag and a MOVED block (old to new). Older posts fold into it.","code":["ui/deck-card.tsx","ui/swipe-deck.tsx","api/deck.py"],"q":"Find the old and new date. Why can a reminder follow it without being rewritten?"},{"img":"deck-important","title":"A new post becomes a card","text":"Author, course, tags (Important, Assignment, Unconfirmed), the due date and the attached file chip.","code":["ui/type-chip.tsx","jobs/feed_build.py","feed.py"],"q":"Which parts are real Teams text and which are AI structure? Why does that matter?"},{"img":"detail","title":"Card detail and actions","text":"Recommended reminders, Remind me, Star, Temporary star, Snooze, Ask, Add to calendar, Open in Teams.","code":["app/item/[id].tsx","lib/item-actions.ts"],"q":"Which actions need the network, and which go through the outbox?"},{"img":"reminders","title":"Reminders with switches","text":"Every reminder with its time and kind; some switched off but kept, so they can come back.","code":["ui/reminder-list.tsx","PATCH /reminders/{id}","GET /reminders/all"],"q":"Why is a switched-off reminder kept instead of deleted?"},{"img":"chat-anchored","title":"Ask the course","text":"A question about a card, answered from the course messages with a source chip that opens the card.","code":["ui/chat-sheet.tsx","api/chat.py","POST /chat"],"q":"Trace this answer: scope, retrieval, redaction, model, post-check. Which step names the course?"},{"img":"important","title":"The Important checklist","text":"Nine event kinds, each with its own colour and icon. Ticked kinds show in red and can remind or alert automatically.","code":["app/(tabs)/important.tsx","lib/settings.ts"],"q":"Why are red hues reserved for \"important\" only?"}],"mech":[{"area":"Backend","title":"Raw-first capture","body":["The HTTP handler stores the raw activity before the SDK or any parsing, with a dedupe key.","A storage error is a 500 on purpose so Teams retries.","Normalised rows (messages, versions, attachments, reactions) are derived and can be rebuilt."],"files":["bot.py","normalize.py","app.py"]},{"area":"Backend","title":"Idempotency everywhere","body":["Messages: dedupe key. Alerts: unique (user, event change) and (user, card). Cards: unique per message / document event / event change.","\"on conflict do nothing\" turns a retry into a no-op."],"files":["storage/*","migrations/"]},{"area":"Backend","title":"Job runner and leases","body":["One global lease row in the database works through the transaction pooler.","Each job has a time budget and returns ok/partial/next; every call writes a job_runs row.","A crashing AI step never makes the whole run partial."],"files":["jobs/runner.py","jobs_api.py"]},{"area":"Backend","title":"Deck dealing and folding","body":["Candidates: unswiped cards in active teams, plus put-back and snoozed-back cards.","Eligible: returned, or in the 7-day window around joining, or linked to an upcoming event.","Older cards linked to an event fold into its newest change card."],"files":["api/deck.py","routes_items.py"]},{"area":"Backend","title":"The reminder engine","body":["Pure functions: stored rows are intent; times are computed from the event's current start.","Recommended: day before at 20:00; same day 5 hours before the start but not earlier than 07:00 (dropped if it is not before the start).","Automatic reminders for ticked important types are \"virtual\" until edited or deleted (a tombstone stops them returning).","Switching one off keeps the row (a tombstone); switching on clears it."],"files":["reminders.py","routes_reminders.py"]},{"area":"Backend","title":"Push alerts","body":["Two sources: event changes and new cards, one outbox, one sender.","Rules per subscriber: mute, settings, urgent-only, quiet hours (deferred to the window's end), history and backfills are not news.","First run only records a cursor; coalesce several changes of one event; text has no names or message text.","Receipts job disables tokens that return DeviceNotRegistered."],"files":["push.py","jobs/push_alerts.py"]},{"area":"Backend","title":"Auth verification","body":["JWKS with a key cache, backoff, and a cap on stale keys.","Strict issuer, audience, expiry and subject.","The legacy HS256 secret only for HS256 tokens.","Every /api/v1 route is 401 without a valid token, including unknown paths."],"files":["api/auth.py"]},{"area":"Backend","title":"Storage twins","body":["MemoryStorage and PostgresStorage implement the same methods.","The contract tests run on both when TEST_DATABASE_URL is set.","The in-memory twin keeps the unit suite fast."],"files":["storage/*_memory.py","storage/*_postgres.py"]},{"area":"AI","title":"The extraction pipeline","body":["Per message, one transaction: redact, LLM classify and extract (JSON schema, one repair retry), compute dates in code, match against the team's open events, write events, changes and links.","Prompt version recorded (p3-v2); changing it re-processes.","Cautious by design: only explicit change language moves an event; students never change events; file events capped at medium confidence."],"files":["ai/pipeline.py","ai/timeparse.py","ai/resolver.py"]},{"area":"AI","title":"Redaction","body":["Emails, phones, roll numbers, titled names and known author names become placeholders.","One redactor per request keeps placeholders consistent across question, history and sources.","Restored in the answer; the mapping is never stored or logged."],"files":["ai/redact.py"]},{"area":"AI","title":"The chat service","body":["Scope: active teams only; item_id must be the user's (else 404).","Context: anchored card, events as facts (each timed against today), top-8 retrieved passages with posted dates.","Post-check: citations, 120 words, course names.","Rate limit table stores times only; logs hold counts and scores."],"files":["api/chat.py","api/routes_chat.py"]},{"area":"AI","title":"Evaluation","body":["54 labelled messages replayed in order through the real pipeline on an isolated store.","Targets incl. zero invented times, duplicates and student-caused events.","A chat eval at a fixed \"now\" scores refusal, fact, source and length; a diagnostic script traces a real question step by step."],"files":["ai/evaluate.py","scripts/run_eval.py","scripts/run_chat_eval.py"]},{"area":"App","title":"Auth and session","body":["Native Google sign-in, then signInWithIdToken to Supabase.","The session is stored with secure storage; the API client refreshes the token once on a 401 and signs out if it still fails."],"files":["lib/auth.tsx","lib/api.ts","lib/supabase.ts"]},{"area":"App","title":"Query cache and offline","body":["TanStack Query with a persisted per-account cache.","A size pruner keeps the single stored value under ~2 MB.","The last 50 cards are fetched in full; team lists are never persisted."],"files":["lib/query.ts","lib/offline-window.ts"]},{"area":"App","title":"The outbox","body":["Changes are optimistic and queued with a key (a later change replaces an earlier one).","Flushed in order when the app opens or the network returns; endpoints are idempotent.","Lists that depend on pending changes hold still until delivery."],"files":["lib/outbox.ts","lib/outbox-runtime.tsx"]},{"area":"App","title":"Swipe deck and gestures","body":["Shared values on the UI thread; no React state during a drag.","Dismiss/open by distance or flick; ask by 25% of height or an upward flick; axis locked after 10 px.","Reduced motion: fade instead of fly."],"files":["ui/swipe-deck.tsx","lib/swipe.ts"]},{"area":"App","title":"Push and reminders on the device","body":["Register a token after the first join, with a guard against the re-registration loop.","Reminders: ask the server for the next 30 days (max 60) and schedule local notifications; reschedule after every sync.","A tapped push opens its card; a push in the foreground refreshes everything."],"files":["lib/push-registration.ts","lib/reminder-plan.ts","lib/notifications-runtime.tsx"]},{"area":"App","title":"Theme and motion rules","body":["One theme module; tests ban colour literals and check AA contrast.","Motion: 150-300 ms, no bounce, nothing loops except skeletons; reduced motion swaps movement for fades.","Haptics: a light impact when a swipe lands, a tick on star, checkbox and toggle."],"files":["constants/theme.ts","ui/motion.tsx"]},{"area":"App","title":"The chat sheet","body":["Core Modal + Reanimated; slides in 250 ms with no bounce.","History in component state only; closing clears it.","Citation chips open the card or Teams; offline disables the input."],"files":["ui/chat-sheet.tsx","lib/chat.ts"]},{"area":"Release","title":"Builds, channels and OTA","body":["EAS profiles: development, preview (channel preview), production (APK, channel production, auto-incremented build number).","runtimeVersion policy appVersion; an app only receives updates for its own channel and runtime.","Native fingerprint compare before every OTA."],"files":["eas.json","app.config.ts"]},{"area":"Web","title":"The site generator","body":["A small Python script writes plain HTML/CSS/JS from a design document; self-hosted fonts; no third-party requests.","Themed screenshots via <picture>; a pinned phone driven by IntersectionObserver; reduced motion and narrow screens drop the pinning.","A processing script prepares the human's real screenshots (crop and repaint only)."],"files":["build.py","DESIGN_NEW.md"]},{"area":"Data","title":"Row level security","body":["Every public table has RLS enabled and no policies; the Data API is off.","Only the backend's own database role reads or writes.","A lint test and a script fail the build on a table without RLS."],"files":["migrations/007","scripts/check_rls.py"]}],"decisions":[{"id":"D-001","phase":"1","src":"log","title":"Python 3.12 + Microsoft 365 Agents SDK + aiohttp","date":"2026-10-21","by":"spec","text":"Python 3.12, M365 Agents SDK for Python (microsoft-agents-hosting-aiohttp, microsoft-agents-hosting-teams, microsoft-agents-authentication-msal, v1.x), hosted with aiohttp. Import path is microsoft_agents....","why":"Current official Microsoft SDK for Teams bots; the old Bot Framework SDK is being replaced.","tags":["security"],"imp":false},{"id":"D-002","phase":"1","src":"log","title":"Single-tenant bot via Teams Developer Portal","date":"2026-10-21","by":"spec","text":"Bot registered via the Teams Developer Portal as a single-tenant bot in the human's own M365 tenant.","why":"New multi-tenant registrations are deprecated; test tenant is ours, no IT approval needed.","tags":[],"imp":true},{"id":"D-003","phase":"1","src":"log","title":"Resource-Specific Consent (RSC)","date":"2026-10-21","by":"spec","text":"RSC permissions in the manifest: ChannelMessage.Read.Group, ChannelMessage.Send.Group, ChannelSettings.Read.Group, TeamSettings.Read.Group, TeamMember.Read.Group, ChatMessage.Read.Chat.","why":"Bot receives all channel and group-chat messages without @mention; team owner consents at install, no tenant-admin consent.","tags":["security","ai","process"],"imp":true},{"id":"D-004","phase":"1","src":"log","title":"Container listening on $PORT","date":"2026-10-21","by":"spec","text":"Runtime is a container listening on $PORT (default 8080).","why":"Free serverless container hosts that scale to zero.","tags":["infra"],"imp":false},{"id":"D-005","phase":"1","src":"log","title":"Postgres on Supabase with asyncpg","date":"2026-10-21","by":"spec","text":"Storage is Postgres on Supabase (free tier), accessed with asyncpg.","why":"SQL fits future features; table viewer gives free visibility; pgvector later.","tags":["data"],"imp":false},{"id":"D-006","phase":"1","src":"log","title":"Raw-first storage","date":"2026-10-21","by":"spec","text":"Every incoming activity is stored as unmodified JSON before any parsing; normalised tables are derived from it.","why":"Parsing bugs lose nothing; Phase 1 is about learning what Teams sends.","tags":["app","data"],"imp":true},{"id":"D-007","phase":"1","src":"log","title":"Bot is silent in channels/group chats","date":"2026-10-21","by":"spec","text":"Bot only speaks (a) once on install (welcome + pairing code) and (b) in 1:1 personal chat, replying Logged ✅ (N attachment(s)).","why":"Must never spam a class.","tags":["ai","process"],"imp":false},{"id":"D-008","phase":"1","src":"log","title":"Pairing code","date":"2026-10-21","by":"spec","text":"First 6 chars of base32(HMAC-SHA256(PAIRING_SECRET, team_id)), uppercase, stored on teams row.","why":"Deterministic, no extra state, not guessable without secret.","tags":["security"],"imp":true},{"id":"D-009","phase":"1","src":"log","title":"No UI in Phase 1","date":"2026-10-21","by":"spec","text":"Visibility = Supabase table viewer + bearer-token JSON debug endpoints.","why":"Keep Phase 1 small.","tags":["security","app","data"],"imp":false},{"id":"D-010","phase":"1","src":"log","title":"Idempotency via dedupe_key","date":"2026-10-21","by":"spec","text":"dedupe_key = SHA-256 of canonical JSON (sorted keys); duplicate inserts ignored.","why":"Teams may retry; edits reuse message id so activity id alone isn't unique.","tags":["data"],"imp":true},{"id":"D-011","phase":"1","src":"log","title":"Edits create versions; deletes are soft","date":"2026-10-21","by":"spec","text":"messages holds latest; message_versions holds every version; deletes set deleted_at.","why":"Phase 3 needs \"date changed from X to Y\".","tags":["security","process"],"imp":true},{"id":"D-012","phase":"1","src":"log","title":"Private GitHub repo","date":"2026-10-21","by":"spec","text":"Repo is private.","why":"Contains a bot that reads class messages.","tags":["security","infra"],"imp":false},{"id":"D-013","phase":"1","src":"log","title":"Timestamps are UTC timestamptz","date":"2026-10-21","by":"spec","text":"All timestamps timestamptz in UTC.","why":"Avoid timezone bugs; convert to IST only for display.","tags":[],"imp":false},{"id":"D-014","phase":"1","src":"log","title":"Product name","date":"2026-10-21","by":"spec","text":"Working name Skim; Teams app display name \"Skim · Course Updates\".","why":"Name should make purpose obvious to professors.","tags":["app"],"imp":false},{"id":"D-015","phase":"1","src":"log","title":"Flat repo layout; PHASE1.md stays in Bookkeeping/","date":"2026-10-21","by":"claude-code","text":"The repo root is the project root (no extra skim/ folder). The spec lives in Bookkeeping/PHASE1.md, which the human's .gitignore excludes, so it is not committed.","why":"That is how the repo was set up; I did not change the human's ignore rule.","tags":["process"],"imp":false},{"id":"D-016","phase":"1","src":"log","title":"Dependencies: drop hosting-teams, pin 1.9.0","date":"2026-10-21","by":"claude-code","text":"Depend on microsoft-agents-hosting-core, -hosting-aiohttp, -authentication-msal, -activity (all 1.9.0), aiohttp 3.14.5, asyncpg 0.32.0. microsoft-agents-hosting-teams is not used.","why":"It is deprecated (its import warns to use -msteams) and Phase 1 needs none of its Teams helpers: we read raw JSON and send plain text. See DIFF-001.","tags":["security"],"imp":false},{"id":"D-017","phase":"1","src":"log","title":"Capture raw in the HTTP handler, before the SDK","date":"2026-10-21","by":"claude-code","text":"/api/messages parses the body, stores the raw JSON and normalises it, then hands the request to the SDK; reply handlers read the result from a ContextVar.","why":"The SDK's before_turn hook runs after _remove_mentions mutates the activity text, which would break D-006 (unmodified raw). Capturing earlier also stores activities the SDK would reject. See DIFF-002.","tags":[],"imp":true},{"id":"D-018","phase":"1","src":"log","title":"Thread messages share the channel's conversation_id","date":"2026-10-21","by":"claude-code","text":"Strip ;messageid=N from conversation.id for conversations/messages/etc. reply_to_id = replyToId if present, else the ;messageid= root when it differs from the message's own id.","why":"Otherwise every thread would be a separate conversation and (conversation_id, message_id) lookups for replies, edits and reactions would not line up. Real payloads must confirm what Teams sends (acceptance checklist).","tags":["process"],"imp":false},{"id":"D-019","phase":"1","src":"log","title":"text/html content lives on the message, not in attachments","date":"2026-10-21","by":"claude-code","text":"The text/html attachment goes to messages.html; attachments rows are for everything else.","why":"Avoids duplicating the body as an 'attachment'. The raw payload still has everything.","tags":[],"imp":false},{"id":"D-020","phase":"1","src":"log","title":"Failure policy on /api/messages","date":"2026-10-21","by":"claude-code","text":"Storage failure while saving the raw row => 500 (Teams retries, nothing lost). Normalisation failure => logged, raw kept, 202. SDK/turn errors, unknown types => logged, 202. Invalid JSON / non-object body => 400.","why":"FR-15 forbids 5xx for unknown/malformed activities, but a DB outage is different: failing loudly lets Teams redeliver.","tags":["data","process"],"imp":false},{"id":"D-021","phase":"1","src":"log","title":"Bot is truly silent: typing indicator off, errors swallowed","date":"2026-10-21","by":"claude-code","text":"start_typing_timer=False and an app.error handler that logs and never replies.","why":"The SDK would otherwise send typing indicators and re-raise turn errors; D-007 says never speak except for FR-7/FR-9.","tags":["app","process"],"imp":false},{"id":"D-022","phase":"1","src":"log","title":"schema_migrations is created by migrate.py","date":"2026-10-21","by":"claude-code","text":"scripts/migrate.py creates schema_migrations itself; 001_init.sql contains only the domain tables.","why":"The runner must have the table before it can know what to apply. See DIFF-003.","tags":["app","data"],"imp":false},{"id":"D-023","phase":"1","src":"log","title":"JWT check scoped to /api/messages","date":"2026-10-21","by":"claude-code","text":"Use jwt_authorization_decorator on that route only instead of app-wide middleware.","why":"/health must be unauthenticated and /debug uses its own bearer token (FR-10, FR-11).","tags":["security","app"],"imp":false},{"id":"D-024","phase":"1","src":"log","title":"Welcome only for team installs; pairing code only on install","date":"2026-10-21","by":"claude-code","text":"installationUpdate add without channelData.team (personal or group-chat installs) stores raw and sends nothing. The code is computed when the install is processed.","why":"FR-7 says 'in a team'. Code is deterministic so it can be recomputed any time.","tags":["ai","app"],"imp":false},{"id":"D-025","phase":"1","src":"log","title":"Edit/delete for an unseen message","date":"2026-10-21","by":"claude-code","text":"Create the messages row from that event at version 1 with the event name as given (edited/deleted/undeleted) and log a warning with the raw id.","why":"Spec rule in §5.","tags":["security","process"],"imp":false},{"id":"D-026","phase":"1","src":"log","title":"Supabase pooler detection","date":"2026-10-21","by":"claude-code","text":"statement_cache_size=0 whenever the DSN contains :6543. migrate.py always uses 0.","why":"Transaction-mode pooler cannot use prepared statements.","tags":["data","infra"],"imp":false},{"id":"D-027","phase":"1","src":"log","title":"Tooling","date":"2026-10-21","by":"claude-code","text":"pyproject.toml + setuptools, src layout, venv via uv, pytest-asyncio in auto mode, hand-rolled PNG icons for the manifest (no Pillow), placeholder developer URLs (example.com) in the manifest.","why":"Fewest dependencies; placeholders are fine for sideloading in our own tenant.","tags":["security","process"],"imp":false},{"id":"D-028","phase":"1","src":"log","title":"Manifest version 1.0.0 and supportsChannelFeatures tier1","date":"2026-10-22","by":"human","text":"Teams app manifest version is 1.0.0 (was 0.1.0) and the top-level supportsChannelFeatures is \"tier1\".","why":"Requested by the human.","tags":["app"],"imp":false},{"id":"D-029","phase":"1","src":"log","title":"Welcome triggers and once-per-install tracking","date":"2026-10-22","by":"human (spec for this change supplied by the human), details by claude-code","text":"The welcome + pairing code is sent when (a) installationUpdate action starts with add (including add-upgrade), or (b) conversationUpdate.membersAdded contains the bot (member.id == recipient.id) in a team conversation. Both set the team's install state via one path. New column teams.welcome_sent_at (migration 002) is claimed atomically (update ... where welcome_sent_at is null), so retries, duplicates, add-upgrade and the two signals together post at most once. A fresh install (never installed, or removed_at set) resets the claim, so reinstalling welcomes again. If the send itself fails it is logged and not retried.","why":"Teams does not reliably send installationUpdate for team installs; the membersAdded signal covers that gap. Tracking on the teams row survives restarts and multiple server instances, unlike in-memory flags.","tags":["app","data","process"],"imp":false},{"id":"P2-D-001","phase":"2","src":"log","title":"Graph over aiohttp, no Graph SDK (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"Call Microsoft Graph v1.0 over HTTPS with aiohttp through one client module (graph.py).","why":"Few dependencies; full control of retries and throttling.","tags":["process"],"imp":false},{"id":"P2-D-002","phase":"2","src":"log","title":"Graph uses the bot's app registration (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"Client-credentials flow, scope [url] tenant/client from the existing service-connection settings; token cached in memory until ~5 min before expiry.","why":"'Bot's app identity'; no new secrets.","tags":["security","app","process"],"imp":false},{"id":"P2-D-003","phase":"2","src":"log","title":"Graph application permissions (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"Files.Read.All, Team.ReadBasic.All, Channel.ReadBasic.All, ChannelMessage.Read.All, admin-consented in the test tenant. Least-privilege option for a university: Sites.Selected plus the bot's RSC permissions (e.g. ChannelMessage.Read.Group). Untested: whether /filesFolder accepts Sites.Selected.","why":"Test tenant needs speed; a university will not grant tenant-wide read.","tags":["security","app","design","process"],"imp":false},{"id":"P2-D-004","phase":"2","src":"log","title":"Metadata only for files (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"Store name, path, size, MIME type, timestamps, modifier, webUrl, driveId/itemId, eTag, deleted flag. Never download or store file bytes.","why":"Files stay in Teams; we store links.","tags":["security","process"],"imp":false},{"id":"P2-D-005","phase":"2","src":"log","title":"Delta per drive root, items attributed by path (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"Track one delta token per drive on /drives/{id}/root/delta; attribute items to channels by path under each channel's filesFolder. Private/shared channels with their own drive get their own token.","why":"SharePoint/OneDrive for Business supports delta only on a drive's root, not sub-folders (to be verified in the tenant).","tags":["security","process"],"imp":false},{"id":"P2-D-006","phase":"2","src":"log","title":"Resolve paths from stored parents (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"Delta often omits parentReference.path; compute paths from stored documents via parent_item_id and fetch unknown parents from Graph. Folder rename/move recomputes descendants.","why":"Needed for correct paths on rename/move.","tags":["process"],"imp":false},{"id":"P2-D-007","phase":"2","src":"log","title":"Delta token expiry fallback (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"On 410 Gone / resyncRequired drop the token, do a full recursive listing, and mark items not seen as deleted.","why":"Documented delta-token expiry behaviour.","tags":["security","process"],"imp":false},{"id":"P2-D-008","phase":"2","src":"log","title":"Soft deletes for documents (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"deleted=true and deleted_at; rows never removed.","why":"History and idempotency (as D-011).","tags":["security","process"],"imp":false},{"id":"P2-D-009","phase":"2","src":"log","title":"Jobs run inside the request with a time budget (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"POST /jobs/* do their work synchronously within a budget (default 240 s), save progress, return partial when over budget, and are guarded by a DB lock (409 if running).","why":"Cloud Run throttles CPU outside requests; Cloud Scheduler can wait for a response.","tags":["process"],"imp":false},{"id":"P2-D-010","phase":"2","src":"log","title":"Separate JOBS_TOKEN (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"Job endpoints use a bearer JOBS_TOKEN (constant-time compare), distinct from DEBUG_TOKEN; not registered when unset. Cloud Scheduler sends it from Secret Manager.","why":"Different blast radius from read-only debug endpoints.","tags":["security","infra","process"],"imp":false},{"id":"P2-D-011","phase":"2","src":"log","title":"Graph messages are raw-first with provenance (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"Store the Graph JSON in raw_activities (source='graph', activity_type='graphMessage', dedupe_key per D-010); messages and raw_activities get a source column (live|graph).","why":"Consistency with D-006; we can always tell where a row came from.","tags":["data","process"],"imp":false},{"id":"P2-D-012","phase":"2","src":"log","title":"Dedupe live vs Graph messages; live wins (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"Natural key (conversation_id, message_id): the Graph channel-message id is expected to equal the Teams activity id and the channel id the Phase 1 conversations.id (to verify). A Graph copy never overwrites an existing messages row; later live edits/deletes version normally. A Graph message with lastEditedDateTime is stored as version 1 with its current text.","why":"No duplicates and no lost live history; older text of pre-install edits is unrecoverable.","tags":["security","data","process"],"imp":false},{"id":"P2-D-013","phase":"2","src":"log","title":"Attachment linking never creates documents (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"attachments gets a nullable FK to documents(drive_id,item_id). Match by normalised URL equality (contentUrl vs webUrl), then attachment id equals the GUID inside the document eTag; unmatched stay unlinked until a later run.","why":"Prevents duplicate documents.","tags":["process"],"imp":false},{"id":"P2-D-014","phase":"2","src":"log","title":"Initial sync via next scheduled run plus best-effort kick (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"A team with no sync_state/backfill_state is processed fully by the next scheduled run (<= ~15 min). Install also fires a best-effort background kick; correctness never depends on it.","why":"The install handler must stay fast and Cloud Run may throttle background work.","tags":["process"],"imp":false},{"id":"P2-D-015","phase":"2","src":"log","title":"Skip removed teams (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"Jobs skip teams with removed_at set or no aad_group_id; existing data is kept.","why":"Respect uninstalls.","tags":["process"],"imp":false},{"id":"P2-D-016","phase":"2","src":"log","title":"Throttling and retry policy (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"Honour Retry-After on 429/503; otherwise exponential backoff with jitter (base 1 s, cap 30 s), max 5 attempts; refresh token once on 401; concurrency cap 4; a Retry-After longer than the remaining budget ends the run as partial.","why":"Graph throttles per app and tenant.","tags":["security","app","process"],"imp":false},{"id":"P2-D-017","phase":"2","src":"log","title":"Follow nextLink verbatim (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"Never construct page URLs; channel messages $top=50, files $top=200.","why":"Graph paging contract.","tags":["security","process"],"imp":false},{"id":"P2-D-018","phase":"2","src":"log","title":"Migration numbering and order (superseded by Phase 2 spec v2)","date":"2026-10-22","by":"spec","text":"Phase 2 migrations start at 003_*.sql and are applied before deploying code that needs them.","why":"Lesson from Phase 1 (welcome_sent_at).","tags":["data","infra","process"],"imp":false},{"id":"D-030","phase":"1","src":"log","title":"Bookkeeping markdown is kept out of git","date":"2026-10-22","by":"human","text":"DECISIONS.md, DIFF.md and ELI5.md moved into Bookkeeping/ (alongside PHASE1.md, PHASE2.md), which stays git-ignored. They were removed from the index with git rm --cached and stay on disk. README.md stays tracked. Earlier commits still contain the old copies in history; they are not rewritten. The earlier idea of un-ignoring Bookkeeping/ is cancelled.","why":"Specs and working notes should not live in the repo.","tags":["data","process"],"
